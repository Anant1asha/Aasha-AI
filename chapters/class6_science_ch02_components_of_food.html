<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aasha Learn — Components of Food (Class 6 Science Ch 2)</title>
<style>

:root{
  --bg0:#070c12; --bg1:#0d1620; --panel:#121c27; --panel2:#16222f;
  --ink:#eef5fa; --ink2:#c9d9e6; --muted:#8ba2b6;
  --teal:#31e6c4; --teal2:#19b79e; --gold:#ffc247; --gold2:#ffd98a;
  --red:#ff5f78; --green:#4ade80; --blue:#63a9ff; --violet:#9d7bff;
  --line:rgba(125,185,225,.14); --line2:rgba(125,185,225,.24);
  --r:14px; --r2:18px;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(49,230,196,.10), transparent 62%),
    radial-gradient(900px 520px at 6% 108%, rgba(255,194,71,.08), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  background-attachment:fixed;font-size:16px}
.app{max-width:1200px;margin:0 auto;padding:10px 14px 10px;display:flex;flex-direction:column;
  gap:10px;height:100dvh}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--teal),var(--gold));
  display:grid;place-items:center;color:#06231f;font-weight:900;font-size:16px}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1.15}
.brand em{font-style:normal;color:var(--teal)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-top:2px}
.chip{margin-left:auto;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;font-weight:700}
.chip b{color:var(--gold)}

/* ---------- progress bar ---------- */
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- card ---------- */
.card{flex:1 1 auto;min-height:0;overflow:hidden;border-radius:var(--r2);
  background:linear-gradient(168deg,var(--panel2),var(--panel) 55%,#101a24);
  border:1px solid var(--line2);
  box-shadow:0 18px 44px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.045);
  padding:16px 20px;display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head" "txt" "vis" "ctl"}
.card .head{grid-area:head}
.card .txt{grid-area:txt;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.card .visual{grid-area:vis;min-height:0;overflow:hidden;border-radius:14px;
  background:radial-gradient(120% 100% at 50% 0%, rgba(49,230,196,.07), rgba(10,17,24,.55));
  border:1px solid rgba(125,185,225,.10);display:grid;place-items:center;padding:6px}
.card .visual svg{width:100%;height:100%;max-height:340px;display:block}
.card .ctl{grid-area:ctl}

@media (min-width:900px){
  .card.split{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "txt vis" "txt ctl"}
  .card.split .txt{padding-right:12px}
}

/* ---------- typography ---------- */
.kindrow{display:flex;align-items:center;gap:9px;flex:0 0 auto;margin-bottom:4px}
.kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:var(--teal);background:rgba(49,230,196,.10);border:1px solid rgba(49,230,196,.24);
  padding:3px 10px;border-radius:999px}
h1{font-size:clamp(23px,3.2vw,31px);line-height:1.22;margin:0;letter-spacing:-.015em;font-weight:800;color:#fff}
h2{font-size:clamp(19.5px,2.6vw,25px);line-height:1.26;margin:0;letter-spacing:-.01em;font-weight:800;color:#fff}
p.b{font-size:clamp(16.5px,2vw,19.5px);line-height:1.68;margin:0;color:var(--ink2)}
p.b strong{color:#fff;font-weight:750}
.sub{color:var(--muted);font-size:clamp(14.5px,1.7vw,17px);margin:0;font-weight:600}
.em{vertical-align:-4px;margin-right:6px}

/* Acharya Mentor Bubble */
.mentor-bubble{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-top:4px}
.mentor-av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),#c07a12);color:#221501;font-size:18px;font-weight:900;flex:none}
.mentor-msg{flex:1;font-size:clamp(15px,1.8vw,17.5px);line-height:1.6;color:#ffe6a8}
.mentor-name{font-size:10.5px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}

/* ---------- footer & buttons ---------- */
.tapline{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.taphint{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.taphint b{color:var(--gold);font-weight:700}
@media (max-width:560px){.taphint{display:none}}

button{font:inherit;font-size:15px;font-weight:700;cursor:pointer;border-radius:12px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);
  padding:11px 20px;min-height:46px;transition:transform .08s ease, background .15s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:linear-gradient(180deg,#37ebca,#16a98f);color:#052a24;border:0;font-weight:800;
  box-shadow:0 8px 20px -8px rgba(49,230,196,.75)}
button.gho{background:transparent}

/* quiet Hindi toggle pill */
.hiWrap{display:inline}
.hiBox{display:block}
.hiBox[hidden]{display:none}
.hiBtn{display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:6px 14px;margin-left:8px;vertical-align:middle;
  font-size:13px;font-weight:800;line-height:1;border-radius:999px;
  color:var(--gold);background:rgba(255,194,71,.12);
  border:1.5px solid rgba(255,194,71,.35);cursor:pointer;transition:all .15s ease}
.hiBtn:hover{opacity:1;background:rgba(255,194,71,.25)}
.hiBtn.on{background:var(--gold);color:#2a1d00;border-color:transparent}
.hiBox{margin-top:9px;padding:12px 16px;border-left:3.5px solid var(--gold);
  background:linear-gradient(90deg,rgba(255,194,71,.12),rgba(255,194,71,.04));
  border-radius:0 12px 12px 0;font-size:clamp(15.5px,1.85vw,18.5px);line-height:1.64;color:#ffe6a8}

/* ---------- tapable word ---------- */
.tapable{cursor:pointer;border-bottom:1.5px dotted rgba(49,230,196,.6);transition:background .12s}
.tapable:hover{background:rgba(49,230,196,.12);border-radius:3px}
.tapable:active{background:rgba(49,230,196,.25)}
.conn{color:var(--teal);font-weight:600}

/* ---------- tables ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:clamp(15px,1.7vw,17.5px);
  border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:center}
tr:last-child td{border-bottom:0}
th{background:rgba(49,230,196,.09);font-weight:800;color:#d9f7f1}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}

/* ---------- steps ---------- */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-left:3px solid var(--teal);
  border-radius:10px;padding:11px 13px;font-size:clamp(15.5px,1.85vw,18.5px);line-height:1.55}
.step .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--teal);color:#06231f;
  font-weight:900;font-size:12.5px;display:grid;place-items:center;margin-top:1px}

/* ---------- quiz options ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.035);
  font-size:clamp(15.5px,1.85vw,18.5px);cursor:pointer;min-height:50px;display:flex;align-items:center;gap:11px;
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.opt .k{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.09);display:grid;
  place-items:center;font-size:12.5px;font-weight:800;color:var(--ink2);flex:0 0 auto}
.opt.ok{border-color:var(--green);background:rgba(74,222,128,.14)}
.opt.ok .k{background:var(--green);color:#06231f}
.opt.no{border-color:var(--red);background:rgba(255,95,120,.14)}
.opt.no .k{background:var(--red);color:#2a0009}
.fb{font-size:clamp(15px,1.8vw,18px);line-height:1.58;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.40);color:#baf4d0}
.fb.no{background:rgba(255,95,120,.12);border:1px solid rgba(255,95,120,.40);color:#ffc4cb}

/* ---------- rows & cards ---------- */
.mrow{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.mrow b{display:block;font-size:clamp(16px,1.9vw,19px);margin-bottom:2px;color:#fff}
.mrow span{font-size:clamp(14.5px,1.75vw,17.5px);color:var(--ink2);line-height:1.52}

/* ---------- sim controls ---------- */
.simctl{display:flex;flex-direction:column;gap:10px}
.simctl input[type=range]{width:100%;accent-color:var(--teal);height:44px;min-height:44px;margin:2px 0;cursor:pointer}
.readout{display:flex;gap:16px;flex-wrap:wrap;font-size:clamp(14.5px,1.75vw,17.5px);color:var(--ink2)}
.readout b{color:var(--teal);font-size:clamp(16.5px,2vw,19.5px);font-weight:800}
.hint{font-size:clamp(14px,1.7vw,17px);color:var(--gold);line-height:1.52;
  background:rgba(255,194,71,.07);border-left:3px solid var(--gold);
  padding:10px 14px;border-radius:0 10px 10px 0}
.switch{display:flex;gap:8px}
.switch button{flex:1;font-size:14px;padding:10px;min-height:46px}
.switch button.on{background:var(--teal);color:#052a24;border-color:transparent;font-weight:800}

/* ---------- word panel ---------- */
#wp{position:fixed;left:0;right:0;bottom:0;transform:translateY(130%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
  background:linear-gradient(180deg,#162536,#0d1822);
  border-top:1px solid var(--line2);
  padding:16px 20px calc(16px + var(--safe));
  z-index:100;box-shadow:0 -18px 46px rgba(0,0,0,.75);border-radius:18px 18px 0 0;max-width:1200px;margin:0 auto}
#wp.up{transform:translateY(0)}
#wp .r1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#wpWord{font-weight:800;font-size:22px;letter-spacing:-.01em;color:#fff}
#wpHindi{color:var(--gold);font-size:20px;font-weight:700}
#wpPron{color:var(--muted);font-size:15px}
.spk{background:rgba(255,255,255,.08);border:1px solid var(--line2);border-radius:999px;
  padding:11px 20px;min-height:46px;min-width:46px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer}
.spk:hover{background:var(--teal);color:#052a24}
.spk.cls{margin-left:auto;background:rgba(255,95,120,.12);border-color:rgba(255,95,120,.35);color:#ffc2cb}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">अ</div>
    <div class="brand">AASHA <em>LEARN</em><small>Class 6 Science · Chapter 2: Components of Food</small></div>
    <div class="chip" id="chip">1 / 20</div>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="tapline">
    <button id="prev" class="gho" aria-label="Previous">◀</button>
    <button id="next" class="pri">Next ▶</button>
    <span class="taphint">Tap any word → <b>हिंदी</b></span>
    <button id="hiAll" class="gho" style="margin-left:auto">हिंदी</button>
  </div>
</div>
<div id="wp" role="dialog" aria-label="Word meaning">
  <div class="r1">
    <span id="wpWord"></span><span id="wpHindi"></span><span id="wpPron"></span>
    <button class="spk" id="wpSpeak">🔊 Hear it</button>
    <button class="spk cls" id="wpClose">Close ✕</button>
  </div>
</div>

const PH = {"Ten concepts, one slide-journey. Finish each check to unlock the next concept.": "दस विषय, एक स्लाइड-यात्रा। अगला विषय खोलने के लिए हर चेक पूरा करो।", "s where it becomes real — read this slowly.": "अब यह असली ज़िंदगी से जुड़ता है — इसे धीरे पढ़ो।", "Why should this chapter matter to you?": "यह अध्याय तुम्हारे लिए क्यों ज़रूरी है?", "In 1991, India nearly went broke. Not for years — for two weeks. It could not even pay for the petrol it needed.": "1991 में भारत लगभग दिवालिया हो गया था। सालों के लिए नहीं — दो हफ़्तों के लिए। अपनी ज़रूरत का पेट्रोल तक नहीं खरीद सकता था।", "s monthly budget, the price at the petrol pump, the jobs open to you, and the phone in your hand. So this is not old history. It is your present — and your future.": "इसके बाद भारत ने जो किया, उसने तुम्हारे घर का महीने का बजट, पेट्रोल पंप का दाम, तुम्हारे लिए खुलने वाली नौकरियाँ और तुम्हारे हाथ का फ़ोन — सब बदल दिया। इसलिए यह पुरानी कहानी नहीं है। यह तुम्हारा वर्तमान है — और तुम्हारा भविष्य।", "1991: the year India almost ran out of money": "1991: वह साल जब भारत के पास पैसा लगभग ख़त्म हो गया", "Every time India buys petrol or machines from abroad, it pays in dollars. And those dollars come from what we sell abroad.": "जब भी भारत बाहर से पेट्रोल या मशीनें खरीदता है, वह डॉलर में पैसे देता है। और वे डॉलर इससे आते हैं जो हम बाहर बेचते हैं।", "In 1991, our dollar savings had shrunk so far that they could pay for barely two weeks of imports. Two weeks — and then nothing. That is where our story begins.": "1991 में हमारी डॉलर बचत इतनी घट गई थी कि वह मुश्किल से दो हफ़्ते का आयात कर सकती थी। दो हफ़्ते — और फिर कुछ नहीं। यहीं से हमारी कहानी शुरू होती है।", "It did not happen in a day. It leaked.": "यह एक दिन में नहीं हुआ। यह चुपचाप रिसता गया।", "Through the 1980s the government spent more than it earned, year after year. To fill the gap, it borrowed — from banks, from people like us, and from foreign lenders.": "1980 के दशक में सरकार हर साल अपनी कमाई से ज़्यादा खर्च करती रही। यह अंतर भरने के लिए उसने उधार लिया — बैंकों से, हम जैसे लोगों से, और विदेशी ऋणदाताओं से।", "Meanwhile, imports kept climbing and exports did not keep up. Money flowed out faster than it flowed in. A small leak, ignored long enough, becomes a flood.": "इस बीच आयात बढ़ते रहे और निर्यात साथ नहीं चले। पैसा आने से तेज़ी से बहता गया। छोटी-सी रिसन, ज़्यादा देर नज़रअंदाज़ की जाए तो बाढ़ बन जाती है।", "The fortnight that shook India": "वह पखवाड़ा जिसने भारत को हिला दिया", "By 1991 India could not repay what it had borrowed abroad. Reserves could not cover even a fortnight of imports, and the prices of everyday goods were climbing fast.": "1991 तक भारत विदेश से लिया उधार चुका नहीं सकता था। भंडार दो हफ़्ते का आयात भी नहीं कर सकता था, और रोज़मर्रा की चीज़ों की कीमतें तेज़ी से चढ़ रही थीं।", "And no one — no country, no bank — would lend us a rupee more. When a family reaches this point, it sells its jewellery. When a country reaches it, it must change its rules. That is exactly what India did next.": "और कोई नहीं — कोई देश नहीं, कोई बैंक नहीं — हमें एक रुपया और उधार देने को तैयार था। जब परिवार इस हाल में पहुँचता है, तो गहने बेचता है। जब देश पहुँचता है, तो उसे अपने नियम बदलने पड़ते हैं। भारत ने ठीक यही किया।", "Watch the reserves run out": "भंडार ख़त्म होते देखो", "Slide it and feel the pressure: how few weeks of cover does it take before a country is in real trouble?": "स्लाइडर सरकाओ और दबाव महसूस करो: कितने ही कम हफ़्तों का भंडार होने पर देश सचमुच मुसीबत में आ जाता है?", "The lifeline came with conditions": "जीवनदान शर्तों के साथ आया", "India knocked on two doors: the World Bank and the IMF. They agreed to lend seven billion dollars — a genuine lifeline.": "भारत ने दो दरवाज़े खटखटाए: विश्व बैंक और IMF। उन्होंने सात अरब डॉलर उधार देने पर हामी भरी — सचमुच एक जीवनदान।", "s grip. Cut the trade barriers. Take the loan — but change how you run the country.": "पर इतना पैसा कभी मुफ़्त नहीं आता। शर्त यह थी: अर्थव्यवस्था खोलो। निजी फर्मों को आने दो। सरकार की पकड़ ढीली करो। व्यापार की बाधाएँ घटाओ। क़र्ज़ लो — पर देश चलाने का तरीक़ा बदलो।", "The New Economic Policy, 1991": "नई आर्थिक नीति, 1991", "India accepted the terms and announced a New Economic Policy. One word captures its whole aim: competition.": "भारत ने शर्तें मान लीं और नई आर्थिक नीति की घोषणा की। इसका पूरा मक़सद एक शब्द में है: प्रतिस्पर्धा।", "Knock down the walls that kept firms out. Let businesses enter, grow, and fight for the customer. A country that competes grows strong. A country that hides grows weak.": "वे दीवारें गिराओ जो फर्मों को बाहर रखती थीं। कारोबारों को आने दो, बढ़ने दो, और ग्राहक के लिए लड़ने दो। जो देश प्रतिस्पर्धा करता है वह मज़बूत बनता है। जो छिपता है वह कमज़ोर पड़ता है।", "Two problems, two medicines": "दो समस्याएँ, दो दवाएँ", "s strength.": "सोचो एक मरीज़ जो एक साथ ख़ून बहा रहा है और कमज़ोर भी है। अच्छा डॉक्टर दो काम करता है। पहले ख़ून रोकता है — तुरंत। फिर महीनों में मरीज़ की ताक़त लौटाता है।", "s treatment had two halves too. Stabilisation = stop the bleeding: fix the balance of payments and control rising prices. Structural reform = build strength: make the economy efficient and globally competitive for the long run.": "भारत के इलाज के भी दो हिस्से थे। स्थिरीकरण = ख़ून रोकना: भुगतान संतुलन ठीक करना और बढ़ती कीमतें काबू में लाना। संरचनात्मक सुधार = ताक़त बनाना: लंबे समय के लिए अर्थव्यवस्था को दक्ष और विश्व-प्रतिस्पर्धी बनाना।", "Short-term relief, long-term cure. Examiners love to make you mix these two up. Do not let them.": "अल्पकालिक राहत, दीर्घकालिक इलाज। परीक्षक इन दोनों को आपस में उलझाना बहुत पसंद करते हैं। उन्हें मौक़ा मत दो।", "Sort the measures": "उपायों को छाँटो", "Three pillars hold the reform": "सुधार के तीन स्तंभ", "The long-term cure stood on three pillars: liberalisation, privatisation and globalisation.": "दीर्घकालिक इलाज तीन स्तंभों पर खड़ा था: उदारीकरण, निजीकरण और वैश्वीकरण।", "Free your own rules. Let private hands run business. Join the world. Three words — and the rest of this chapter explains each one.": "अपने नियम ढीले करो। निजी हाथों को कारोबार चलाने दो। दुनिया से जुड़ो। तीन शब्द — और इस अध्याय का बाक़ी हिस्सा हर एक को समझाता है।", "Taking off the chains": "ज़ंजीरें खोलना", "Before 1991, starting a business in India was like needing a passport to open a shop. You needed a licence to begin, a licence to expand, even permission to decide how much you could make. This was the licence raj.": "1991 से पहले भारत में कारोबार शुरू करना दुकान खोलने के लिए पासपोर्ट माँगने जैसा था। शुरू करने के लिए लाइसेंस, बढ़ाने के लिए लाइसेंस, और यह तय करने तक की इजाज़त कि कितना बनाओगे। यही लाइसेंस राज था।", "Liberalisation means removing those chains and opening the doors to private and foreign firms. Some steps came in the 1980s — but 1991 tore down far more.": "उदारीकरण का अर्थ है वे ज़ंजीरें हटाना और निजी व विदेशी फर्मों के लिए दरवाज़े खोलना। कुछ क़दम 1980 के दशक में उठाए गए — पर 1991 ने कहीं ज़्यादा गिराया।", "The licence raj ends": "लाइसेंस राज का अंत", "The reforms abolished industrial licensing for almost every product. An entrepreneur could now start, grow or close a business without begging for permission.": "सुधारों ने लगभग हर उत्पाद से औद्योगिक लाइसेंसिंग समाप्त कर दी। अब कोई उद्यमी इजाज़त के लिए गिड़गिड़ाए बिना कारोबार शुरू, बढ़ा या बंद कर सकता था।", "A short, stubborn list stayed licensed — learn it, it is a favourite exam question: alcohol, cigarettes, hazardous chemicals, industrial explosives, electronics, aerospace, and drugs and pharmaceuticals.": "एक छोटी, ज़िद्दी सूची लाइसेंस में बनी रही — इसे याद रखो, यह परीक्षा का पसंदीदा सवाल है: शराब, सिगरेट, ख़तरनाक रसायन, औद्योगिक विस्फोटक, इलेक्ट्रॉनिक्स, वायु-अंतरिक्ष, और औषधियाँ।", "And only two things stayed locked to the government: atomic energy generation, and the core activities of the railways.": "और सरकार के पास सिर्फ़ दो चीज़ें बंद रहीं: परमाणु ऊर्जा उत्पादन, और रेलवे की मुख्य गतिविधियाँ।", "Dereservation — and who sets the price": "आरक्षण हटना — और कीमत कौन तय करता है", "Many goods that only small-scale industries were allowed to make were now dereserved.": "जो वस्तुएँ पहले सिर्फ़ लघु उद्योग बना सकते थे, उनका आरक्षण अब हटा दिया गया।", "And prices? In most industries, the market — not a government office — would now decide. That one change quietly decides what you pay for almost everything.": "और कीमतें? अधिकतर उद्योगों में अब बाज़ार तय करता था, कोई सरकारी दफ़्तर नहीं। यही एक बदलाव चुपचाप तय करता है कि तुम हर चीज़ के लिए कितना देते हो।", "What still needs a licence?": "अब भी किसे लाइसेंस चाहिए?", "Tap each product. Guess whether it stayed under licensing after 1991 — then find out.": "हर उत्पाद पर टैप करो। अंदाज़ा लगाओ कि 1991 के बाद वह लाइसेंस में रहा या नहीं — फिर जवाब देखो।", "s heart: banks and the RBI": "अर्थव्यवस्था का दिल: बैंक और RBI", "Commercial banks, investment banks, stock exchanges, the foreign exchange market — together they are the financial sector. Money moves through them the way blood moves through a body.": "वाणिज्यिक बैंक, निवेश बैंक, शेयर बाज़ार, विदेशी मुद्रा बाज़ार — ये सब मिलकर वित्तीय क्षेत्र हैं। इनके ज़रिए पैसा ऐसे चलता है जैसे शरीर में ख़ून।", "And in India, one institution watches over all of it: the Reserve Bank of India — the RBI.": "और भारत में इन सब पर एक संस्था नज़र रखती है: भारतीय रिज़र्व बैंक — RBI।", "From controller to facilitator": "नियंत्रक से सुविधाकारक तक", "The RBI decides how much cash banks must keep, what interest rates will be, and who gets loans. Earlier, it controlled almost every decision a bank made.": "RBI तय करता है कि बैंकों को कितना नक़द रखना है, ब्याज दरें क्या होंगी, और किसे क़र्ज़ मिलेगा। पहले यह बैंक के लगभग हर फ़ैसले को नियंत्रित करता था।", "The reform changed its role: from controller to facilitator. Now banks take many decisions themselves, and the RBI guides and enables instead of bossing every move.": "सुधार ने इसकी भूमिका बदली: नियंत्रक से सुविधाकारक। अब बैंक कई फ़ैसले ख़ुद लेते हैं, और RBI हर क़दम पर हुक्म चलाने के बजाय मार्गदर्शन देता है और रास्ता खोलता है।", "Think about it: a parent who decides everything raises a child who can decide nothing. The same is true of banks.": "सोचो: जो माता-पिता हर बात तय करते हैं, वे ऐसा बच्चा पालते हैं जो कुछ तय नहीं कर सकता। बैंकों के साथ भी यही सच है।", "New players enter the game": "खेल में नए खिलाड़ी", "Private banks were allowed — Indian and foreign. Foreign investment in banks was raised to about 74 per cent.": "निजी बैंकों को इजाज़त मिली — भारतीय और विदेशी। बैंकों में विदेशी निवेश की सीमा लगभग 74 प्रतिशत तक बढ़ा दी गई।", "Good banks could open new branches without asking the RBI each time. And a new kind of investor arrived: FIIs — Foreign Institutional Investors, like mutual funds and pension funds.": "अच्छे बैंक हर बार RBI से पूछे बिना नई शाखाएँ खोल सकते थे। और एक नया निवेशक आया: FII — विदेशी संस्थागत निवेशक, जैसे म्यूचुअल फ़ंड और पेंशन फ़ंड।", "More players, more competition, better service. That was the bet.": "ज़्यादा खिलाड़ी, ज़्यादा प्रतिस्पर्धा, बेहतर सेवा। यही दाँव लगाया गया था।", "Why cut taxes to earn more tax?": "ज़्यादा कर कमाने के लिए कर क्यों घटाया?", "This sounds backward, so read it twice. If the government taxes income very heavily, people simply hide their income. The government ends up earning less, not more.": "यह उलटा लगता है, इसलिए दो बार पढ़ो। अगर सरकार आय पर बहुत भारी कर लगाती है, तो लोग अपनी आय छिपा देते हैं। नतीजा — सरकार कम कमाती है, ज़्यादा नहीं।", "So from 1991, income-tax rates were cut. The logic: moderate taxes encourage people to save, to work, and to honestly declare what they earn. Corporation tax was cut too.": "इसलिए 1991 से आय-कर की दरें घटाई गईं। तर्क: संतुलित कर लोगों को बचत करने, काम करने और अपनी कमाई ईमानदारी से बताने के लिए प्रोत्साहित करते हैं। निगम कर भी घटाया गया।", "Lower rate, wider net, more honest taxpayers. That is the whole idea in one line.": "कम दर, चौड़ा जाल, ज़्यादा ईमानदार करदाता। पूरा विचार एक पंक्ति में।", "GST: one nation, one tax": "GST: एक राष्ट्र, एक कर", "In 2016 India did something clever. It amended the Constitution so that both the Centre and the states could levy one shared tax on goods and services — the Goods and Services Tax, or GST.": "2016 में भारत ने एक समझदारी भरा क़दम उठाया। उसने संविधान में संशोधन कर केंद्र और राज्य, दोनों को वस्तुओं और सेवाओं पर एक साझा कर लगाने का अधिकार दिया — वस्तु एवं सेवा कर, यानी GST।", "The dream was easy to say and hard to build: one nation, one tax, one market. Fewer forms, less evasion, and no tax wall standing between one state and the next.": "सपना कहना आसान और बनाना मुश्किल था: एक राष्ट्र, एक कर, एक बाज़ार। कम फ़ॉर्म, कम चोरी, और एक राज्य से दूसरे के बीच कोई कर की दीवार नहीं।", "Devaluation: a weaker rupee, on purpose": "अवमूल्यन: जान-बूझकर कमज़ोर रुपया", "In 1991, as an emergency step, India devalued the rupee. In plain words: it deliberately made the rupee worth less against the dollar.": "1991 में, एक आपातकालीन क़दम के रूप में, भारत ने रुपये का अवमूल्यन किया। सीधे शब्दों में: उसने जान-बूझकर रुपये की कीमत डॉलर के मुक़ाबले घटा दी।", "Why weaken your own money? Because a cheaper rupee makes your exports cheaper for foreign buyers, and your imports costlier for you. So fewer dollars leave and more come in. It was the tourniquet on the wound.": "अपना ही पैसा कमज़ोर क्यों करें? क्योंकि सस्ता रुपया तुम्हारे निर्यात को विदेशी खरीदारों के लिए सस्ता बनाता है, और तुम्हारे आयात को तुम्हारे लिए महँगा। इसलिए कम डॉलर बाहर जाते हैं और ज़्यादा अंदर आते हैं। यह घाव पर पट्टी थी।", "And it set the rupee free: from then on, markets — not the government — would decide its value.": "और इसने रुपये को आज़ाद कर दिया: उसके बाद बाज़ार इसकी कीमत तय करता है, सरकार नहीं।", "Move the exchange rate": "विनिमय दर हिलाओ", "s value and watch exports and imports respond. Feel why 1991 needed a weaker rupee.": "रुपये की कीमत खींचो और देखो निर्यात-आयात कैसे बदलते हैं। महसूस करो कि 1991 को कमज़ोर रुपया क्यों चाहिए था।", "Why our trade had to open": "हमारा व्यापार क्यों खोलना पड़ा", "To protect Indian factories, we had built high walls: limits on how much could be imported, and very high taxes on imports, called tariffs.": "भारतीय कारखानों की रक्षा के लिए हमने ऊँची दीवारें बना रखी थीं: कितना आयात हो सकता है इसकी सीमाएँ, और आयात पर बहुत ऊँचे कर, जिन्हें सीमा शुल्क कहते हैं।", "Walls protect — and walls also trap. Sheltered from competition, our factories grew slow, costly and inefficient. Protection had quietly turned into weakness.": "दीवारें बचाती भी हैं — और फँसाती भी। प्रतिस्पर्धा से बचे रहकर हमारे कारखाने धीमे, महँगे और अकुशल बन गए। संरक्षण चुपचाप कमज़ोरी बन गया था।", "Dismantle. Reduce. Remove.": "हटाओ। घटाओ। समाप्त करो।", "The trade reforms did exactly three things. Dismantle the quantity limits on imports and exports. Reduce tariff rates. Remove the licensing that imports once needed.": "व्यापार सुधारों ने ठीक तीन काम किए। आयात-निर्यात पर मात्रात्मक सीमाएँ हटाईं। सीमा शुल्क दरें घटाईं। आयात को जो लाइसेंस चाहिए था, वह समाप्त किया।", "Import licensing went — except for hazardous and environmentally sensitive goods. By April 2001, the quantity limits on consumer goods and farm products were gone too.": "आयात लाइसेंसिंग हट गई — ख़तरनाक और पर्यावरण-संवेदनशील वस्तुओं को छोड़कर। अप्रैल 2001 तक उपभोक्ता वस्तुओं और कृषि उत्पादों पर मात्रात्मक सीमाएँ भी हट गईं।", "And export duties were scrapped, so Indian goods could fight harder in foreign markets.": "और निर्यात शुल्क हटा दिए गए, ताकि भारतीय वस्तुएँ विदेशी बाज़ारों में ज़ोर से लड़ सकें।", "Set a tariff, watch trade": "सीमा शुल्क तय करो, व्यापार देखो", "Raise and lower the tariff wall. Notice how protection and higher prices always arrive together.": "सीमा शुल्क की दीवार ऊँची-नीची करो। देखो कि संरक्षण और ऊँची कीमतें हमेशा साथ-साथ आते हैं।", "Handing over the keys": "चाबियाँ सौंपना", "Privatisation means the government lets go of the ownership or the management of an enterprise it runs.": "निजीकरण का अर्थ है कि सरकार किसी अपने चलाए उद्यम की मालिकी या प्रबंधन छोड़ देती है।", "There are two ways to do it: the government withdraws from owning and running it, or it sells the company outright. Simple idea — big consequences.": "इसके दो तरीक़े हैं: सरकार उसे अपने मालिकाने और चलाने से हट जाती है, या कंपनी को सीधे बेच देती है। विचार सरल — नतीजे बड़े।", "Disinvestment: selling a slice": "विनिवेश: एक हिस्सा बेचना", "s shares to the public, that is called disinvestment.": "जब सरकार किसी सार्वजनिक कंपनी के शेयरों का एक हिस्सा जनता को बेचती है, उसे विनिवेश कहते हैं।", "reason: it was quietly selling the family silver.": "सरकार का तर्क: वित्तीय अनुशासन लाना, आधुनिकीकरण, और निजी पैसे व प्रबंधन कौशल से प्रदर्शन सुधारना। आलोचकों का तर्क: यह चुपचाप पुरखों की संपत्ति बेचना था।", "Hold both views at once. This chapter wants you to weigh, not just memorise.": "दोनों नज़रिए साथ रखो। यह अध्याय तुमसे तौलने की उम्मीद करता है, सिर्फ़ रटने की नहीं।", "Maharatna, Navratna, Miniratna": "महारत्न, नवरत्न, मिनीरत्न", "Instead of selling everything, the government gave some public enterprises a special status — Maharatna, Navratna, Miniratna — and, with it, real freedom to decide.": "सब कुछ बेचने के बजाय सरकार ने कुछ सार्वजनिक उद्यमों को विशेष दर्जा दिया — महारत्न, नवरत्न, मिनीरत्न — और साथ में निर्णय लेने की असली आज़ादी।", "Remember the examples: Maharatna — Indian Oil and SAIL. Navratna — HAL, MTNL and IRCTC. Miniratna — BSNL and the Airports Authority of India.": "उदाहरण याद रखो: महारत्न — इंडियन ऑयल और SAIL। नवरत्न — HAL, MTNL और IRCTC। मिनीरत्न — BSNL और भारतीय विमानपत्तन प्राधिकरण।", "The idea was simple: trust them with autonomy, and they will perform.": "विचार सरल था: उन्हें स्वायत्तता के साथ भरोसा दो, वे प्रदर्शन करेंगे।", "How much should the government sell?": "सरकार को कितना बेचना चाहिए?", "Drag the slider. Watch the moment control changes hands — that is the line between a minority sale and a strategic sale.": "स्लाइडर खींचो। वह पल देखो जब नियंत्रण हाथ बदलता है — वही रेखा अल्पमत बिक्री और रणनीतिक बिक्री के बीच है।", "India joins the world": "भारत दुनिया से जुड़ता है", "s — goods, money, services and people moving across borders.": "वैश्वीकरण का अर्थ है भारत की अर्थव्यवस्था का विश्व की अर्थव्यवस्था से हाथ मिलाना — वस्तुएँ, पैसा, सेवाएँ और लोग सीमाओं के आर-पार आते-जाते हैं।", "It is the child of liberalisation and privatisation. Once you open your own doors, you become part of one big global market — for better and for worse.": "यह उदारीकरण और निजीकरण की संतान है। जब तुम अपने दरवाज़े खोलते हो, तुम एक बड़े वैश्विक बाज़ार का हिस्सा बन जाते हो — अच्छे के लिए भी, बुरे के लिए भी।", "Why the world calls India": "दुनिया भारत को क्यों फ़ोन करती है", "Outsourcing means a company pays someone outside — often in another country — to do a job it once did in-house. Legal advice, accounts, advertising, even teaching.": "आउटसोर्सिंग का अर्थ है कि कोई कंपनी बाहर के किसी को — अक्सर दूसरे देश में — वह काम करने के पैसे देती है जो पहले वह ख़ुद करती थी। कानूनी सलाह, हिसाब-किताब, विज्ञापन, पढ़ाना तक।", "Why India? Two reasons. Our wages are lower, and our skilled, English-speaking workers are plenty. Add fast internet, and work crosses the world in seconds.": "भारत क्यों? दो कारण। हमारी मज़दूरी कम है, और हमारे कुशल, अंग्रेज़ी बोलने वाले कामगार बहुत हैं। ऊपर से तेज़ इंटरनेट — और काम सेकंडों में दुनिया पार कर लेता है।", "s call centres, accounts, film editing and transcription land here. That is not luck. That is the dividend of a young, skilled, connected workforce.": "इसलिए दुनिया के कॉल सेंटर, हिसाब-किताब, फ़िल्म संपादन और प्रतिलेखन यहाँ आते हैं। यह किस्मत नहीं है। यह एक युवा, कुशल, जुड़ी हुई कार्यशक्ति का लाभांश है।", "Send a service abroad": "सेवा विदेश भेजो", "Tap a service and see, in numbers, why a firm abroad would rather pay India for it.": "किसी सेवा पर टैप करो और अंकों में देखो कि विदेश की फर्म इसे भारत को पैसे देकर क्यों कराती है।", "Indian companies go global": "भारतीय कंपनियाँ वैश्विक बनती हैं", "And the traffic flows both ways. Indian firms went out and bought a piece of the world.": "और यह आवाजाही दोनों तरफ़ चलती है। भारतीय कंपनियाँ बाहर गईं और दुनिया का एक हिस्सा ख़रीद लिया।", "s has plants and research centres worldwide.": "ONGC विदेश के 16 देशों में परियोजनाएँ रखती है। टाटा स्टील 26 देशों में चलती है और 50 में बेचती है। HCL के 31 देशों में ng two quantities.": "दो मात्राओं की तुलना करने के बारे में सोचें।", "A ratio compares two quantities of the same kind by division.": "एक अनुपात एक ही तरह की दो मात्राओं की भाग देकर तुलना करता है।", "It is written as a : b.": "इसे a : b के रूप में लिखा जाता है।", "What is a proportion?": "समानुपात क्या है?", "Link it to two equal ratios.": "इसे दो समान अनुपातों से जोड़ें।", "A proportion says two ratios are equal.": "समानुपात बताता है कि दो अनुपात बराबर हैं।", "If a : b = c : d, then a, b, c, d are in proportion.": "यदि a : b = c : d, तो a, b, c, d समानुपात में हैं।", "If 4 : 6 = 8 : x, what is x?": "यदि 4 : 6 = 8 : x, तो x क्या है?", "4×10 = 40 but 6×8 = 48 — not equal.": "4×10 = 40 लेकिन 6×8 = 48 — बराबर नहीं है।", "4×14 = 56, 6×8 = 48 — not equal.": "4×14 = 56, 6×8 = 48 — बराबर नहीं है।", "4×16 = 64, 6×8 = 48 — not equal.": "4×16 = 64, 6×8 = 48 — बराबर नहीं है।", "4 : 6 = 8 : 12, so x = 12.": "4 : 6 = 8 : 12, इसलिए x = 12।", "Two quantities are in direct proportion when ______.": "दो मात्राएँ प्रत्यक्ष समानुपात में तब होती हैं जब ______।", "one increases as the other decreases": "एक बढ़ती है और दूसरी घटती है", "That is inverse proportion.": "वह व्युत्क्रम समानुपात है।", "both increase or decrease together at the same rate": "दोनों एक ही दर से एक साथ बढ़ती या घटती हैं", "their sum stays constant": "उनका योग स्थिर रहता है", "A constant sum is not direct proportion.": "एक स्थिर योग प्रत्यक्ष समानुपात नहीं है।", "their difference stays constant": "उनका अंतर स्थिर रहता है", "A constant difference is not direct proportion.": "एक स्थिर अंतर प्रत्यक्ष समानुपात नहीं है।", "In direct proportion both quantities rise or fall together, and their ratio stays constant.": "प्रत्यक्ष समानुपात में दोनों मात्राएँ एक साथ बढ़ती या घटती हैं, और उनका अनुपात स्थिर रहता है।", "Two quantities are in inverse proportion when ______.": "दो मात्राएँ व्युत्क्रम समानुपात में तब होती हैं जब ______।", "both increase together": "दोनों एक साथ बढ़ती हैं", "That is direct proportion.": "वह प्रत्यक्ष समानुपात है।", "one increases and the other decreases, keeping the product constant": "एक बढ़ती है और दूसरी घटती है, जिससे गुणनफल स्थिर रहता है", "their ratio is constant": "उनका अनुपात स्थिर है", "A constant ratio is direct proportion.": "एक स्थिर अनुपात प्रत्यक्ष समानुपात है।", "both stay constant": "दोनों स्थिर रहते हैं", "If both stay constant nothing varies.": "यदि दोनों स्थिर रहते हैं तो कुछ भी नहीं बदलता।", "In inverse proportion, as one rises the other falls, and their product stays constant.": "व्युत्क्रम समानुपात में, जैसे एक बढ़ती है दूसरी घटती है, और उनका गुणनफल स्थिर रहता है।", "In direct proportion, the constant k equals ______.": "प्रत्यक्ष समानुपात में, स्थिर k किसके बराबर होता है ______।", "A sum is not the constant of variation.": "योग परिवर्तन का स्थिरांक नहीं है।", "A difference is not the constant.": "अंतर स्थिरांक नहीं है।", "x × y is constant in INVERSE proportion.": "x × y व्युत्क्रम समानुपात में स्थिर होता है।", "In direct proportion y = kx, so k = y ÷ x, the constant ratio.": "प्रत्यक्ष समानुपात में y = kx, इसलिए k = y ÷ x, स्थिर अनुपात।", "In inverse proportion, the constant k equals ______.": "व्युत्क्रम समानुपात में, स्थिर k किसके बराबर होता है ______।", "A quotient is not the constant here.": "भागफल यहाँ स्थिरांक नहीं है।", "y ÷ x is the constant of DIRECT proportion.": "y ÷ x प्रत्यक्ष समानुपात का स्थिरांक है।", "A sum is not the constant.": "योग स्थिरांक नहीं है।", "In inverse proportion xy = k, so k = x × y, the constant product.": "व्युत्क्रम समानुपात में xy = k, इसलिए k = x × y, स्थिर गुणनफल।", "Which pair of quantities is in direct proportion?": "मात्राओं का कौन सा जोड़ा प्रत्यक्ष समानुपात में है?", "Speed and time for a fixed distance": "एक निश्चित दूरी के लिए गति और समय", "Fixed distance: faster means less time — inverse.": "निश्चित दूरी: तेज़ का मतलब कम समय — व्युत्क्रम।", "Number of workers and time to finish a job": "काम करने वालों की संख्या और काम खत्म करने का समय", "More workers means less time — inverse.": "ज़्यादा काम करने वालों का मतलब कम समय — व्युत्क्रम।", "Number of items bought and total cost": "खरीदी गई वस्तुओं की संख्या और कुल लागत", "Price of a book and number of books for a fixed budget": "एक किताब की कीमत और एक निश्चित बजट के लिए किताबों की संख्या", "Fixed budget: higher price means fewer books — inverse.": "निश्चित बजट: ज़्यादा कीमत का मतलब कम किताबें — व्युत्क्रम।", "More items means more cost — both rise together, so it is direct proportion.": "ज़्यादा वस्तुएँ मतलब ज़्यादा लागत — दोनों एक साथ बढ़ती हैं, इसलिए यह प्रत्यक्ष समानुपात है।", "A company charges ₹30 for 2 hours, ₹60 for 5 hours, ₹100 for 10 hours and ₹180 for 20 hours. Are the charges in direct proportion to the time used?": "एक कंपनी 2 घंटे के लिए ₹30, 5 घंटे के लिए ₹60, 10 घंटे के लिए ₹100 और 20 घंटे के लिए ₹180 लेती है। क्या ये शुल्क इस्तेमाल किए गए समय के सीधे समानुपात में हैं?", "Yes, they are in direct proportion": "हाँ, वे प्रत्यक्ष समानुपात में हैं", "Check the ratios — they fall from 15 to 9, so the ratio is not constant.": "अनुपातों की जाँच करें — वे 15 से 9 तक गिरते हैं, इसलिए अनुपात स्थिर नहीं है।", "No, they are not in direct proportion": "नहीं, वे प्रत्यक्ष समानुपात में नहीं हैं", "₹30/2 = 15, ₹60/5 = 12, ₹100/10 = 10, ₹180/20 = 9. The ratio is not constant, so it is NOT direct proportion.": "₹30/2 = 15, ₹60/5 = 12, ₹100/10 = 10, ₹180/20 = 9। अनुपात स्थिर नहीं है, इसलिए यह प्रत्यक्ष समानुपात नहीं है।", "A fruit drink recipe mixes 2 parts syrup with 5 parts water. If there are 6 parts of syrup, how many parts of water are needed?": "एक फलों के पेय की रेसिपी में 5 भाग पानी के साथ 2 भाग सिरप मिलाया जाता है। यदि 6 भाग सिरप है, तो कितने भाग पानी की आवश्यकता होगी?", "That would be 2 : 5 = 6 : 12, which is not equal.": "वह 2 : 5 = 6 : 12 होगा, जो बराबर नहीं है।", "2 × 18 = 36 but 5 × 6 = 30 — not equal.": "2 × 18 = 36 लेकिन 5 × 6 = 30 — बराबर नहीं है।", "2 × 20 = 40, 5 × 6 = 30 — not equal.": "2 × 20 = 40, 5 × 6 = 30 — बराबर नहीं है।", "2 : 5 = 6 : x, so x = (5 × 6) ÷ 2 = 15 parts of water.": "2 : 5 = 6 : x, इसलिए x = (5 × 6) ÷ 2 = 15 भाग पानी।", "In the same recipe, 2 parts of syrup need 100 ml of water. How much syrup is required for 2500 ml of water?": "उसी रेसिपी में, 2 भाग सिरप के लिए 100 ml पानी चाहिए। 2500 ml पानी के लिए कितने सिरप की आवश्यकता होगी?", "2 × 2500 ÷ 100 = 50, not 25.": "2 × 2500 ÷ 100 = 50, 25 नहीं।", "That is the water for 2 parts, not the syrup for 2500 ml.": "वह 2 भागों के लिए पानी है, न कि 2500 ml के लिए सिरप।", "2 : 100 = x : 2500, so x = (2 × 2500) ÷ 100 = 50 ml of syrup.": "2 : 100 = x : 2500, इसलिए x = (2 × 2500) ÷ 100 = 50 ml सिरप।", "A machine in a factory packs 960 cans in 8 hours. How many cans will it pack in 3 hours?": "एक कारखाने में एक मशीन 8 घंटे में 960 डिब्बे पैक करती है। यह 3 घंटे में कितने डिब्बे पैक करेगी?", "960 ÷ 8 = 120, and 120 × 3 = 360.": "960 ÷ 8 = 120, और 120 × 3 = 360।", "120 × 3 = 360, not 400.": "120 × 3 = 360, 400 नहीं।", "480 would be 4 hours of work.": "480 4 घंटे के काम के लिए होगा।", "Cans per hour = 960 ÷ 8 = 120. In 3 hours = 120 × 3 = 360 cans.": "प्रति घंटे डिब्बे = 960 ÷ 8 = 120। 3 घंटे में = 120 × 3 = 360 डिब्बे।", "A virus is magnified 80,000 times and its length becomes 4 cm. What is the actual length of the virus?": "एक वायरस को 80,000 गुना बड़ा किया जाता है और उसकी लंबाई 4 cm हो जाती है। वायरस की वास्तविक लंबाई क्या है?", "4 ÷ 80,000 gives 0.00005, one place smaller.": "4 ÷ 80,000 से 0.00005 मिलता है, एक स्थान छोटा।", "That is ten times too large.": "वह दस गुना ज़्यादा बड़ा है।", "That is a thousand times too large.": "वह एक हज़ार गुना ज़्यादा बड़ा है।", "Actual length = 4 ÷ 80,000 = 0.00005 cm, which is 5 × 10⁻⁵ cm.": "वास्तविक लंबाई = 4 ÷ 80,000 = 0.00005 cm, जो 5 × 10⁻⁵ cm है।", "4 metres of cloth costs ₹240. Find the cost of 9 metres of cloth.": "4 मीटर कपड़े की कीमत ₹240 है। 9 मीटर कपड़े की कीमत निकालें।", "Set up the proportion. Let the cost be ₹x.": "समानुपात स्थापित करें। मान लें कि कीमत ₹x है।", "Answer: 9 metres of cloth costs ₹540.": "उत्तर: 9 मीटर कपड़े की कीमत ₹540 है।", "An electric pole 6 m high casts a shadow of 4 m. At the same time a tree casts a shadow of 10 m. Find the height of the tree.": "6 m ऊँचा एक बिजली का खंभा 4 m की परछाई बनाता है। उसी समय एक पेड़ 10 m की परछाई बनाता है। पेड़ की ऊँचाई निकालें।", "Height and shadow are in direct proportion.": "ऊँचाई और परछाई प्रत्यक्ष समानुपात में हैं।", "Answer: the tree is 15 m high.": "उत्तर: पेड़ 15 m ऊँचा है।", "A train travels 90 km in 60 minutes. How long will it take to travel 360 km?": "एक ट्रेन 60 मिनट में 90 km की यात्रा करती है। 360 km की यात्रा करने में कितना समय लगेगा?", "Distance and time are in direct proportion.": "दूरी और समय प्रत्यक्ष समानुपात में हैं।", "y = 21600 ÷ 90 = 240 minutes, that is 4 hours.": "y = 21600 ÷ 90 = 240 मिनट, यानी 4 घंटे।", "Answer: 240 minutes, or 4 hours.": "उत्तर: 240 मिनट, या 4 घंटे।", "The scale of a map is 1 : 25,000,000. Two cities are 5 cm apart on the map. Find the actual distance.": "एक नक्शे का पैमाना 1 : 25,000,000 है। नक्शे पर दो शहर 5 cm की दूरी पर हैं। वास्तविक दूरी निकालें।", "Map distance and real distance are in direct proportion.": "नक्शे की दूरी और वास्तविक दूरी प्रत्यक्ष समानुपात में हैं।", "Convert to km: 125,000,000 ÷ 100,000 = 1250 km": "km में बदलें: 125,000,000 ÷ 100,000 = 1250 km", "Answer: the cities are 1250 km apart.": "उत्तर: शहर 1250 km की दूरी पर हैं।", "A team of 5 workers completes a task in 12 hours. How long will 3 workers take?": "5 कामगारों की एक टीम 12 घंटे में एक काम पूरा करती है। 3 कामगारों को कितना समय लगेगा?", "5 × 12 = 60, and 60 ÷ 3 = 20.": "5 × 12 = 60, और 60 ÷ 3 = 20।", "That would need 2.5 workers.": "उसके लिए 2.5 कामगारों की ज़रूरत होगी।", "60 ÷ 3 = 20, not 30.": "60 ÷ 3 = 20, 30 नहीं।", "5 × 12 = 3 × x, so x = 60 ÷ 3 = 20 hours.": "5 × 12 = 3 × x, इसलिए x = 60 ÷ 3 = 20 घंटे।", "A machine completes a production task in 18 hours. How long will two such machines take together?": "एक मशीन 18 घंटे में उत्पादन का काम पूरा करती है। ऐसी दो मशीनें एक साथ कितना समय लेंगी?", "Two machines halve the time — 18 ÷ 2 = 9.": "दो मशीनें समय को आधा कर देती हैं — 18 ÷ 2 = 9।", "That is the time for one machine.": "वह एक मशीन के लिए समय है।", "That is double, not half.": "वह दोगुना है, आधा नहीं।", "Two machines do the work twice as fast: 18 × 1 = 2 × x, so x = 9 hours.": "दो मशीनें काम दोगुनी तेज़ी से करती हैं: 18 × 1 = 2 × x, इसलिए x = 9 घंटे।", "A car at 75 km/h reaches its destination in 4 hours. How long at 100 km/h?": "75 km/h की गति से एक कार 4 घंटे में अपनी मंज़िल पर पहुँचती है। 100 km/h की गति से कितना समय लगेगा?", "300 ÷ 100 = 3, not 2.": "300 ÷ 100 = 3, 2 नहीं।", "300 ÷ 100 = 3 exactly.": "300 ÷ 100 = 3 बिल्कुल।", "A higher speed must take LESS time.": "ज़्यादा गति में कम समय लगना चाहिए।", "75 × 4 = 100 × x, so x = 300 ÷ 100 = 3 hours.": "75 × 4 = 100 × x, इसलिए x = 300 ÷ 100 = 3 घंटे।", "A batch of juice bottles is packed into 15 crates with 8 bottles per crate. If each crate holds 12 bottles, how many crates are needed?": "जूस की बोतलों के एक बैच को 15 क्रेट में पैक किया जाता है, हर क्रेट में 8 बोतलें होती हैं। यदि हर क्रेट में 12 बोतलें आती हैं, तो कितने क्रेट की ज़रूरत होगी?", "120 ÷ 12 = 10, not 8.": "120 ÷ 12 = 10, 8 नहीं।", "That is the bottles per crate, not the crates.": "यह प्रति क्रेट बोतलें हैं, क्रेट नहीं।", "Bigger crates means fewer crates than 15.": "बड़े क्रेट का मतलब है 15 से कम क्रेट।", "Total bottles = 15 × 8 = 120. Crates at 12 each = 120 ÷ 12 = 10 crates.": "कुल बोतलें = 15 × 8 = 120. प्रति क्रेट 12 बोतलें = 120 ÷ 12 = 10 क्रेट।", "A truck carries a load in 30 trips of 500 kg each. How many trips are needed if each trip carries 600 kg?": "एक ट्रक 500 kg के 30 चक्करों में माल ढोता है। अगर हर चक्कर में 600 kg माल ले जाया जाए तो कितने चक्कर लगेंगे?", "15000 ÷ 600 = 25, not 20.": "15000 ÷ 600 = 25, 20 नहीं।", "Heavier trips mean fewer trips than 30.": "भारी माल ले जाने वाले चक्करों का मतलब है 30 से कम चक्कर।", "That is more than the original — wrong direction.": "यह मूल संख्या से अधिक है — गलत दिशा।", "Total load = 30 × 500 = 15000 kg. Trips at 600 kg = 15000 ÷ 600 = 25 trips.": "कुल माल = 30 × 500 = 15000 kg. 600 kg के हिसाब से चक्कर = 15000 ÷ 600 = 25 चक्कर।", "A school has enough food for 25 students for 10 days. How long will it last for 30 students?": "एक स्कूल में 25 छात्रों के लिए 10 दिनों का पर्याप्त खाना है। यह 30 छात्रों के लिए कितने दिन चलेगा?", "250 ÷ 30 is 8.33, not exactly 8.": "250 ÷ 30 = 8.33 आता है, ठीक 8 नहीं।", "More students means fewer days.": "अधिक छात्रों का मतलब है कम दिन।", "That is more days, which is the wrong direction.": "यह अधिक दिन हैं, जो कि गलत दिशा है।", "25 × 10 = 30 × x, so x = 250 ÷ 30 = 8⅓ days.": "25 × 10 = 30 × x, इसलिए x = 250 ÷ 30 = 8⅓ दिन।", "A factory produces 200 units in 10 hours with 6 machines. How many machines are required to produce the same units in 8 hours?": "एक फैक्ट्री 6 मशीनों से 10 घंटे में 200 यूनिट बनाती है। 8 घंटे में उतने ही यूनिट बनाने के लिए कितनी मशीनों की आवश्यकता होगी?", "60 ÷ 8 = 7.5, not 7.": "60 ÷ 8 = 7.5 आता है, 7 नहीं।", "7.5 machines": "7.5 मशीनें", "Fewer hours need more machines than 6, and 7.5 is exact.": "कम घंटों के लिए 6 से अधिक मशीनों की आवश्यकता होती है, और 7.5 सटीक है।", "6 × 10 = x × 8, so x = 60 ÷ 8 = 7.5 machines.": "6 × 10 = x × 8, इसलिए x = 60 ÷ 8 = 7.5 मशीनें।", "If 8 workers build a fence in 15 days, how many days will 10 workers take?": "यदि 8 मजदूर 15 दिनों में एक बाड़ बनाते हैं, तो 10 मजदूर कितने दिन लेंगे?", "120 ÷ 10 = 12, not 10.": "120 ÷ 10 = 12 आता है, 10 नहीं।", "More workers means fewer days than 15.": "अधिक मजदूरों का मतलब है 15 से कम दिन।", "That is more days — wrong direction.": "यह अधिक दिन हैं — गलत दिशा।", "8 × 15 = 10 × x, so x = 120 ÷ 10 = 12 days.": "8 × 15 = 10 × x, इसलिए x = 120 ÷ 10 = 12 दिन।", "A gardener waters a garden in 40 minutes. If he increases his speed by 50%, how long will it take?": "एक माली 40 मिनट में बगीचे में पानी देता है। यदि वह अपनी गति 50% बढ़ा देता है, तो इसमें कितना समय लगेगा?", "That would be double speed, not 50% more.": "यह दोगुनी गति होगी, 50% अधिक नहीं।", "40 ÷ 1.5 = 26.67, not 30.": "40 ÷ 1.5 = 26.67 आता है, 30 नहीं।", "A faster speed takes LESS time.": "अधिक गति में कम समय लगता है।", "At 1.5 times the speed the time becomes 40 ÷ 1.5 = 26⅔ minutes.": "1.5 गुना गति पर समय 40 ÷ 1.5 = 26⅔ मिनट हो जाता है।", "A school uses 12 litres of paint to cover 200 square metres. How much paint is needed for 300 square metres?": "एक स्कूल 200 वर्ग मीटर को कवर करने के लिए 12 लीटर पेंट का उपयोग करता है। 300 वर्ग मीटर के लिए कितने पेंट की आवश्यकता होगी?", "12 × 300 ÷ 200 = 18, not 15.": "12 × 300 ÷ 200 = 18 आता है, 15 नहीं।", "That is 1.5 × 12 = 18, not 20.": "यह 1.5 × 12 = 18 है, 20 नहीं।", "That is double the paint.": "यह पेंट का दोगुना है।", "12 : 200 = x : 300, so x = (12 × 300) ÷ 200 = 18 litres.": "12 : 200 = x : 300, इसलिए x = (12 × 300) ÷ 200 = 18 लीटर।", "5 litres of milk make 20 cups of milkshake. How many cups can be made with 8 litres?": "5 लीटर दूध से 20 कप मिल्कशेक बनता है। 8 लीटर से कितने कप बन सकते हैं?", "20 × 8 ÷ 5 = 32, not 24.": "20 × 8 ÷ 5 = 32 आता है, 24 नहीं।", "That would be 7 litres.": "यह 7 लीटर होगा।", "That would be 10 litres.": "यह 10 लीटर होगा।", "5 : 20 = 8 : x, so x = (20 × 8) ÷ 5 = 32 cups.": "5 : 20 = 8 : x, इसलिए x = (20 × 8) ÷ 5 = 32 कप।", "A warehouse stores 500 boxes with 50 items each. How many boxes are needed if each box holds 40 items?": "एक गोदाम में 50-50 वस्तुओं वाले 500 बक्से रखे हैं। यदि प्रत्येक बक्से में 40 वस्तुएं रखी जाएं तो कितने बक्सों की आवश्यकता होगी?", "25000 ÷ 40 = 625, not 400.": "25000 ÷ 40 = 625 आता है, 400 नहीं।", "Smaller boxes need MORE boxes than 500.": "छोटे बक्सों के लिए 500 से अधिक बक्सों की आवश्यकता होती है।", "Total items = 500 × 50 = 25000. Boxes at 40 each = 25000 ÷ 40 = 625 boxes.": "कुल वस्तुएं = 500 × 50 = 25000. प्रति बक्सा 40 वस्तुएं = 25000 ÷ 40 = 625 बक्से।", "15 litres of fuel drive 150 km. How many kilometres can be driven with 10 litres?": "15 लीटर ईंधन से 150 किमी की यात्रा की जा सकती है। 10 लीटर से कितने किलोमीटर की यात्रा की जा सकती है?", "150 × 10 ÷ 15 = 100, not 120.": "150 × 10 ÷ 15 = 100 आता है, 120 नहीं।", "Less fuel cannot give the same distance.": "कम ईंधन से समान दूरी तय नहीं की जा सकती।", "15 : 150 = 10 : x, so x = (150 × 10) ÷ 15 = 100 km.": "15 : 150 = 10 : x, इसलिए x = (150 × 10) ÷ 15 = 100 किमी।", "A recipe calls for 3 cups of flour for 6 servings. How many cups are needed for 15 servings?": "एक रेसिपी में 6 सर्विंग्स के लिए 3 कप मैदा लगता है। 15 सर्विंग्स के लिए कितने कप मैदा की आवश्यकता होगी?", "3 × 15 ÷ 6 = 7.5, not 6.": "3 × 15 ÷ 6 = 7.5 आता है, 6 नहीं।", "That would be 18 servings.": "यह 18 सर्विंग्स के लिए होगा।", "That would be 24 servings.": "यह 24 सर्विंग्स के लिए होगा।", "3 : 6 = x : 15, so x = (3 × 15) ÷ 6 = 7.5 cups.": "3 : 6 = x : 15, इसलिए x = (3 × 15) ÷ 6 = 7.5 कप।", "A publisher prints 600 books in 3 days with 5 printers. How many printers are needed to print 1000 books in 4 days?": "एक प्रकाशक 5 प्रिंटरों से 3 दिनों में 600 किताबें छापता है। 4 दिनों में 1000 किताबें छापने के लिए कितने प्रिंटरों की आवश्यकता होगी?", "6.25 printers are needed, and you cannot have a quarter of a printer, so more than 6.": "6.25 प्रिंटरों की आवश्यकता है, और आपके पास प्रिंटर का एक चौथाई हिस्सा नहीं हो सकता, इसलिए 6 से अधिक।", "The exact value is 6.25, which needs 7 whole printers.": "सटीक मान 6.25 है, जिसके लिए 7 पूरे प्रिंटरों की आवश्यकता है।", "10 printers": "10 प्रिंटर", "That is more than the calculation gives.": "यह गणना से अधिक है।", "5 printers give 600 ÷ 3 = 200 books a day, so 40 books per printer per day. For 1000 books in 4 days we need 250 a day, so 250 ÷ 40 ≈ 6.25, which rounds up to 7. Using the proportion directly: 5 × 3 ÷ 600 = x × 4 ÷ 1000 gives x ≈ 6.25.": "5 प्रिंटर 600 ÷ 3 = 200 किताबें प्रतिदिन देते हैं, इसलिए प्रति प्रिंटर प्रति दिन 40 किताबें। 4 दिनों में 1000 किताबों के लिए हमें प्रतिदिन 250 की आवश्यकता है, इसलिए 250 ÷ 40 ≈ 6.25, जो 7 हो जाता है। सीधे अनुपात का उपयोग करने पर: 5 × 3 ÷ 600 = x × 4 ÷ 1000 से x ≈ 6.25 मिलता है।", "A contractor estimates 4 workers can complete a project in 20 days. How many workers are needed to finish in 10 days?": "एक ठेकेदार का अनुमान है कि 4 मजदूर एक प्रोजेक्ट को 20 दिनों में पूरा कर सकते हैं। इसे 10 दिनों में खत्म करने के लिए कितने मजदूरों की आवश्यकता होगी?", "80 ÷ 10 = 8, not 6.": "80 ÷ 10 = 8 आता है, 6 नहीं।", "That would finish in 8 days.": "यह 8 दिनों में खत्म हो जाएगा।", "That would finish in about 6.7 days.": "यह लगभग 6.7 दिनों में खत्म हो जाएगा।", "4 × 20 = x × 10, so x = 80 ÷ 10 = 8 workers.": "4 × 20 = x × 10, इसलिए x = 80 ÷ 10 = 8 मजदूर।", "A farmer has food for 20 animals for 5 days. How long will it last if there are 10 more animals?": "एक किसान के पास 20 जानवरों के लिए 5 दिनों का चारा है। यदि 10 और जानवर आ जाएं तो यह कितने दिन चलेगा?", "100 ÷ 30 = 3.33, not exactly 3.": "100 ÷ 30 = 3.33 आता है, ठीक 3 नहीं।", "That would be 25 animals.": "यह 25 जानवर होंगे।", "More animals means fewer days.": "अधिक जानवरों का मतलब है कम दिन।", "20 × 5 = 30 × x, so x = 100 ÷ 30 = 3⅓ days.": "20 × 5 = 30 × x, इसलिए x = 100 ÷ 30 = 3⅓ दिन।", "2 kg of sugar contains 9 × 10⁶ crystals. How many crystals are in (a) 5 kg and (b) 1.2 kg of sugar?": "2 kg चीनी में 9 × 10⁶ क्रिस्टल होते हैं। (a) 5 kg और (b) 1.2 kg चीनी में कितने क्रिस्टल होंगे?", "Sugar and crystals are in direct proportion.": "चीनी और क्रिस्टल प्रत्यक्ष अनुपात में हैं।", "(a) 2 : 9×10⁶ = 5 : x, so x = (5 × 9×10⁶) ÷ 2 = 2.25 × 10⁷ crystals.": "(a) 2 : 9×10⁶ = 5 : x, इसलिए x = (5 × 9×10⁶) ÷ 2 = 2.25 × 10⁷ क्रिस्टल।", "(b) 2 : 9×10⁶ = 1.2 : y, so y = (1.2 × 9×10⁶) ÷ 2 = 5.4 × 10⁶ crystals.": "(b) 2 : 9×10⁶ = 1.2 : y, इसलिए y = (1.2 × 9×10⁶) ÷ 2 = 5.4 × 10⁶ क्रिस्टल।", "Answer: 2.25 × 10⁷ crystals in 5 kg, and 5.4 × 10⁶ crystals in 1.2 kg.": "उत्तर: 5 kg में 2.25 × 10⁷ क्रिस्टल, और 1.2 kg में 5.4 × 10⁶ क्रिस्टल।", "A paint mixture uses 1 part red pigment to 8 parts base. How many parts of base are needed for 12 parts of red pigment?": "एक पेंट मिश्रण में 8 भाग बेस के लिए 1 भाग लाल रंग का उपयोग किया जाता है। 12 भाग लाल रंग के लिए कितने भाग बेस की आवश्यकता होगी?", "8 × 12 = 96, not 72.": "8 × 12 = 96 आता है, 72 नहीं।", "That would be 10.5 parts of pigment.": "यह रंग के 10.5 भाग होंगे।", "That would be 13.5 parts of pigment.": "यह रंग के 13.5 भाग होंगे।", "1 : 8 = 12 : x, so x = 8 × 12 = 96 parts of base.": "1 : 8 = 12 : x, इसलिए x = 8 × 12 = 96 भाग बेस।", "s map has a scale of 1 cm = 18 km. She drives 72 km. What distance does this represent on the map?": "रश्मि के नक्शे का पैमाना 1 cm = 18 km है। वह 72 km की यात्रा करती है। नक्शे पर यह कितनी दूरी दर्शाएगा?", "72 ÷ 18 = 4, not 3.": "72 ÷ 18 = 4 आता है, 3 नहीं।", "That would be 90 km.": "यह 90 km होगा।", "That would be 108 km.": "यह 108 km होगा।", "18 : 1 = 72 : x, so x = 72 ÷ 18 = 4 cm.": "18 : 1 = 72 : x, इसलिए x = 72 ÷ 18 = 4 cm.", "Explain how to decide whether a table of values shows direct or inverse proportion.": "समझाएं कि यह कैसे तय किया जाए कि मानों की तालिका प्रत्यक्ष अनुपात दिखाती है या व्युत्क्रम अनुपात।", "Check the ratio first. Divide each pair: y ÷ x.": "पहले अनुपात की जांच करें। प्रत्येक जोड़े को विभाजित करें: y ÷ x.", "If y ÷ x is the same every time, it is direct proportion.": "यदि y ÷ x हर बार समान है, तो यह प्रत्यक्ष अनुपात है।", "If y ÷ x changes, multiply each pair: x × y.": "यदि y ÷ x बदलता है, तो प्रत्येक जोड़े को गुणा करें: x × y.", "If x × y is the same every time, it is inverse proportion.": "यदि x × y हर बार समान है, तो यह व्युत्क्रम अनुपात है।", "Answer: constant y ÷ x means direct; constant x × y means inverse.": "उत्तर: स्थिर y ÷ x का मतलब है प्रत्यक्ष; स्थिर x × y का मतलब है व्युत्क्रम।", "A shop sells 4 pens for ₹60. How much will 10 pens cost, and which type of proportion is this?": "एक दुकान ₹60 में 4 पेन बेचती है। 10 पेन की कीमत कितनी होगी, और यह किस प्रकार का अनुपात है?", "Both quantities rise together, so it is direct proportion.": "दोनों राशियां एक साथ बढ़ती हैं, इसलिए यह प्रत्यक्ष अनुपात है।", "Answer: 10 pens cost ₹150, and it is direct proportion.": "उत्तर: 10 पेन की कीमत ₹150 है, और यह प्रत्यक्ष अनुपात है।", "Direct and Inverse Proportion": "प्रत्यक्ष और व्युत्क्रम अनुपात", "Mathematics · Class 8 · Chapter 11": "गणित · कक्षा 8 · अध्याय 11", "Two quantities that move together — and two that move against each other. By the end you will tell them apart in one look.": "दो राशियां जो एक साथ चलती हैं — और दो जो एक-दूसरे के विपरीत चलती हैं। अंत तक आप उन्हें एक ही नज़र में पहचान लेंगे।", "The whole chapter in one line": "पूरा अध्याय केवल एक पंक्ति में", "When one quantity changes, the other usually changes too. The question is always: does it rise with it, or fall against it?": "जब एक मात्रा बदलती है, तो दूसरी भी आमतौर पर बदल जाती है। सवाल हमेशा यही होता है: क्या यह इसके साथ बढ़ती है, या इसके विपरीत घटती है?", "A ratio compares two quantities of the same kind by division. 4 pens to ₹60 is written 4 : 60.": "अनुपात भाग देकर एक ही तरह की दो मात्राओं की तुलना करता है। 4 पेन और ₹60 को 4 : 60 लिखा जाता है।", "Try a ratio": "अनुपात आज़माएँ", "Drag the slider. The ratio stays the same as long as you multiply both numbers by the same amount.": "स्लाइडर खींचें। अनुपात तब तक एक जैसा रहता है जब तक आप दोनों संख्याओं को एक ही मात्रा से गुणा करते हैं।", "A ratio does not change when both parts are multiplied by the same number.": "अनुपात तब नहीं बदलता जब दोनों हिस्सों को एक ही संख्या से गुणा किया जाता है।", "A proportion says two ratios are equal. 2 : 5 = 6 : 15 is a proportion, because both sides simplify to 2 : 5.": "समानुपात बताता है कि दो अनुपात बराबर हैं। 2 : 5 = 6 : 15 एक समानुपात है, क्योंकि दोनों पक्ष सरल होकर 2 : 5 बन जाते हैं।", "Is it a proportion?": "क्या यह समानुपात है?", "Change the numbers and see whether the two ratios stay equal. The cross products tell you the answer.": "संख्याएँ बदलें और देखें कि क्या दोनों अनुपात बराबर रहते हैं। क्रॉस गुणनफल आपको जवाब बता देंगे।", "Two ratios a : b and c : d are in proportion exactly when a × d = b × c.": "दो अनुपात a : b और c : d बिल्कुल समानुपात में तब होते हैं जब a × d = b × c हो।", "Now the important part": "अब ज़रूरी हिस्सा", "In this chapter we study two quantities that change together. Sometimes they rise together. Sometimes one rises as the other falls. Both are proportions — but opposite kinds.": "इस चैप्टर में हम दो मात्राओं के बारे में पढ़ते हैं जो एक साथ बदलती हैं। कभी-कभी वे एक साथ बढ़ती हैं। कभी-कभी एक बढ़ती है तो दूसरी घटती है। दोनों समानुपात हैं — लेकिन अलग-अलग तरह के।", "Direct proportion": "सीधा समानुपात", "Two quantities are in DIRECT proportion when both increase or both decrease at the same rate. Double one and the other doubles.": "दो मात्राएँ सीधे समानुपात में तब होती हैं जब दोनों एक ही दर से बढ़ती या घटती हैं। एक को दोगुना करें तो दूसरा भी दोगुना हो जाता है।", "Direct: move the slider": "सीधा: स्लाइडर घुमाएँ", "Drag the slider and watch both bars. They grow together, and the ratio y ÷ x never changes.": "स्लाइडर खींचें और दोनों बार को देखें। वे एक साथ बढ़ते हैं, और अनुपात y ÷ x कभी नहीं बदलता।", "In direct proportion y ÷ x is constant. That constant is written k.": "सीधे समानुपात में y ÷ x स्थिर रहता है। उस स्थिरांक को k लिखा जाता है।", "The constant of direct proportion": "सीधे समानुपात का स्थिरांक", "If y = kx, then k = y ÷ x. This k is the same for every pair of values in the table. In 4 : 240 = 9 : 540, k is 60.": "यदि y = kx है, तो k = y ÷ x। यह k टेबल में मानों के हर जोड़े के लिए एक जैसा है। 4 : 240 = 9 : 540 में, k 60 है।", "A direct proportion table": "सीधे समानुपात की टेबल", "Cost of cloth at ₹60 a metre. Every column keeps the ratio 60.": "₹60 प्रति मीटर कपड़े की कीमत। हर कॉलम में अनुपात 60 रहता है।", "240÷4 = 360÷6 = 540÷9 = 720÷12 = 60. Constant, so it is direct.": "240÷4 = 360÷6 = 540÷9 = 720÷12 = 60। स्थिर है, इसलिए यह सीधा समानुपात है।", "Direct proportion looks like a straight line": "सीधा समानुपात एक सीधी रेखा जैसा दिखता है", "Plot the points and they lie on a straight line through the origin. That straight line is the signature of direct proportion.": "बिंदु अंकित करें और वे मूल बिंदु से गुज़रने वाली एक सीधी रेखा पर आते हैं। वह सीधी रेखा सीधे समानुपात की पहचान है।", "Worked example — cloth": "हल किया गया उदाहरण — कपड़ा", "4 metres of cloth costs ₹240. What does 9 metres cost?": "4 मीटर कपड़े की कीमत ₹240 है। 9 मीटर की कीमत क्या होगी?", "Write the proportion: 4 : 240 = 9 : x": "समानुपात लिखें: 4 : 240 = 9 : x", "Cross-multiply: 4x = 240 × 9 = 2160": "क्रॉस-गुणा करें: 4x = 240 × 9 = 2160", "Divide: x = 2160 ÷ 4 = 540": "भाग दें: x = 2160 ÷ 4 = 540", "So 9 metres costs ₹540.": "इसलिए 9 मीटर की कीमत ₹540 है।", "Worked example — pole and shadow": "हल किया गया उदाहरण — खंभा और परछाई", "A 6 m pole casts a 4 m shadow. At the same time a tree casts a 10 m shadow. How tall is the tree?": "6 मीटर का एक खंभा 4 मीटर लंबी परछाई बनाता है। उसी समय एक पेड़ 10 मीटर लंबी परछाई बनाता है। पेड़ कितना लंबा है?", "So the tree is 15 m tall.": "इसलिए पेड़ 15 मीटर लंबा है।", "Worked example — the train": "हल किया गया उदाहरण — ट्रेन", "A train covers 90 km in 60 minutes. How long for 360 km?": "एक ट्रेन 60 मिनट में 90 किमी का सफर तय करती है। 360 किमी के लिए कितना समय लगेगा?", "y = 21600 ÷ 90 = 240 minutes": "y = 21600 ÷ 90 = 240 मिनट", "So it takes 240 minutes, which is 4 hours.": "इसलिए इसमें 240 मिनट लगते हैं, जो कि 4 घंटे है।", "Worked example — map scale": "हल किया गया उदाहरण — नक्शे का पैमाना", "A map has scale 1 : 25,000,000. Two cities are 5 cm apart on the map. How far apart are they really?": "एक नक्शे का पैमाना 1 : 25,000,000 है। नक्शे पर दो शहर 5 सेमी की दूरी पर हैं। असल में वे कितनी दूर हैं?", "1 km = 100,000 cm, so divide: 125,000,000 ÷ 100,000": "1 किमी = 100,000 सेमी, इसलिए भाग दें: 125,000,000 ÷ 100,000", "y = 1250 km": "y = 1250 किमी", "4 pens cost ₹60. What do 10 pens cost?": "4 पेन की कीमत ₹60 है। 10 पेन की कीमत क्या होगी?", "4 : 60 = 10 : x gives x = 600 ÷ 4 = ₹150. Both rise together, so it is direct proportion.": "4 : 60 = 10 : x से x = 600 ÷ 4 = ₹150 मिलता है। दोनों एक साथ बढ़ते हैं, इसलिए यह सीधा समानुपात है।", "Inverse proportion": "उल्टा समानुपात", "Two quantities are in INVERSE proportion when one increases and the other decreases, and their PRODUCT stays the same. Double one and the other halves.": "दो मात्राएँ उल्टे समानुपात में तब होती हैं जब एक बढ़ती है और दूसरी घटती है, और उनका गुणनफल एक जैसा रहता है। एक को दोगुना करें तो दूसरा आधा हो जाता है।", "Inverse: move the slider": "उल्टा: स्लाइडर घुमाएँ", "Drag the slider. One bar grows while the other shrinks — but multiply them and the answer never changes.": "स्लाइडर खींचें। एक बार बढ़ता है जबकि दूसरा सिकुड़ता है — लेकिन उन्हें गुणा करें तो जवाब कभी नहीं बदलता।", "In inverse proportion x × y is constant. That constant is written k.": "उल्टे समानुपात में x × y स्थिर रहता है। उस स्थिरांक को k लिखा जाता है।", "The constant of inverse proportion": "उल्टे समानुपात का स्थिरांक", "If xy = k, then k = x × y. In 5 workers × 12 hours = 60, and 3 workers × 20 hours = 60. Same k.": "यदि xy = k है, तो k = x × y। 5 मज़दूर × 12 घंटे = 60, और 3 मज़दूर × 20 घंटे = 60। k एक ही है।", "An inverse proportion table": "उल्टे समानुपात की टेबल", "Number of workers against hours for the same job. The product stays 60.": "एक ही काम के लिए घंटों के मुकाबले मज़दूरों की संख्या। गुणनफल 60 रहता है।", "2×30 = 3×20 = 5×12 = 6×10 = 60. Constant product, so it is inverse.": "2×30 = 3×20 = 5×12 = 6×10 = 60। स्थिर गुणनफल, इसलिए यह उल्टा समानुपात है।", "Inverse proportion curves": "उल्टे समानुपात के वक्र", "Plot it and you get a curve, not a straight line. As one value grows the other falls away, always keeping the product fixed.": "इसे अंकित करें और आपको एक वक्र मिलता है, सीधी रेखा नहीं। जैसे-जैसे एक मान बढ़ता है, दूसरा कम होता जाता है, और गुणनफल हमेशा स्थिर रहता है।", "Worked example — the hoses": "हल किया गया उदाहरण — पाइप", "8 hoses fill a pool in 2 hours. How long will 6 hoses take?": "8 पाइप 2 घंटे में एक पूल भरते हैं। 6 पाइपों को कितना समय लगेगा?", "More hoses mean less time — inverse proportion.": "ज़्यादा पाइप का मतलब कम समय — उल्टा समानुपात।", "x = 16 ÷ 6 = 2.67 hours": "x = 16 ÷ 6 = 2.67 घंटे", "That is 2 hours and 40 minutes.": "यह 2 घंटे और 40 मिनट है।", "Worked example — the campers": "हल किया गया उदाहरण — कैंपर", "120 campers have food for 30 days. How long will it last if 30 more campers join?": "120 कैंपरों के पास 30 दिनों का खाना है। अगर 30 और कैंपर आ जाएं तो यह कितना चलेगा?", "Now there are 150 campers.": "अब 150 कैंपर हैं।", "y = 3600 ÷ 150 = 24 days": "y = 3600 ÷ 150 = 24 दिन", "So the food lasts 24 days.": "इसलिए खाना 24 दिन चलता है।", "Worked example — the workers": "हल किया गया उदाहरण — मज़दूर", "12 workers finish a project in 60 hours. How many are needed to finish in 40 hours?": "12 मज़दूर 60 घंटे में एक प्रोजेक्ट पूरा करते हैं। 40 घंटे में इसे पूरा करने के लिए कितने मज़दूरों की ज़रूरत होगी?", "Fewer hours need more workers — inverse.": "कम घंटे के लिए ज़्यादा मज़दूर चाहिए — उल्टा।", "So 18 workers are needed.": "इसलिए 18 मज़दूरों की ज़रूरत है।", "Worked example — the painters": "हल किया गया उदाहरण — पेंटर", "20 painters paint a house in 36 hours. How many are needed in 24 hours?": "20 पेंटर 36 घंटे में एक घर पेंट करते हैं। 24 घंटे में कितने की ज़रूरत होगी?", "So 30 painters are needed.": "इसलिए 30 पेंटरों की ज़रूरत है।", "5 workers take 12 hours. How long will 3 workers take?": "5 मज़दूर 12 घंटे लेते हैं। 3 मज़दूर कितना समय लेंगे?", "5 × 12 = 60, and 60 ÷ 3 = 20 hours. Fewer workers means more time — inverse proportion.": "5 × 12 = 60, और 60 ÷ 3 = 20 घंटे। कम मज़दूर का मतलब ज़्यादा समय — उल्टा समानुपात।", "Flip the switch. Watch how the two bars behave in each type. One pair moves together, the other moves apart.": "स्विच चालू करें। देखें कि दोनों बार हर प्रकार में कैसा व्यवहार करते हैं। एक जोड़ा एक साथ चलता है, दूसरा दूर जाता है।", "Direct: both bars move the same way. Inverse: one up, one down, product fixed.": "सीधा: दोनों बार एक ही दिशा में चलते हैं। उल्टा: एक ऊपर, एक नीचे, गुणनफल स्थिर।", "Telling them apart": "उन्हें अलग-अलग पहचानना", "Three quick tests, in order. Use the first one that gives a clear answer.": "तीन आसान टेस्ट, क्रम में। पहला वाला इस्तेमाल करें जिससे साफ़ जवाब मिले।", "same every time": "हर बार एक जैसा", "As x grows": "जैसे-जैसे x बढ़ता है", "Everyday example": "रोज़मर्रा का उदाहरण", "more pens, more cost": "ज़्यादा पेन, ज़्यादा कीमत", "more workers, less time": "ज़्यादा मज़दूर, कम समय", "How to decide — the recipe": "कैसे तय करें — तरीका", "Step 1: write a table of the two quantities. Step 2: divide each pair. Step 3: if the quotient is constant it is direct. Step 4: if not, multiply each pair — a constant product means inverse.": "स्टेप 1: दोनों मात्राओं की एक टेबल बनाएँ। स्टेप 2: हर जोड़े को भाग दें। स्टेप 3: अगर भागफल स्थिर है तो यह सीधा है। स्टेप 4: अगर नहीं, तो हर जोड़े को गुणा करें — स्थिर गुणनफल का मतलब उल्टा है।", "Three mistakes that cost marks": "तीन गलतियाँ जो परीक्षा में नंबर कटवाती हैं", "Check yourself against these before the test.": "टेस्ट से पहले खुद को इनसे चेक करें।", "Guessing the type": "प्रकार का अंदाज़ा लगाना", "Work it out. Divide first, multiply second. Never assume.": "इसे हल करें। पहले भाग दें, फिर गुणा करें। कभी भी अंदाज़ा न लगाएँ।", "Mixing up the constant": "स्थिरांक को मिला देना", "y ÷ x is the direct constant. x × y is the inverse constant. They are not the same.": "y ÷ x सीधा स्थिरांक है। x × y उल्टा स्थिरांक है। वे एक जैसे नहीं हैं।", "Forgetting units": "इकाइयाँ भूल जाना", "Map scales use cm, but the answer is often asked in km. Convert at the end, not the start.": "नक्शे के पैमाने में सेमी का इस्तेमाल होता है, लेकिन जवाब अक्सर किमी में पूछा जाता है। अंत में बदलें, शुरुआत में नहीं।", "A machine packs 960 cans in 8 hours. How many in 3 hours?": "एक मशीन 8 घंटे में 960 डिब्बे पैक करती है। 3 घंटे में कितने?", "960 ÷ 8 = 120 cans an hour. In 3 hours, 120 × 3 = 360 cans. Direct proportion.": "960 ÷ 8 = 120 डिब्बे प्रति घंटा। 3 घंटे में, 120 × 3 = 360 डिब्बे। सीधा समानुपात।", "Where you meet it — recipes": "जहाँ आप इसे देखते हैं — रेसिपी", "A fruit drink needs 2 parts syrup to 5 parts water. Double the syrup and you must double the water. Direct proportion in the kitchen.": "एक फ्रूट ड्रिंक में 5 भाग पानी के लिए 2 भाग सिरप चाहिए। सिरप को दोगुना करें तो पानी भी दोगुना करना होगा। किचन में सीधा समानुपात।", "Where you meet it — speed and time": "जहाँ आप इसे देखते हैं — स्पीड और समय", "At 75 km/h a journey takes 4 hours. At 100 km/h it takes 3. Faster means less time — inverse proportion on every road.": "75 किमी/घंटा की स्पीड से सफर में 4 घंटे लगते हैं। 100 किमी/घंटा पर 3 घंटे लगते हैं। तेज़ का मतलब कम समय — हर सड़क पर उल्टा समानुपात।", "Where you meet it — price and quantity": "जहाँ आप इसे देखते हैं — कीमत और मात्रा", "With ₹7200 you can buy 120 books at ₹60, or 60 books at ₹120. Higher price, fewer books. The product stays ₹7200 — inverse proportion at the shop.": "₹7200 से आप ₹60 में 120 किताबें खरीद सकते हैं, या ₹120 में 60 किताबें। ज़्यादा कीमत, कम किताबें। गुणनफल ₹7200 रहता है — दुकान पर उल्टा समानुपात।", "The chapter on one card": "एक कार्ड पर पूरा अध्याय", "Everything above, compressed.": "ऊपर दी गई सारी जानकारी, संक्षेप में।", "two ratios that are equal: a : b = c : d": "दो अनुपात जो बराबर हों: a : b = c : d", "both change the same way; y ÷ x = k; straight line": "दोनों एक ही तरह से बदलते हैं; y ÷ x = k; सीधी रेखा", "one rises, one falls; x × y = k; curve": "एक बढ़ता है, एक घटता है; x × y = k; वक्र", "write the table, set the proportion, cross-multiply, divide": "टेबल बनाएँ, समानुपात सेट करें, क्रॉस-गुणा करें, भाग दें", "To identify": "पहचानने के लिए", "divide first; if constant it is direct, else check the product": "पहले भाग दें; अगर स्थिर है तो सीधा, वरना गुणनफल चेक करें", "Now test yourself": "अब अपनी परीक्षा लें", "You have the idea. The arena has 39 questions from this chapter — direct, inverse and the prescribed ones.": "आपको आइडिया मिल गया है। एरीना में इस चैप्टर के 39 सवाल हैं — सीधा, उल्टा और तय किए गए।", "Open the assessment file and see how far you get.": "असेसमेंट फाइल खोलें और देखें कि आप कितने सवालों को सही कर पाते हैं।", "Cross-multiply it yourself": "खुद क्रॉस-मल्टीप्लाई करें", "A proportion a : b = c : d holds exactly when a × d equals b × c. Move the slider and watch the two cross products.": "एक अनुपात a : b = c : d ठीक तभी सही होता है जब a × d, b × c के बराबर हो। स्लाइडर को खिसकाएं और दोनों क्रॉस प्रोडक्ट को देखें।", "The two diagonals must give the same number. If they do not, it is not a proportion.": "दोनों विकर्णों से एक ही नंबर आना चाहिए। अगर ऐसा नहीं होता, तो यह अनुपात नहीं है।", "Map scale, live": "मैप स्केल, लाइव", "s map uses 1 cm for 18 km. Slide to any distance on the map and read the real distance at once.": "रश्मि के मैप में 18 किमी के लिए 1 सेमी का इस्तेमाल किया गया है। मैप पर किसी भी दूरी तक स्लाइड करें और तुरंत असली दूरी पढ़ें।", "Map distance and real distance are in direct proportion, so the ratio never changes.": "मैप की दूरी और असली दूरी सीधे अनुपात में होते हैं, इसलिए उनका अनुपात कभी नहीं बदलता।", "Which type is it?": "यह कौन सा प्रकार है?", "Five everyday pairs. Tap the button, read the pair, decide in your head, then tap again to check yourself.": "रोजमर्रा के पांच जोड़े। बटन पर टैप करें, जोड़ा पढ़ें, अपने दिमाग में तय करें, और फिर खुद को चेक करने के लिए फिर से टैप करें।", "Ask: if one doubles, does the other double (direct) or halve (inverse)?": "पूछें: अगर एक दोगुना हो जाता है, तो क्या दूसरा भी दोगुना (सीधा) हो जाता है या आधा (उल्टा) हो जाता है?", "What does the sum due to a retiring partner include?": "एक रिटायर हो रहे पार्टनर को मिलने वाली रकम में क्या-क्या शामिल होता है?", "List the credits to his capital account.": "उसके कैपिटल अकाउंट में क्रेडिट्स की लिस्ट बनाएं।", "His capital balance and current account balance.": "उसका कैपिटल बैलेंस और करेंट अकाउंट बैलेंस।", "His share of goodwill, reserves and accumulated profits.": "गुडविल, रिज़र्व और जमा हुए मुनाफे में उसका हिस्सा।", "His share of any gain on revaluation of assets and liabilities.": "एसेट्स और लायबिलिटीज़ की रीवैल्यूएशन पर होने वाले किसी भी फायदे में उसका हिस्सा।", "Answer: capital + current account + share of goodwill + share of reserves + share of revaluation gain, less drawings and losses.": "जवाब: कैपिटल + करेंट अकाउंट + गुडविल का हिस्सा + रिज़र्व का हिस्सा + रीवैल्यूएशन फायदे का हिस्सा, जिसमें से ड्रॉइंग्स और नुकसान घटा दिए जाएं।", "s share of goodwill is credited to ______.": "एक रिटायर हो रहे पार्टनर के गुडविल के हिस्से को ______ में क्रेडिट किया जाता है।", "the goodwill account": "गुडविल अकाउंट", "Goodwill is not credited as an asset on retirement.": "रिटायरमेंट पर गुडविल को एसेट के रूप में क्रेडिट नहीं किया जाता है।", "his capital account": "उसके कैपिटल अकाउंट", "The remaining partners are debited, not credited.": "बाकी बचे पार्टनर्स को डेबिट किया जाता है, क्रेडिट नहीं।", "the revaluation account": "रीवैल्यूएशन अकाउंट", "Revaluation deals with assets and liabilities, not goodwill.": "रीवैल्यूएशन का संबंध एसेट्स और लायबिलिटीज़ से होता है, गुडविल से नहीं।", "s capital account is credited with his share of goodwill.": "रिटायर हो रहे पार्टनर के कैपिटल अकाउंट में उसके गुडविल के हिस्से को क्रेडिट किया जाता है।", "On retirement, the existing partnership deed ______.": "रिटायरमेंट पर, मौजूदा पार्टनरशिप डीड ______।", "continues unchanged": "बिना बदले जारी रहती है", "The terms must change because the partners have changed.": "शर्तें बदलनी ही होंगी क्योंकि पार्टनर्स बदल गए हैं।", "comes to an end and a new deed is framed": "खत्म हो जाती है और एक नई डीड बनाई जाती है", "is automatically renewed for five years": "अपने आप पांच साल के लिए रिन्यू हो जाती है", "There is no automatic renewal.": "ऐसा कोई ऑटोमैटिक रिन्यूअल नहीं होता है।", "is filed with the Registrar": "रजिस्ट्रार के पास फाइल की जाती है", "A deed is not filed with the Registrar.": "डीड को रजिस्ट्रार के पास फाइल नहीं किया जाता है।", "Retirement ends the existing deed; the remaining partners continue on new terms.": "रिटायरमेंट मौजूदा डीड को खत्म कर देता है; बाकी बचे पार्टनर्स नई शर्तों पर काम जारी रखते हैं।", "Abhishek, Rajat and Vivek share 5:3:2. Vivek retires. What is the new ratio of Abhishek and Rajat?": "अभिषेक, रजत और विवेक का हिस्सा 5:3:2 है। विवेक रिटायर हो जाता है। अभिषेक और रजत का नया रेशियो क्या होगा?", "3:2 would be if their shares changed — they do not.": "3:2 तब होता अगर उनके शेयर बदलते — पर वे नहीं बदलते।", "s share to Abhishek.": "5:2 गलत तरीके से विवेक का हिस्सा अभिषेक को दे देता है।", "None of these": "इनमें से कोई नहीं", "The answer is present.": "जवाब पहले से मौजूद है।", "s share simply disappears, so Abhishek and Rajat keep their own 5:3.": "विवेक का हिस्सा बस गायब हो जाता है, इसलिए अभिषेक और रजत अपना 5:3 ही बनाए रखते हैं।", "Anand, Bahadur and Chander share equally. Chander retires and his share is taken by Anand and Bahadur in 3:2. What is the new ratio of Anand and Bahadur?": "आनंद, बहादुर और चंदर का हिस्सा बराबर है। चंदर रिटायर हो जाता है और उसका हिस्सा आनंद और बहादुर 3:2 के अनुपात में ले लेते हैं। आनंद और बहादुर का नया रेशियो क्या होगा?", "4:5 loses the equal base share each already had.": "4:5 से पहले से मौजूद बराबर बेस शेयर खत्म हो जाता है।", "3:2 is the acquisition ratio, not the new profit ratio.": "3:2 एक्विजिशन रेशियो है, नया प्रॉफिट रेशियो नहीं।", "2:3 reverses the acquisition.": "2:3 एक्विजिशन को उल्टा कर देता है।", "Anand = 1/3 + (3/5 of 1/3) = 8/15. Bahadur = 1/3 + (2/5 of 1/3) = 7/15. So 8:7.": "आनंद = 1/3 + (1/3 का 3/5) = 8/15. बहादुर = 1/3 + (1/3 का 2/5) = 7/15. इसलिए 8:7।", "Old ratio among Rajender, Satish and Tejpal is 2:2:1. After Satish retires the new ratio is 3:2. What is the gaining ratio?": "राजेंद्र, सतीश और तेजपाल का पुराना रेशियो 2:2:1 है। सतीश के रिटायर होने के बाद नया रेशियो 3:2 है। गेनिंग रेशियो क्या है?", "3:2 is the new ratio itself, not the gain.": "3:2 खुद नया रेशियो है, गेन नहीं।", "2:1 is the old ratio of the two.": "2:1 उन दोनों का पुराना रेशियो है।", "2:2 does not follow from the shares.": "2:2 शेयर्स से नहीं निकलता है।", "Gain = new share − old share. Rajender: 3/5 − 2/5 = 1/5. Tejpal: 2/5 − 1/5 = 1/5. So 1:1.": "गेन = नया शेयर − पुराना शेयर। राजेंद्र: 3/5 − 2/5 = 1/5. तेजपाल: 2/5 − 1/5 = 1/5. इसलिए 1:1।", "Gaining ratio is calculated as ______.": "गेनिंग रेशियो को ______ के रूप में कैलकुलेट किया जाता है।", "new share − old share": "नया शेयर − पुराना शेयर", "old share − new share": "पुराना शेयर − नया शेयर", "That gives the sacrificing ratio.": "उससे सैक्रिफाइसिंग रेशियो मिलता है।", "new share ÷ old share": "नया शेयर ÷ पुराना शेयर", "A ratio of shares is not a subtraction.": "शेयर्स का रेशियो घटाना नहीं है।", "old share + new share": "पुराना शेयर + नया शेयर", "Adding shares does not measure gain.": "शेयर्स जोड़ने से गेन नहीं मापा जाता है।", "Gaining ratio = new share − old share for each continuing partner.": "गेनिंग रेशियो = हर कंटिन्यू करने वाले पार्टनर के लिए नया शेयर − पुराना शेयर।", "s share in ______.": "किसी भी जानकारी के न होने पर, बाकी बचे पार्टनर्स को रिटायर हो रहे पार्टनर का शेयर ______ में लेते हुए माना जाता है।", "the old profit sharing ratio": "पुराने प्रॉफिट शेयरिंग रेशियो में", "the new profit sharing ratio": "नए प्रॉफिट शेयरिंग रेशियो में", "The new ratio does not exist until the acquisition is settled.": "नया रेशियो तब तक नहीं बनता जब तक एक्विजिशन सेटल न हो जाए।", "equal ratio": "बराबर रेशियो", "Equal acquisition must be stated.": "बराबर एक्विजिशन बताया जाना चाहिए।", "the gaining ratio": "गेनिंग रेशियो", "The gaining ratio is the result, not the assumption.": "गेनिंग रेशियो एक नतीजा है, कोई अनुमान नहीं।", "Silence in the deed is read as acquisition in the old ratio.": "डीड में चुप्पी को पुराने रेशियो में एक्विजिशन के रूप में पढ़ा जाता है।", "s capital account is credited with ______.": "रिटायरमेंट पर, रिटायर हो रहे पार्टनर के कैपिटल अकाउंट में ______ को क्रेडिट किया जाता है।", "his share of goodwill": "उसके गुडविल का हिस्सा", "the goodwill of the firm": "फर्म का गुडविल", "s goodwill is not credited to one partner.": "पूरे फर्म का गुडविल एक पार्टनर को क्रेडिट नहीं किया जाता है।", "share of goodwill": "बाकी बचे पार्टनर्स के गुडविल का हिस्सा", "shares are debited to them, not credited to him.": "बाकी बचे पार्टनर्स के शेयर्स उन्हें डेबिट किए जाते हैं, उसे क्रेडिट नहीं।", "none of these": "इनमें से कोई नहीं", "The correct option is present.": "सही विकल्प पहले से मौजूद है।", "Only his own share of goodwill is credited to him.": "केवल उसके अपने गुडविल के हिस्से को उसे क्रेडिट किया जाता है।", "s retirement it is written off ______.": "गुडविल पहले से ही बैलेंस शीट में ₹24,000 पर दिखाई दे रहा है। गोबिंद के रिटायरमेंट पर इसे ______ राइट ऑफ किया जाता है।", "capital accounts in the old ratio": "पुराने अनुपात में सभी भागीदारों के पूंजी खातों में", "by debiting the remaining partners in the new ratio": "नए रेशियो में बाकी बचे पार्टनर्स को डेबिट करके", "s share of it.": "नया रेशियो रिटायर हो रहे पार्टनर के हिस्से को नज़रअंदाज़ कर देता है।", "by debiting only the retiring partner": "केवल रिटायर हो रहे पार्टनर को डेबिट करके", "He does not bear it alone.": "वह इसे अकेले नहीं उठाता है।", "Existing goodwill is written off among ALL partners in the old ratio, because it was built while all were partners.": "मौजूदा गुडविल को पुराने रेशियो में सभी पार्टनर्स के बीच राइट ऑफ किया जाता है, क्योंकि यह तब बना था जब सभी पार्टनर थे।", "s share of goodwill is adjusted ______.": "चमन, रमन और सुमन का हिस्सा 5:3:2 है। रमन रिटायर हो जाता है और चमन और सुमन का नया रेशियो 1:1 है। गुडविल ₹1,00,000 है। रमन के गुडविल के हिस्से को एडजस्ट किया जाता है ______।", "by debiting Chaman and Suman with ₹15,000 each": "चमन और सुमन में से प्रत्येक को ₹15,000 डेबिट करके", "Equal debits ignore who actually gained.": "बराबर डेबिट इस बात को नज़रअंदाज़ करते हैं कि असल में किसे फायदा हुआ।", "by debiting Chaman ₹21,429 and Suman ₹8,571": "चमन को ₹21,429 और सुमन को ₹8,571 डेबिट करके", "That split does not match the gains.": "यह बँटवारा गेन्स से मेल नहीं खाता है।", "by debiting only Suman with ₹30,000": "केवल सुमन को ₹30,000 डेबिट करके", "by debiting Raman with ₹30,000": "रमन को ₹30,000 डेबिट करके", "The retiring partner is credited, never debited, for his own goodwill.": "रिटायर हो रहे पार्टनर को उसके अपने गुडविल के लिए क्रेडिट किया जाता है, कभी डेबिट नहीं।", "s share = 3/10 × ₹1,00,000 = ₹30,000. Chaman gains nothing (5/10 → 1/2); Suman gains 3/10. So Suman alone bears it.": "रमन का हिस्सा = 3/10 × ₹1,00,000 = ₹30,000. चमन को कुछ नहीं मिलता (5/10 →
