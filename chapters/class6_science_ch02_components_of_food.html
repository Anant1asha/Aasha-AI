 1/2); सुमन को 3/10 मिलता है। इसलिए केवल सुमन इसे उठाती है।", "Hidden goodwill is computed when ______.": "हिडन गुडविल तब कैलकुलेट किया जाता है जब ______।", "goodwill is shown in the books": "गुडविल किताबों में दिखाया जाता है", "If it is in the books it is not hidden.": "अगर यह किताबों में है तो यह छिपा हुआ नहीं है।", "the firm has no goodwill": "फर्म का कोई गुडविल नहीं है", "No goodwill means nothing to compute.": "कोई गुडविल नहीं होने का मतलब है कैलकुलेट करने के लिए कुछ नहीं है।", "goodwill is not mentioned but the retiring partner is paid more than his capital share": "गुडविल का ज़िक्र नहीं है लेकिन रिटायर हो रहे पार्टनर को उसके कैपिटल शेयर से ज़्यादा पैसे दिए जाते हैं", "the partners agree on a figure": "पार्टनर्स एक आंकड़े पर सहमत होते हैं", "An agreed figure is not hidden.": "कोई सहमत आंकड़ा छिपा हुआ नहीं होता है।", "Hidden goodwill is the excess actually paid over the capital due — it must be worked out backwards.": "हिडन गुडविल ड्यू कैपिटल से ज़्यादा असल में दिए गए पैसे होते हैं — इसे पीछे की तरफ से कैलकुलेट करना पड़ता है।", "s goodwill is ______.": "एक फर्म का औसत मुनाफा ₹40,000 है। गुडविल की वैल्यू 3 साल की खरीद पर आंकी गई है। फर्म का गुडविल ______ है।", "s profit only.": "यह सिर्फ एक साल का मुनाफा है।", "That divides instead of multiplying.": "यह गुणा करने के बजाय भाग देता है।", "That is four years.": "यह चार साल है।", "Goodwill = average profit × number of years = 40,000 × 3 = ₹1,20,000.": "गुडविल = औसत मुनाफा × सालों की संख्या = 40,000 × 3 = ₹1,20,000।", "s share is 1/3. The amount credited to him is ______.": "गुडविल ₹90,000 है और रिटायर हो रहे पार्टनर का हिस्सा 1/3 है। उसे क्रेडिट की जाने वाली रकम ______ है।", "The whole goodwill is not his.": "पूरा गुडविल उसका नहीं है।", "That is the remaining two-thirds.": "वह बचा हुआ दो-तिहाई है।", "That is a half, not a third.": "यह आधा है, एक-तिहाई नहीं।", "He gets his share only: 90,000 × 1/3 = ₹30,000.": "उसे केवल अपना हिस्सा मिलता है: 90,000 × 1/3 = ₹30,000.", "Profit on revaluation is shared by ______.": "पुनर्मूल्यांकन पर लाभ ____ द्वारा साझा किया जाता है।", "only the remaining partners": "केवल शेष भागीदारों द्वारा", "The retiring partner was a partner when the gain arose.": "लाभ उत्पन्न होने के समय सेवानिवृत्त होने वाला भागीदार भागीदार था।", "only the retiring partner": "केवल सेवानिवृत्त होने वाले भागीदार द्वारा", "The others were partners too.": "अन्य लोग भी भागीदार थे।", "all partners in the old ratio": "पुराने अनुपात में सभी भागीदार", "all partners in the new ratio": "नए अनुपात में सभी भागीदार", "The new ratio has no claim on a past gain.": "नए अनुपात का पिछले लाभ पर कोई दावा नहीं है।", "The gain arose while all were partners, so it is shared in the OLD ratio, including the retiring partner.": "लाभ तब उत्पन्न हुआ जब सभी भागीदार थे, इसलिए इसे सेवानिवृत्त होने वाले भागीदार सहित पुराने अनुपात में साझा किया जाता है।", "An asset of book value ₹50,000 is revalued to ₹42,000. This is a ______.": "₹50,000 की बही मूल्य वाली संपत्ति का पुनर्मूल्यांकन ₹42,000 किया जाता है। यह एक ______ है।", "gain of ₹8,000": "₹8,000 का लाभ", "A fall in value is a loss, not a gain.": "मूल्य में गिरावट एक हानि है, लाभ नहीं।", "loss of ₹8,000": "₹8,000 की हानि", "gain of ₹42,000": "₹42,000 का लाभ", "That is the new value, not the change.": "वह नया मूल्य है, परिवर्तन नहीं।", "A fall in value must be recorded.": "मूल्य में गिरावट को दर्ज किया जाना चाहिए।", "The value fell by 8,000, so it is a loss on revaluation, debited to all partners in the old ratio.": "मूल्य में ₹8,000 की गिरावट आई, इसलिए यह पुनर्मूल्यांकन पर एक हानि है, जिसे पुराने अनुपात में सभी भागीदारों के खाते में डेबिट किया जाता है।", "Accumulated profits in the Balance Sheet are transferred on retirement to ______.": "बैलेंस शीट में संचित लाभ सेवानिवृत्ति पर ______ में स्थानांतरित किए जाते हैं।", "capital accounts": "केवल शेष भागीदारों के पूंजी खातों में", "That would rob the retiring partner of his share.": "इससे सेवानिवृत्त होने वाले भागीदार का हिस्सा छिन जाएगा।", "Reserves are not revaluation items.": "रिज़र्व पुनर्मूल्यांकन की वस्तुएं नहीं हैं।", "the profit and loss account": "लाभ और हानि खाता", "They are distributed, not carried forward.": "उन्हें वितरित किया जाता है, आगे नहीं बढ़ाया जाता।", "Reserves were built while all were partners, so all share them in the old ratio.": "रिज़र्व तब बनाए गए थे जब सभी भागीदार थे, इसलिए सभी पुराने अनुपात में उन्हें साझा करते हैं।", "If the retiring partner is not paid immediately, the amount due is usually transferred to ______.": "यदि सेवानिवृत्त होने वाले भागीदार को तुरंत भुगतान नहीं किया जाता है, तो बकाया राशि आमतौर पर ______ में स्थानांतरित की जाती है।", "his current account": "उसके चालू खाते में", "A current account is not the settlement vehicle.": "चालू खाता निपटान का साधन नहीं है।", "his loan account": "उसके ऋण खाते में", "Goodwill is an intangible, not a liability.": "सद्भावना एक अमूर्त संपत्ति है, दायित्व नहीं।", "Revaluation is closed before settlement.": "पुनर्मूल्यांकन निपटान से पहले बंद कर दिया जाता है।", "An unpaid balance due to a retiring partner is transferred to his loan account and carries interest.": "सेवानिवृत्त होने वाले भागीदार के बकाया अवैतनिक शेष को उसके ऋण खाते में स्थानांतरित किया जाता है और उस पर ब्याज लगता है।", "After retirement, the remaining partners may adjust capitals so that they are in ______.": "सेवानिवृत्ति के बाद, शेष भागीदार पूँजी को इस तरह समायोजित कर सकते हैं कि वे ______ में हों।", "The old ratio no longer applies.": "पुराना अनुपात अब लागू नहीं होता।", "equal amounts regardless of ratio": "अनुपात की परवाह किए बिना समान राशि", "Equal capitals are only right if the new ratio is equal.": "समान पूँजी तभी सही है जब नया अनुपात समान हो।", "The gaining ratio is not a capital ratio.": "गेनिंग रेशियो पूंजी अनुपात नहीं है।", "Capitals are normally brought into line with the new profit sharing ratio.": "पूँजी को आम तौर पर नए लाभ साझाकरण अनुपात के अनुरूप लाया जाता है।", "s death, the amount due to the legal representatives is settled through ______.": "किसी भागीदार की मृत्यु पर, कानूनी प्रतिनिधियों को देय राशि का निपटान ______ के माध्यम से किया जाता है।", "his capital account only": "केवल उसके पूंजी खाते में", "s account.": "पूंजी खाता निष्पादक के खाते में बंद कर दिया जाता है।", "Revaluation is closed earlier.": "पुनर्मूल्यांकन पहले बंद कर दिया जाता है।", "Drawings are unrelated.": "आहरित राशि का इससे कोई संबंध नहीं है।", "s legal representatives.": "मृत भागीदार के कानूनी प्रतिनिधियों के नाम पर एक अलग निष्पादक खाता खोला जाता है।", "s share of profit up to the date of death is usually based on ______.": "मृत्यु की तिथि तक मृत भागीदार के लाभ का हिस्सा आमतौर पर ______ पर आधारित होता है।", "s profit or the turnover to date": "पिछले वर्ष के लाभ या आज तक के कारोबार पर", "A future profit cannot be known.": "भविष्य के लाभ का अनुमान नहीं लगाया जा सकता।", "s goodwill": "फर्म की सद्भावना", "Goodwill is separate from profit share.": "सद्भावना लाभ के हिस्से से अलग है।", "the revaluation gain": "पुनर्मूल्यांकन लाभ", "Revaluation is a different adjustment.": "पुनर्मूल्यांकन एक अलग समायोजन है।", "s profit apportioned for time, or the sales to date at the past profit rate.": "अभ्यास में या तो समय के लिए आनुपातिक रूप से पिछले वर्ष के लाभ का उपयोग किया जाता है, या पिछले लाभ दर पर आज तक की बिक्री का उपयोग किया जाता है।", "What are the different ways in which a partner can retire from the firm?": "वे कौन से अलग-अलग तरीके हैं जिनसे कोई भागीदार फर्म से सेवानिवृत्त हो सकता है?", "A partner may retire in any of these ways.": "एक भागीदार इनमें से किसी भी तरीके से सेवानिवृत्त हो सकता है।", "With the consent of all the other partners.": "अन्य सभी भागीदारों की सहमति से।", "In accordance with an express agreement in the partnership deed.": "साझेदारी विलेख में एक स्पष्ट समझौते के अनुसार।", "By giving written notice to all the other partners, where the partnership is at will.": "अन्य सभी भागीदारों को लिखित नोटिस देकर, जहाँ साझेदारी इच्छा पर आधारित हो।", "Answer: with consent, as per the deed, or by written notice in a partnership at will.": "उत्तर: सहमति से, विलेख के अनुसार, या इच्छा पर साझेदारी में लिखित नोटिस द्वारा।", "Write the various matters that need adjustment at the time of retirement of a partner.": "उन विभिन्न मामलों को लिखें जिनमें किसी भागीदार की सेवानिवृत्ति के समय समायोजन की आवश्यकता होती है।", "Start with what he is owed.": "उस राशि से शुरू करें जो उसे देय है।", "His capital and current account balances, and his share of goodwill.": "उसके पूंजी और चालू खाते के शेष, और सद्भावना में उसका हिस्सा।", "His share of reserves and of any revaluation gain or loss.": "रिज़र्व और किसी भी पुनर्मूल्यांकन लाभ या हानि में उसका हिस्सा।", "Then the continuing partners: new profit sharing ratio and gaining ratio, adjustment of capitals, and settlement of the amount due.": "फिर निरंतर भागीदार: नया लाभ साझाकरण अनुपात और गेनिंग रेशियो, पूँजी का समायोजन, और बकाया राशि का निपटान।", "Answer: goodwill, revaluation, reserves, new and gaining ratios, capital adjustment and settlement.": "उत्तर: सद्भावना, पुनर्मूल्यांकन, रिज़र्व, नया और गेनिंग रेशियो, पूँजी समायोजन और निपटान।", "Distinguish between sacrificing ratio and gaining ratio.": "सैक्रिफाइसिंग रेशियो और गेनिंग रेशियो के बीच अंतर बताएं।", "Compare what each measures.": "तुलना करें कि प्रत्येक क्या मापता है।", "Sacrificing ratio = old share − new share. It arises when a partner gives up a part of his share.": "सैक्रिफाइसिंग रेशियो = पुराना हिस्सा − नया हिस्सा। यह तब उत्पन्न होता है जब कोई भागीदार अपने हिस्से का कुछ भाग छोड़ देता है।", "Gaining ratio = new share − old share. It arises when a partner takes more.": "गेनिंग रेशियो = नया हिस्सा − पुराना हिस्सा। यह तब उत्पन्न होता है जब कोई भागीदार अधिक हिस्सा लेता है।", "Sacrificing ratio is used on admission; gaining ratio on retirement or death.": "सैक्रिफाइसिंग रेशियो का उपयोग प्रवेश पर किया जाता है; गेनिंग रेशियो का उपयोग सेवानिवृत्ति या मृत्यु पर किया जाता है।", "Answer: sacrifice is old − new (admission); gain is new − old (retirement/death).": "उत्तर: बलिदान पुराना − नया (प्रवेश); लाभ नया − पुराना (सेवानिवृत्ति/मृत्यु)।", "Why do firms revalue assets and reassess liabilities on retirement or death of a partner?": "फर्म किसी भागीदार की सेवानिवृत्ति या मृत्यु पर संपत्तियों का पुनर्मूल्यांकन क्यों करती है और देनदारियों का पुनर्मूल्यांकन क्यों करती है?", "Think about what the departing partner is owed.": "सोचें कि जाने वाले भागीदार को क्या देय है।", "The books may carry assets at out-of-date values.": "बहीखातों में संपत्तियां पुरानी कीमतों पर दर्ज हो सकती हैं।", "If they are not corrected, the departing partner is paid on wrong figures — too much or too little.": "यदि उन्हें सुधारा नहीं जाता है, तो जाने वाले भागीदार को गलत आंकड़ों पर भुगतान किया जाता है — बहुत अधिक या बहुत कम।", "Revaluation also brings unrecorded assets and liabilities into the books.": "पुनर्मूल्यांकन बहीखातों में बिना दर्ज की गई संपत्तियों और देनदारियों को भी लाता है।", "Answer: so the amount due to the departing partner reflects true values, and unrecorded items are brought in.": "उत्तर: ताकि जाने वाले भागीदार को देय राशि वास्तविक मूल्यों को दर्शाए, और बिना दर्ज की गई वस्तुओं को लाया जा सके।", "Why is a retiring or deceased partner entitled to a share of the goodwill of the firm?": "एक सेवानिवृत्त या मृत भागीदार फर्म की सद्भावना के हिस्से का हकदार क्यों है?", "Think about how goodwill was built.": "सोचें कि सद्भावना कैसे बनी थी।", "s reputation and customer base.": "सद्भावना फर्म की प्रतिष्ठा और ग्राहक आधार का मूल्य है।", "It was built over the years while the retiring partner was working in the firm.": "यह उन वर्षों में बनी थी जब सेवानिवृत्त होने वाला भागीदार फर्म में काम कर रहा था।", "He therefore helped create it and must be paid for his share when he leaves.": "इसलिए उसने इसे बनाने में मदद की और जब वह जाता है तो उसके हिस्से का भुगतान किया जाना चाहिए।", "Answer: because the goodwill was earned during his time in the firm, so part of it is his.": "उत्तर: क्योंकि सद्भावना फर्म में उसके समय के दौरान अर्जित की गई थी, इसलिए इसका एक हिस्सा उसका है।", "Explain the modes of payment to a retiring partner.": "सेवानिवृत्त होने वाले भागीदार को भुगतान के तरीकों की व्याख्या करें।", "Name each route.": "प्रत्येक मार्ग का नाम बताएं।", "The amount may be paid in cash or by cheque immediately.": "राशि का भुगतान तुरंत नकद या चेक द्वारा किया जा सकता है।", "Or it may be transferred to his loan account, to be paid later with interest.": "या इसे उसके ऋण खाते में स्थानांतरित किया जा सकता है, जिसका भुगतान बाद में ब्याज के साथ किया जाना है।", "Or it may be paid in instalments, with or without interest, as the deed provides.": "या विलेख के अनुसार, ब्याज के साथ या उसके बिना, किस्तों में भुगतान किया जा सकता है।", "Or the continuing partners may settle it by transferring assets to him.": "या निरंतर भागीदार उसे संपत्तियां स्थानांतरित करके इसका निपटान कर सकते हैं।", "Answer: immediate payment, loan account, instalments, or settlement in assets.": "उत्तर: तत्काल भुगतान, ऋण खाता, किश्तें, या संपत्तियों में निपटान।", "How will you compute the amount payable to a deceased partner?": "आप एक मृत भागीदार को देय राशि की गणना कैसे करेंगे?", "Build the total step by step.": "कुल को चरण दर चरण बनाएं।", "Take the credit balance of his capital account and current account.": "उसके पूंजी खाते और चालू खाते का क्रेडिट बैलेंस लें।", "Add his share of goodwill, of reserves and accumulated profits.": "सद्भावना, रिज़र्व और संचित लाभ में उसका हिस्सा जोड़ें।", "Add his share of any revaluation gain, and his share of profit up to the date of death.": "किसी भी पुनर्मूल्यांकन लाभ में उसका हिस्सा, और मृत्यु की तिथि तक लाभ में उसका हिस्सा जोड़ें।", "Deduct drawings, interest on drawings, his share of losses and any revaluation loss.": "आहरित राशि, आहरित राशि पर ब्याज, हानियों में उसका हिस्सा और किसी भी पुनर्मूल्यांकन हानि को घटाएं।", "Answer: capital + current + goodwill share + reserves + revaluation + profit to date, less drawings and losses.": "उत्तर: पूंजी + चालू + सद्भावना हिस्सा + रिज़र्व + पुनर्मूल्यांकन + आज तक का लाभ, माइनस आहरित राशि और हानियां।", "Explain the treatment of goodwill at the time of retirement or on the event of death of a partner.": "किसी भागीदार की सेवानिवृत्ति के समय या मृत्यु की घटना पर सद्भावना की व्यवहार प्रक्रिया की व्याख्या करें।", "Deal with goodwill already in the books first.": "पहले बहीखातों में पहले से मौजूद सद्भावना से निपटें।", "Existing goodwill is written off by debiting all partners in the OLD ratio.": "मौजूदा सद्भावना को पुराने अनुपात में सभी भागीदारों को डेबिट करके राइट ऑफ किया जाता है।", "Then value the goodwill afresh by any accepted method.": "फिर किसी भी स्वीकृत तरीके से सद्भावना का नया मूल्यांकन करें।", "s capital account with his share.": "सेवानिवृत्त होने वाले भागीदार के पूंजी खाते में उसका हिस्सा क्रेडिट करें।", "Debit the continuing partners in their GAINING ratio — they are the ones who benefit.": "निरंतर भागीदारों को उनके गेन रेशियो में डेबिट करें — वे ही लाभान्वित होने वाले हैं।", "Answer: write off old goodwill in the old ratio; credit the retiring partner with his share of the new value; debit the gainers in the gaining ratio.": "उत्तर: पुराने अनुपात में पुरानी सद्भावना को राइट ऑफ करें; सेवानिवृत्त होने वाले भागीदार को नए मूल्य में उसके हिस्से के साथ क्रेडिट करें; लाभान्वित होने वालों को गेनिंग रेशियो में डेबिट करें।", "Discuss the various methods of computing the share in profits in the event of death of a partner.": "किसी भागीदार की मृत्यु की घटना में लाभ में हिस्से की गणना करने के विभिन्न तरीकों पर चर्चा करें।", "There are three common methods.": "तीन सामान्य तरीके हैं।", "s profit apportioned for the months up to death.": "समय आधार: मृत्यु तक के महीनों के लिए आनुपातिक रूप से पिछले वर्ष का लाभ।", "Turnover basis: sales up to the date of death × the past rate of profit on sales.": "कारोबार आधार: मृत्यु की तिथि तक की बिक्री × बिक्री पर लाभ की पिछली दर।", "Average profit basis: average of the last few years, apportioned for the period.": "औसत मुनाफे का आधार: पिछले कुछ वर्षों का औसत, जो मौजूदा अवधि के लिए तय किया गया हो।", "Answer: time basis, turnover basis, or average-profit basis.": "उत्तर: समय का आधार, टर्नओवर का आधार, या औसत-मुनाफे का आधार।", "Retirement and Death of a Partner": "एक पार्टनर की रिटायरमेंट और मृत्यु", "Accountancy · Class 12 · Partnership Accounts · Chapter 3": "अकाउंटेंसी · क्लास 12 · पार्टनरशिप अकाउंट्स · चैप्टर 3", "When a partner leaves, the firm is reconstituted. Everything you will learn here answers one question: what is he owed, and who pays for it?": "जब कोई पार्टनर फर्म छोड़ता है, तो फर्म का पुनर्गठन होता है। यहाँ आप जो कुछ भी सीखेंगे, वह एक सवाल का जवाब देता है: उसे क्या मिलना चाहिए, और इसका भुगतान कौन करेगा?", "Why the firm must be re-measured": "फर्म का पुनर्मूल्यांकन क्यों किया जाना चाहिए", "The old deed ends the moment a partner retires or dies. Before a new deed is drawn, every claim has to be settled — goodwill, reserves, revaluation, and his share of profit to the date he leaves.": "जैसे ही कोई पार्टनर रिटायर होता है या उसकी मृत्यु होती है, पुराना डीड खत्म हो जाता है। नया डीड बनाने से पहले, हर दावे का निपटारा करना होता है — गुडविल, रिज़र्व, रीवैल्यूएशन, और उसके जाने तक के मुनाफे में उसका हिस्सा।", "What he is owed — the five credits": "उसे क्या मिलना चाहिए — पाँच क्रेडिट", "His capital balance, his current account balance, his share of goodwill, his share of accumulated profits, and his share of any gain on revaluation.": "उसका कैपिटल बैलेंस, उसका करंट अकाउंट बैलेंस, गुडविल में उसका हिस्सा, जमा हुए मुनाफे में उसका हिस्सा, और रीवैल्यूएशन पर किसी भी लाभ में उसका हिस्सा।", "Work out the new ratio": "नया अनुपात निकालें", "s share each survivor takes. The new ratio updates as you go.": "पुराने अनुपात को सेट करने के लिए स्लाइडर्स को मूव करें, फिर चुनें कि रिटायर होने वाले पार्टनर के शेयर का कितना हिस्सा हर बचा हुआ पार्टनर लेगा। जैसे-जैसे आप आगे बढ़ेंगे, नया अनुपात अपडेट होता जाएगा।", "If the deed says nothing, the survivors are assumed to take his share in their OLD ratio.": "अगर डीड में कुछ नहीं लिखा है, तो यह मान लिया जाता है कि बचे हुए पार्टनर उसका शेयर अपने पुराने अनुपात में लेंगे।", "The rule that catches everyone": "वह नियम जो सभी पर लागू होता है", "s new share = his old share + the part of the retiring share he acquires.": "रिटायर होने वाले पार्टनर का हिस्सा गायब नहीं होता — इसे फिर से बांटा जाता है। हर बचे हुए पार्टनर का नया हिस्सा = उसका पुराना हिस्सा + रिटायर होने वाले के शेयर का वह हिस्सा जो उसे मिलता है।", "Worked example — equal partners": "हल किया गया उदाहरण — बराबर के पार्टनर", "Anand, Bahadur and Chander share equally. Chander retires; Anand and Bahadur take his share in 3:2. Find the new ratio.": "आनंद, बहादुर और चंदर बराबर हिस्सेदार हैं। चंदर रिटायर होता है; आनंद और बहादुर उसका हिस्सा 3:2 के अनुपात में लेते हैं। नया अनुपात निकालें।", "s share = 1/3.": "चंदर का हिस्सा = 1/3।", "Anand takes 3/5 of 1/3 = 1/5.": "आनंद 1/3 का 3/5 = 1/5 लेता है।", "Bahadur takes 2/5 of 1/3 = 2/15.": "बहादुर 1/3 का 2/5 = 2/15 लेता है।", "Anand = 1/3 + 1/5 = 8/15.": "आनंद = 1/3 + 1/5 = 8/15।", "Bahadur = 1/3 + 2/15 = 7/15.": "बहादुर = 1/3 + 2/15 = 7/15।", "New ratio = 8 : 7.": "नया अनुपात = 8 : 7।", "Abhishek, Rajat and Vivek share 5:3:2. Vivek retires and his share is NOT taken by anyone. New ratio of Abhishek and Rajat?": "अभिषेक, रजत और विवेक का हिस्सा 5:3:2 है। विवेक रिटायर होता है और उसका हिस्सा कोई नहीं लेता है। अभिषेक और रजत का नया अनुपात क्या होगा?", "Nobody acquired his share, so the survivors keep their own shares: 5 : 3.": "किसी ने उसका हिस्सा नहीं लिया, इसलिए बचे हुए पार्टनर अपने हिस्से को वैसे ही रखते हैं: 5 : 3।", "Who gained, and by how much?": "किसे फायदा हुआ, और कितना?", "Enter the old and new shares. The gaining ratio is new minus old — a positive number means that partner gained, a negative means he sacrificed.": "पुराने और नए हिस्से दर्ज करें। गेनिंग रेशियो नया माइनस पुराना होता है — अगर नंबर पॉजिटिव है तो उस पार्टनर को फायदा हुआ है, अगर नेगेटिव है तो उसने बलिदान दिया है।", "The gainers must compensate the retiring partner for his share of goodwill.": "फायदा पाने वालों को रिटायर होने वाले पार्टनर को उसके गुडविल के हिस्से के लिए मुआवजा देना होगा।", "Gaining ratio is the mirror of sacrifice": "गेनिंग रेशियो बलिदान का आईना है", "Sacrificing ratio = old − new, used when a partner is admitted. Gaining ratio = new − old, used when a partner leaves. Same arithmetic, opposite direction.": "सैक्रिफाइसिंग रेशियो = पुराना − नया, जिसका इस्तेमाल तब होता है जब कोई नया पार्टनर शामिल होता है। गेनिंग रेशियो = नया − पुराना, जिसका इस्तेमाल तब होता है जब कोई पार्टनर छोड़ता है। गणित वही है, बस दिशा उल्टी है।", "Worked example — the gaining ratio": "हल किया गया उदाहरण — गेनिंग रेशियो", "Old ratio of Rajender, Satish and Tejpal was 2:2:1. After Satish retires the new ratio is 3:2. Find the gaining ratio.": "राजेंद्र, सतीश और तेजपाल का पुराना अनुपात 2:2:1 था। सतीश के रिटायर होने के बाद नया अनुपात 3:2 है। गेनिंग रेशियो निकालें।", "Rajender: old 2/5, new 3/5, gain = 1/5.": "राजेंद्र: पुराना 2/5, नया 3/5, फायदा = 1/5।", "Tejpal: old 1/5, new 2/5, gain = 1/5.": "तेजपाल: पुराना 1/5, नया 2/5, फायदा = 1/5।", "Both gained equally.": "दोनों को बराबर फायदा हुआ।", "Gaining ratio = 1 : 1.": "गेनिंग रेशियो = 1 : 1।", "Goodwill — the part people get wrong": "गुडविल — वह हिस्सा जिसे लोग अक्सर गलत समझते हैं", "Two separate jobs. First write off any goodwill already sitting in the books, among ALL partners in the OLD ratio. Then value it fresh, credit the leaver with his share, and debit the gainers.": "दो अलग-अलग काम। सबसे पहले, किताबों में पहले से मौजूद किसी भी गुडविल को सभी पार्टनर्स के बीच पुराने अनुपात में राइट ऑफ करें। फिर इसका नया मूल्यांकन करें, जाने वाले पार्टनर के खाते में उसका हिस्सा क्रेडिट करें, और फायदा पाने वालों के खाते में डेबिट करें।", "Value the goodwill and split it": "गुडविल का मूल्यांकन करें और इसे बांटें", "s share, and shows who is debited.": "औसत मुनाफे और खरीद के वर्षों को सेट करें। कैलकुलेटर फर्म का मूल्यांकन करता है, रिटायर होने वाले पार्टनर का हिस्सा लेता है, और दिखाता है कि किसे डेबिट किया गया है।", "s goodwill.": "केवल उसका अपना हिस्सा, पूरी फर्म की सद्भावना कभी नहीं।", "Worked example — who bears the goodwill": "हल किया गया उदाहरण — गुडविल कौन उठाता है", "s share = 3/10 × 1,00,000 = ₹30,000.": "रमन का हिस्सा = 3/10 × 1,00,000 = ₹30,000।", "Chaman: old 5/10 = 0.5, new 1/2 = 0.5 — gain nil.": "चमन: पुराना 5/10 = 0.5, नया 1/2 = 0.5 — फायदा शून्य।", "Suman: old 2/10 = 0.2, new 1/2 = 0.5 — gain 0.3.": "सुमन: पुराना 2/10 = 0.2, नया 1/2 = 0.5 — फायदा 0.3।", "Only Suman gained, so only Suman is debited.": "केवल सुमन को फायदा हुआ, इसलिए केवल सुमन को डेबिट किया जाता है।", "Debit Suman ₹30,000; credit Raman ₹30,000.": "सुमन को ₹30,000 डेबिट करें; रमन को ₹30,000 क्रेडिट करें।", "Hidden goodwill": "छिपा हुआ गुडविल", "Sometimes no figure is mentioned. If the leaver is paid more than his capital balance, the excess is the hidden goodwill — work it backwards from the amount actually agreed.": "कभी-कभी कोई आंकड़ा नहीं दिया जाता है। अगर जाने वाले पार्टनर को उसके कैपिटल बैलेंस से ज्यादा पैसे दिए जाते हैं, तो अतिरिक्त रकम छिपा हुआ गुडविल है — जो असल में तय हुई रकम से उल्टा हिसाब लगाकर निकाला जाता है।", "purchase. What is the goodwill of the firm?": "औसत मुनाफा ₹40,000 है और गुडविल का मूल्यांकन 3 साल की खरीद पर किया गया है। फर्म का गुडविल क्या है?", "Goodwill = average profit × years of purchase = 40,000 × 3 = ₹1,20,000.": "गुडविल = औसत मुनाफा × खरीद के वर्ष = 40,000 × 3 = ₹1,20,000।", "Revaluation — correct the books first": "रीवैल्यूएशन — पहले किताबों को ठीक करें", "Assets may be carried at out-of-date values. A Revaluation Account collects every rise and fall, and the net gain or loss goes to ALL partners in the OLD ratio — including the one who is leaving.": "एसेट्स की कीमत पुरानी हो सकती है। एक रीवैल्यूएशन अकाउंट हर उतार-चढ़ाव को दर्ज करता है, और शुद्ध लाभ या हानि सभी पार्टनर्स को पुराने अनुपात में मिलती है — जिसमें वह पार्टनर भी शामिल है जो फर्म छोड़ रहा है।", "Revalue the assets and share the gain": "एसेट्स का रीवैल्यूएशन करें और लाभ बांटें", "Change the book value and the new value of each asset. The calculator finds the net gain or loss and splits it among the partners in the old ratio.": "हर एसेट की बुक वैल्यू और नई वैल्यू बदलें। कैलकुलेटर शुद्ध लाभ या हानि निकालता है और इसे पार्टनर्स के बीच पुराने अनुपात में बांटता है।", "A rise in an asset is a gain; a rise in a liability is a loss.": "एसेट में वृद्धि का मतलब लाभ है; देनदारी में वृद्धि का मतलब हानि है।", "Worked example — revaluation loss": "हल किया गया उदाहरण — रीवैल्यूएशन पर हानि", "An asset of book value ₹50,000 is revalued to ₹42,000. Partners share 3:2:1. Show the effect.": "₹50,000 की बुक वैल्यू वाले एक एसेट का रीवैल्यूएशन करके ₹42,000 कर दिया जाता है। पार्टनर्स का हिस्सा 3:2:1 है। इसका असर दिखाएं।", "Fall in value = 50,000 − 42,000 = ₹8,000.": "मूल्य में गिरावट = 50,000 − 42,000 = ₹8,000।", "A fall in an asset is a loss on revaluation.": "एसेट की कीमत में गिरावट का मतलब रीवैल्यूएशन पर हानि है।", "Loss is debited to all partners in the old ratio 3:2:1.": "हानि को सभी पार्टनर्स के पुराने अनुपात 3:2:1 में डेबिट किया जाता है।", "Partner A bears 8,000 × 3/6 = ₹4,000.": "पार्टनर A ₹8,000 × 3/6 = ₹4,000 उठाता है।", "Partner B bears 8,000 × 2/6 = ₹2,667.": "पार्टनर B ₹8,000 × 2/6 = ₹2,667 उठाता है।", "Partner C bears 8,000 × 1/6 = ₹1,333.": "पार्टनर C ₹8,000 × 1/6 = ₹1,333 उठाता है।", "Reserves follow the same logic": "रिज़र्व का नियम भी यही है", "Accumulated profits and reserves were built while everyone was a partner. So they are credited to ALL partners — the leaver included — in the old ratio.": "जमा हुआ मुनाफा और रिज़र्व तब बने थे जब सभी पार्टनर थे। इसलिए इन्हें सभी पार्टनर्स — जाने वाले पार्टनर सहित — के पुराने अनुपात में क्रेडिट किया जाता है।", "Build the amount due": "बकाया रकम बनाएं", "s claim. The total updates live — add goodwill and reserves, take away drawings and his share of losses.": "रिटायर होने वाले पार्टनर के दावे के हर हिस्से को सेट करें। कुल रकम लाइव अपडेट होती है — गुडविल और रिज़र्व जोड़ें, ड्रॉइंग्स और उसके नुकसान का हिस्सा घटाएं।", "This total is what is credited to his capital account before settlement.": "यही कुल रकम है जो सेटलमेंट से पहले उसके कैपिटल अकाउंट में क्रेडिट की जाती है।", "Worked example — the full settlement": "हल किया गया उदाहरण — पूरा सेटलमेंट", "A partner retires with capital ₹60,000, current account ₹5,000, share of goodwill ₹12,000, share of reserves ₹8,000 and drawings ₹9,000. What is due?": "एक पार्टनर ₹60,000 कैपिटल, ₹5,000 करंट अकाउंट, ₹12,000 गुडविल का हिस्सा, ₹8,000 रिज़र्व का हिस्सा और ₹9,000 ड्रॉइंग्स के साथ रिटायर होता है। उसे क्या मिलना चाहिए?", "Capital 60,000 + current 5,000 = 65,000.": "कैपिटल 60,000 + करंट 5,000 = 65,000।", "Add goodwill share 12,000 → 77,000.": "गुडविल का हिस्सा 12,000 जोड़ें → 77,000।", "Add reserves share 8,000 → 85,000.": "रिज़र्व का हिस्सा 8,000 जोड़ें → 85,000।", "Deduct drawings 9,000 → 76,000.": "ड्रॉइंग्स 9,000 घटाएं → 76,000।", "Amount due to the retiring partner = ₹76,000.": "रिटायर होने वाले पार्टनर को मिलने वाली रकम = ₹76,000।", "Settling the amount": "रकम का सेटलमेंट", "He may be paid at once, or the balance may go to his loan account carrying interest, or be paid in instalments, or be settled by transferring an asset to him.": "उसे एक साथ भुगतान किया जा सकता है, या बचा हुआ बैलेंस उसके लोन अकाउंट में जा सकता है जिस पर ब्याज लगता है, या किस्तों में भुगतान किया जा सकता है, या उसे कोई एसेट ट्रांसफर करके सेटल किया जा सकता है।", "After he leaves, the remaining partners usually bring their capitals into line with the NEW profit sharing ratio — paying in or withdrawing the difference.": "उसके जाने के बाद, बाकी पार्टनर्स आमतौर पर अपने कैपिटल को नए प्रॉफिट शेयरिंग रेशियो के हिसाब से लाते हैं — अंतर का भुगतान करके या निकालकर।", "When a partner dies": "जब किसी पार्टनर की मृत्यु हो जाती है", "s account, and his share of profit runs to the date of death.": "गणित वही रहता है, लेकिन दावा एक एग्जीक्यूटर के अकाउंट के जरिए उसके कानूनी वारिसों को जाता है, और मुनाफे में उसका हिस्सा मृत्यु की तारीख तक चलता है।", "His share of profit to the date of death": "मृत्यु की तारीख तक मुनाफे में उसका हिस्सा", "s profit apportioned for the months, or turnover to date at the past profit rate, or average profit apportioned for the period.": "तीन स्वीकृत तरीके: पिछले साल के मुनाफे को महीनों के हिसाब से बांटना, या पिछले मुनाफे की दर पर अब तक का टर्नओवर, या अवधि के हिसाब से औसत मुनाफा बांटना।", "Four mistakes that cost marks": "चार गलतियाँ जो नंबर कटवा सकती हैं", "Check every answer against these.": "हर उत्तर को इनसे चेक करें।", "Crediting the whole goodwill": "पूरी गुडविल को क्रेडिट करना", "Only his SHARE is credited to him. The rest belongs to the others.": "केवल उसका हिस्सा ही उसके खाते में क्रेडिट किया जाता है। बाकी हिस्सा दूसरों का होता है।", "Sharing revaluation in the new ratio": "नए अनुपात में रीवैल्यूएशन बांटना", "It arose while he was a partner. Always the OLD ratio.": "यह तब हुआ था जब वह पार्टनर था। हमेशा पुराने अनुपात का इस्तेमाल करें।", "Forgetting to write off existing goodwill": "मौजूदा गुडविल को राइट ऑफ करना भूल जाना", "Goodwill already in the books is written off among ALL partners in the old ratio, first.": "किताबों में पहले से मौजूद गुडविल को सबसे पहले सभी पार्टनर्स के बीच पुराने अनुपात में राइट ऑफ किया जाता है।", "Debiting the retiring partner for goodwill": "गुडविल के लिए रिटायर होने वाले पार्टनर को डेबिट करना", "He is CREDITED. The gainers are debited, in the gaining ratio.": "उसे क्रेडिट किया जाता है। फायदा पाने वालों को, गेनिंग रेशियो में डेबिट किया जाता है।", "His capital account is credited with his share of goodwill; the gaining partners are debited.": "उसके कैपिटल अकाउंट में गुडविल का उसका हिस्सा क्रेडिट किया जाता है; फायदा पाने वाले पार्टनर्स को डेबिट किया जाता है।", "capital + current + goodwill share + reserves + revaluation, less drawings and losses": "कैपिटल + करंट + गुडविल का हिस्सा + रिज़र्व + रीवैल्यूएशन, जिसमें से ड्रॉइंग्स और नुकसान घटाए गए हों", "s share acquired": "पुराना हिस्सा + जाने वाले के शेयर का वह हिस्सा जो उसे मिला", "Gaining ratio": "गेनिंग रेशियो", "new share − old share; the gainers compensate him": "नया हिस्सा − पुराना हिस्सा; फायदा पाने वाले उसे मुआवजा देते हैं", "write off old in old ratio; credit his share; debit gainers in gaining ratio": "पुराने को पुराने अनुपात में राइट ऑफ करें; उसका हिस्सा क्रेडिट करें; फायदा पाने वालों को गेनिंग रेशियो में डेबिट करें", "Revaluation": "रीवैल्यूएशन", "net gain or loss to ALL partners in the OLD ratio": "शुद्ध लाभ या हानि सभी पार्टनर्स को पुराने अनुपात में", "cash, loan account, instalments, or an asset": "नकद, लोन अकाउंट, किश्तें, या कोई एसेट", "You have the idea. The arena has 30 questions from this chapter — the self-tests, short answers and long answers.": "आपको आइडिया मिल गया है। एरीना में इस चैप्टर से 30 सवाल हैं — सेल्फ-टेस्ट, छोटे उत्तर और लंबे उत्तर।", "He holds one third because three partners share equally.": "चूँकि तीन साझेदारों के बीच बराबर बँटवारा होता है, इसलिए उसका हिस्सा एक-तिहाई है।", "Anand gets 3 parts of every 5 that the two survivors take.": "आनंद को हर 5 में से 3 हिस्से मिलते हैं जो बचे हुए दो साझेदार लेते हैं।", "Bahadur gets the remaining 2 parts of every 5.": "बहादुर को हर 5 में से बचे हुए 2 हिस्से मिलते हैं।", "His old share plus the part he gained.": "उसका पुराना हिस्सा और साथ में उसे मिला हुआ हिस्सा।", "The same idea for Bahadur.": "बहादुर के लिए भी यही बात है।", "Compare the two over the same denominator.": "दोनों की तुलना समान हर पर करें।", "New share minus old share is what he took from Satish.": "नया हिस्सा में से पुराना हिस्सा घटाने पर वही मिलता है जो उसने सतीश से लिया था।", "The same subtraction for Tejpal.": "तेजपाल के लिए भी यही घटाव करें।", "Both gains came out as one fifth.": "दोनों का फायदा एक-पाँचवाँ ही निकला।", "The gains written in the order of the partners.": "साझेदारों के क्रम में फायदे लिखे गए हैं।", "s goodwill belongs to him.": "फर्म की सद्भावना में केवल उसका अपना हिस्सा ही उसका होता है।", "If the share did not change, he gained nothing.": "अगर उसका हिस्सा नहीं बदला, तो उसे कुछ नहीं मिला।", "Her share rose, so she is the one who gained.": "उसका हिस्सा बढ़ गया, इसलिए फायदा उसी को हुआ है।", "Whoever gains pays. Chaman gained nothing, so he pays nothing.": "जिसका फायदा हुआ, वही भुगतान करेगा। चमन को कुछ नहीं मिला, इसलिए वह कुछ नहीं देगा।", "s gain, so the books still balance.": "एक साझेदार का नुकसान दूसरे का फायदा होता है, इसलिए हिसाब बराबर ही रहता है।", "Compare the book value with the real value.": "किताबों के मूल्य की तुलना असली मूल्य से करें।", "The firm is worth less than the books said.": "किताबों में जितना लिखा है, फर्म की असल कीमत उससे कम है।", "It happened while all three were partners, so all three bear it.": "यह तब हुआ जब तीनों साझेदार थे, इसलिए तीनों को ही इसका बोझ उठाना पड़ेगा।", "Three parts out of six.": "छह में से तीन हिस्से।", "Two parts out of six.": "छह में से दो हिस्से।", "One part out of six, and the three add back to 8,000.": "छह में से एक हिस्सा, और ये तीनों मिलकर वापस 8,000 हो जाते हैं।", "Start with the two balances standing in his name.": "उसके नाम पर मौजूद दो शेष राशियों से शुरू करें।", "He helped build the reputation, so part of it is his.": "उसने नाम कमाने में मदद की थी, इसलिए इसका कुछ हिस्सा उसका भी है।", "The reserves were built while he was still a partner.": "रिजर्व तब बने थे जब वह अभी भी साझेदार था।", "Money he already took out is not owed to him again.": "जो पैसा वह पहले ही निकाल चुका है, वह उसे दोबारा नहीं दिया जाएगा।", "Everything credited to him, less what he already took.": "उसे जो कुछ भी क्रेडिट किया गया है, उसमें से जो उसने पहले ही निकाल लिया है उसे घटा दें।", "Now the mirror image — a partner joins": "अब दर्पण छवि — एक भागीदार जुड़ता है", "Retirement was one person leaving and the others gaining. Admission is the exact opposite: a new partner arrives, and to make room for him the existing partners must give something up. Nothing appears from nowhere.": "सेवानिवृत्ति का अर्थ था एक व्यक्ति का जाना और दूसरों का लाभ उठाना। प्रवेश इसका बिल्कुल उल्टा है: एक नया भागीदार आता है, और उसके लिए जगह बनाने के लिए मौजूदा भागीदारों को कुछ छोड़ना पड़ता है। कुछ भी हवा से नहीं आता।", "Admit a new partner and watch the sacrifice": "एक नए भागीदार को शामिल करें और बलिदान देखें", "s share shrinking as his grows — and the parts they lose add up exactly to the parts he takes.": "तय करें कि नया आने वाला फर्म का कितना हिस्सा मांगता है। बार प्रत्येक मौजूदा भागीदार के हिस्से को सिकुड़ते हुए दिखाते हैं जबकि उसका हिस्सा बढ़ता है — और वे जो हिस्से खोते हैं, वे बिल्कुल उतने ही होते हैं जितने वह लेता है।", "Sacrificing ratio = old share − new share. It is the mirror of the gaining ratio.": "बलिदान अनुपात = पुराना हिस्सा − नया हिस्सा। यह लाभ अनुपात का दर्पण है।", "Worked example — admitting C for one fifth": "हल किया गया उदाहरण — C को पांचवें हिस्से के लिए शामिल करना", "A and B share 3 : 2. C is admitted for 1/5 of the firm, and the deed says nothing about who gives up what. Find the new ratio and the sacrificing ratio.": "A और B का अनुपात 3 : 2 है। C को फर्म के 1/5 हिस्से के लिए शामिल किया जाता है, और विलेख में इस बारे में कुछ नहीं कहा गया है कि कौन क्या छोड़ता है। नया अनुपात और बलिदान अनुपात ज्ञात करें।", "C is to get 1/5 of the firm.": "C को फर्म का 1/5 हिस्सा मिलेगा।", "That is the share he is asking for.": "यह वह हिस्सा है जो वह मांग रहा है।", "The remaining 4/5 stays with A and B.": "शेष 4/5 A और B के पास रहेगा।", "Whatever C takes must come out of the existing 1.": "C जो कुछ भी लेता है, वह मौजूदा 1 में से ही आना चाहिए।", "A and B divide that 4/5 in their old 3 : 2.": "A और B उस 4/5 को अपने पुराने 3 : 2 में बांटते हैं।", "Silence in the deed means the sacrifice follows the old ratio.": "विलेख में चुप्पी का मतलब है कि बलिदान पुराने अनुपात का पालन करता है।", "Three parts of every five, applied to the 4/5 left behind.": "हर पांच में से तीन हिस्से, पीछे छूटे 4/5 पर लागू।", "Two parts of every five, applied to the same 4/5.": "हर पांच में से दो हिस्से, उसी 4/5 पर लागू।", "A gives up 3/25, B gives up 2/25.": "A 3/25 छोड़ता है, B 2/25 छोड़ता है।", "Old share minus new share is what each one handed over.": "पुराना हिस्सा घटा नया हिस्सा, यही वह है जो प्रत्येक ने सौंप दिया।", "Nothing appears from nowhere — what he got is what they gave.": "कुछ भी हवा से नहीं आता — उसे जो मिला, वही उन्होंने दिया।", "New ratio = 12 : 8 : 5, sacrificing ratio = 3 : 2.": "नया अनुपात = 12 : 8 : 5, बलिदान अनुपात = 3 : 2.", "The three new shares add to 1, and the sacrifices add to his share.": "तीन नए हिस्से 1 तक जुड़ते हैं, और बलिदान उसके हिस्से तक जुड़ते हैं।", "Two events, one law": "दो घटनाएँ, एक नियम", "The same conservation rule, read in opposite directions. Cover one column and try to say the other from memory.": "वही संरक्षण नियम, विपरीत दिशाओं में पढ़ा गया। एक कॉलम को ढकें और याददाश्त से दूसरा बताने का प्रयास करें।", "Retirement — someone leaves": "सेवानिवृत्ति — कोई जाता है", "the leaver gives up his whole share": "जाने वाला अपना पूरा हिस्सा छोड़ देता है", "their shares rise": "उनके हिस्से बढ़ते हैं", "Ratio used": "उपयोग किया गया अनुपात", "gaining ratio = new − old": "लाभ अनुपात = नया − पुराना", "the gainers pay the leaver": "लाभ पाने वाले जाने वाले को भुगतान करते हैं", "shared in the OLD ratio": "पुराने अनुपात में साझा किया गया", "Admission — someone joins": "प्रवेश — कोई जुड़ता है", "the newcomer takes a share": "नया आने वाला एक हिस्सा लेता है", "Existing partners": "मौजूदा भागीदार", "their shares fall": "उनके हिस्से गिरते हैं", "sacrificing ratio = old − new": "बलिदान अनुपात = पुराना − नया", "the newcomer pays the sacrificers": "नया आने वाला बलिदान करने वालों को भुगतान करता है", "Goodwill on admission points the other way": "प्रवेश पर सद्भावना दूसरी ओर इशारा करती है", "On retirement the gainers pay the leaver. On admission the newcomer pays the partners who gave up their share — and he pays them in their sacrificing ratio, because that is the proportion in which they made room for him.": "सेवानिवृत्ति पर लाभ पाने वाले जाने वाले को भुगतान करते हैं। प्रवेश पर नया आने वाला उन भागीदारों को भुगतान करता है जिन्होंने अपना हिस्सा छोड़ दिया — और वह उन्हें उनके बलिदान अनुपात में भुगतान करता है, क्योंकि यही वह अनुपात है जिसमें उन्होंने उसके लिए जगह बनाई।", "A and B share 3 : 2. C is admitted for 1/5, taking it from them in their old ratio. What is the sacrificing ratio?": "A और B का अनुपात 3 : 2 है। C को 1/5 के लिए शामिल किया जाता है, वह उनसे उनके पुराने अनुपात में लेता है। बलिदान अनुपात क्या है?", "They gave up 3/25 and 2/25 — the same 3 : 2 they already shared in, because the deed said nothing.": "उन्होंने 3/25 और 2/25 छोड़ दिया — वही 3 : 2 जो वे पहले से साझा करते थे, क्योंकि विलेख में कुछ नहीं कहा गया था।", "The third case — nobody joins, nobody leaves": "तीसरा मामला — कोई नहीं जुड़ता, कोई नहीं छोड़ता", "Admission added a partner. Retirement removed one. But the same law runs a third time when the firm simply re-cuts the cake: the same partners, the same ten parts, a different split. Somebody gains, somebody gives up.": "प्रवेश से एक साझेदार जुड़ता है। सेवानिवृत्ति से एक हट जाता है। लेकिन यही नियम तीसरी बार तब लागू होता है जब फर्म बस केक को फिर से बांटती है: वही साझेदार, वही दस हिस्से, लेकिन बंटवारा अलग होता है। किसी का फायदा होता है, तो कोई अपना हिस्सा छोड़ता है।", "Re-cut the ratio and watch who moves": "अनुपात को फिर से बांटें और देखें कि कौन आगे बढ़ता है", "s new share and watch A and C trade parts — while B stays exactly where he was. At one end C gains, at the other C gives.": "A, B और C के पास 5 : 3 : 2 है। C का नया हिस्सा देखें और देखें कि A और C के बीच हिस्से कैसे बदलते हैं — जबकि B बिल्कुल वहीं रहता है जहाँ वह था। एक तरफ C का फायदा होता है, तो दूसरी तरफ C अपना हिस्सा छोड़ता है।", "Gaining ratio = new − old. Sacrificing ratio = old − new. Only the sign tells you which.": "फायदा उठाने का अनुपात = नया − पुराना। त्यागने का अनुपात = पुराना − नया। केवल चिह्न ही बताता है कि कौन सा कौन सा है।", "Worked example — 5 : 3 : 2 becomes 2 : 3 : 5": "हल किया गया उदाहरण — 5 : 3 : 2 बन जाता है 2 : 3 : 5", "A, B and C agree to change their ratio from 5 : 3 : 2 to 2 : 3 : 5. Find who gains, who sacrifices, and by how much.": "A, B और C अपना अनुपात 5 : 3 : 2 से बदलकर 2 : 3 : 5 करने पर सहमत होते हैं। पता करें कि किसका फायदा होता है, कौन त्याग करता है, और कितना।", "Old shares: A 5/10, B 3/10, C 2/10.": "पुराने हिस्से: A 5/10, B 3/10, C 2/10.", "Ten parts in all, shared five, three and two.": "कुल दस हिस्से, जो पांच, तीन और दो में बांटे गए हैं।", "New shares: A 2/10, B 3/10, C 5/10.": "नए हिस्से: A 2/10, B 3/10, C 5/10.", "The same ten parts, cut differently.": "वही दस हिस्से, लेकिन अलग तरीके से बांटे गए।", "A goes from 5/10 to 2/10, so A sacrifices 3/10.": "A का हिस्सा 5/10 से घटकर 2/10 हो जाता है, इसलिए A 3/10 का त्याग करता है।", "Old minus new is positive, so he handed something over.": "पुराना माइनस नया धनात्मक है, इसलिए उसने अपना कुछ हिस्सा छोड़ दिया।", "B goes from 3/10 to 3/10 — no change.": "B का हिस्सा 3/10 ही रहता है — कोई बदलाव नहीं।", "His slice is the same size in both deals.": "दोनों ही मामलों में उसके हिस्से का आकार बिल्कुल समान है।", "C goes from 2/10 to 5/10, so C gains 3/10.": "C का हिस्सा 2/10 से बढ़कर 5/10 हो जाता है, इसलिए C को 3/10 का फायदा होता है।", "New minus old is positive, so he took more.": "नया माइनस पुराना धनात्मक है, इसलिए उसने अधिक हिस्सा लिया।", "What A gave is exactly what C took.": "A ने जो दिया, C ने बिल्कुल वही लिया।", "The ten parts never changed, so the losses must equal the gains.": "दस हिस्से कभी नहीं बदले, इसलिए नुकसान और फायदा बराबर होना चाहिए।", "Sacrificing ratio 3 (A alone); gaining ratio 3 (C alone).": "त्यागने का अनुपात 3 (केवल A); फायदा उठाने का अनुपात 3 (केवल C)।", "One partner on each side, so each carries the whole amount.": "दोनों तरफ एक-एक साझेदार है, इसलिए हर एक पूरी राशि का हिसाब रखता है।", "C compensates A for 3/10 of the goodwill.": "C, A को सद्भावना के 3/10 के बराबर मुआवजा देता है।", "Whoever gains always pays the one who gave up.": "जिसका भी फायदा होता है, वह हमेशा उस साझेदार को भुगतान करता है जिसने अपना हिस्सा छोड़ दिया।", "Three doors, one law": "तीन दरवाजे, एक ही नियम", "Every reconstitution in this subject is the same sentence read three ways.": "इस विषय में हर पुनर्गठन एक ही वाक्य को तीन अलग-अलग तरीकों से पढ़ने जैसा है।", "a newcomer takes a share; the existing partners sacrifice it, in old − new": "एक नया साझेदार हिस्सा लेता है; मौजूदा साझेदार पुराने − नए के आधार पर इसका त्याग करते हैं", "Retirement or death": "सेवानिवृत्ति या मृत्यु", "the leaver gives up everything; the survivors gain, in new − old": "जाने वाला साझेदार सब कुछ छोड़ देता है; बचे हुए साझेदारों को फायदा होता है, जो नए − पुराने के आधार पर होता है", "Change in ratio": "अनुपात में बदलाव", "the same partners re-cut; some gain, some sacrifice": "वही साझेदार फिर से बंटवारा करते हैं; कुछ को फायदा होता है, कुछ त्याग करते हैं", "The law itself": "नियम स्वयं", "whatever one loses, another takes — the parts always total 1": "जो एक खोता है, दूसरा वह लेता है — हिस्से हमेशा कुल 1 होते हैं", "the gainers pay the sacrificers, always": "फायदा उठाने वाले हमेशा त्याग करने वालों को भुगतान करते हैं", "Revaluation and reserves": "पुनर्मूल्यांकन और भंडार", "always shared in the OLD ratio, whoever is coming or going": "हमेशा पुराने अनुपात में बांटा जाता है, चाहे कोई आ रहा हो या जा रहा हो", "A, B and C share 5 : 3 : 2. They change to 2 : 3 : 5. Who gains, and by how much?": "A, B और C का अनुपात 5 : 3 : 2 है। वे इसे बदलकर 2 : 3 : 5 कर देते हैं। किसका फायदा होता है, और कितना?", "C goes from 2/10 to 5/10, a gain of 3/10 — exactly the 3/10 that A gives up.": "C का हिस्सा 2/10 से बढ़कर 5/10 हो जाता है, यानी 3/10 का फायदा — बिल्कुल वही 3/10 जो A छोड़ता है।", "A gains 3/10": "A को 3/10 का फायदा होता है", "C gains 3/10": "C को 3/10 का फायदा होता है", "B gains 3/10": "B को 3/10 का फायदा होता है", "When the existing partners change their profit sharing ratio, it is called ______.": "जब मौजूदा साझेदार अपने मुनाफे के बंटवारे का अनुपात बदलते हैं, तो इसे ______ कहते हैं।", "admission of a partner": "साझेदार का प्रवेश", "Admission brings in a new person; here nobody joins.": "प्रवेश से एक नया व्यक्ति आता है; यहाँ कोई शामिल नहीं होता।", "reconstitution of the firm": "फर्म का पुनर्गठन", "dissolution of the firm": "फर्म का विघटन", "Dissolution ends the firm; here it continues.": "विघटन से फर्म खत्म हो जाती है; यहाँ यह जारी रहती है।", "Amalgamation joins two firms.": "समामेलन में दो फर्में आपस में जुड़ जाती हैं।", "Any change in the agreement — including a new ratio among the same partners — reconstitutes the firm.": "समझौते में कोई भी बदलाव — जिसमें उन्हीं साझेदारों के बीच नया अनुपात शामिल है — फर्म का पुनर्गठन करता है।", "Sacrificing ratio is calculated as ______.": "बलिदान अनुपात की गणना ______ के रूप में की जाती है।", "That gives the gaining ratio.": "इससे लाभ अनुपात मिलता है।", "Adding shares does not measure sacrifice.": "शेयरों को जोड़ने से बलिदान नहीं मापा जाता।", "Sacrificing ratio = old share − new share. A positive answer means that partner gave something up.": "बलिदान अनुपात = पुराना शेयर − नया शेयर। सकारात्मक उत्तर का मतलब है कि साझेदार ने कुछ त्याग दिया है।", "Division does not measure gain.": "विभाजन से लाभ नहीं मापा जाता।", "Gaining ratio = new share − old share. A positive answer means that partner took more.": "लाभ अनुपात = नया शेयर − पुराना शेयर। सकारात्मक उत्तर का मतलब है कि साझेदार ने अधिक लिया है।", "A and B share 3 : 2. They change to 2 : 3. Who sacrifices, and by how much?": "A और B का हिस्सा 3 : 2 है। वे इसे 2 : 3 में बदल देते हैं। कौन बलिदान करता है, और कितना?", "A sacrifices 1/5": "A बलिदान करता है 1/5", "B sacrifices 1/5": "B बलिदान करता है 1/5", "s share rose, so B gained.": "B का हिस्सा बढ़ा, इसलिए B को लाभ हुआ।", "Both sacrifice equally": "दोनों समान रूप से बलिदान करते हैं", "s share fell.": "केवल A का हिस्सा गिरा।", "Neither sacrifices": "कोई भी बलिदान नहीं करता", "The shares clearly changed.": "हिस्से साफ तौर पर बदल गए हैं।", "A goes 3/5 → 2/5, a sacrifice of 1/5. B goes 2/5 → 3/5, a gain of 1/5.": "A का हिस्सा 3/5 → 2/5 हो जाता है, जो 1/5 का बलिदान है। B का हिस्सा 2/5 → 3/5 हो जाता है, जो 1/5 का लाभ है।", "A, B and C share 5 : 3 : 2 and change to 2 : 3 : 5. Who gains, and by how much?": "A, B और C का हिस्सा 5 : 3 : 2 है और वे इसे 2 : 3 : 5 में बदल देते हैं। किसे लाभ होता है, और कितना?", "s share fell from 5/10 to 2/10, so A sacrificed.": "A का हिस्सा 5/10 से गिरकर 2/10 हो गया, इसलिए A ने बलिदान किया।", "B stayed at 3/10 throughout.": "B पूरे समय 3/10 पर ही रहा।", "Nobody gains": "किसी को लाभ नहीं होता", "A lost 3/10, so someone must have gained it.": "A ने 3/10 खो दिया, इसलिए किसी न किसी को यह लाभ मिला ही होगा।", "C goes 2/10 → 5/10, a gain of 3/10 — exactly the 3/10 A gives up.": "C का हिस्सा 2/10 → 5/10 हो जाता है, जो 3/10 का लाभ है — ठीक उतना ही 3/10 जितना A छोड़ता है।", "In a change of profit sharing ratio, the total of the sacrifices must ______ the total of the gains.": "मुनाफे के बंटवारे के अनुपात में बदलाव होने पर, बलिदानों का कुल योग लाभों के कुल योग के ______ होना चाहिए।", "The parts cannot exceed the whole.": "हिस्से पूरे से अधिक नहीं हो सकते।", "They cannot fall short either.": "वे कम भी नहीं पड़ सकते।", "be unrelated to": "उससे असंबद्ध", "They are two sides of one transfer.": "ये एक ही ट्रांसफर के दो पहलू हैं।", "The shares must still add to 1, so whatever one partner loses another must take.": "शेयरों का योग अभी भी 1 होना चाहिए, इसलिए जो एक साझेदार खोता है, दूसरा उसे हासिल कर लेता है।", "On a change in profit sharing ratio, goodwill is adjusted by ______.": "मुनाफे के बंटवारे के अनुपात में बदलाव होने पर, सद्भावना को ______ द्वारा एडजस्ट किया जाता है।", "debiting the sacrificing partners and crediting the gaining partners": "बलिदान करने वाले साझेदारों को डेबिट करके और लाभ पाने वाले साझेदारों को क्रेडिट करके", "That reverses the compensation.": "यह मुआवजे को उलट देता है।", "debiting the gaining partners and crediting the sacrificing partners": "लाभ पाने वाले साझेदारों को डेबिट करके और बलिदान करने वाले साझेदारों को क्रेडिट करके", "writing it off against all partners equally": "इसे सभी साझेदारों के खिलाफ समान रूप से राइट ऑफ करके", "Equal write-off ignores who actually moved.": "समान राइट-ऑफ इस बात को नजरअंदाज करता है कि वास्तव में किसने बदलाव किया है।", "ignoring it": "इसे नजरअंदाज करके", "Goodwill must be adjusted, not ignored.": "सद्भावना को एडजस्ट किया जाना चाहिए, नजरअंदाज नहीं।", "Whoever gains must pay whoever gave up — so the gainers are debited and the sacrificers credited.": "जो लाभ पाता है, उसे वह देना चाहिए जिसने त्याग दिया — इसलिए लाभ पाने वालों को डेबिट किया जाता है और बलिदान करने वालों को क्रेडिट किया जाता है।", "Goodwill is valued at ₹60,000. A sacrifices 1/5 of his share. The amount credited to A is ______.": "सद्भावना का मूल्य ₹60,000 है। A अपने हिस्से का 1/5 बलिदान करता है। A को क्रेडिट की जाने वाली राशि ______ है।", "That is the remaining four-fifths.": "वह शेष चार-पांचवां हिस्सा है।", "That is a half, not a fifth.": "वह आधा है, पांचवां नहीं।", "A is credited with his sacrifice only: 60,000 × 1/5 = ₹12,000.": "A को केवल उसके बलिदान के लिए क्रेडिट किया जाता है: 60,000 × 1/5 = ₹12,000।", "s share of the adjustment is ______.": "X और Y का हिस्सा 2 : 1 है। वे इसे 1 : 1 में बदल देते हैं। सद्भावना ₹90,000 है। Y के एडजस्टमेंट का हिस्सा ______ है।", "₹15,000 paid to X": "X को दिया गया ₹15,000", "₹30,000 paid to X": "X को दिया गया ₹30,000", "That treats the whole one-third as gained.": "यह पूरे एक-तिहाई हिस्से को लाभ मानता है।", "₹45,000 paid to X": "X को दिया गया ₹45,000", "That is a half, not the gain.": "यह आधा है, लाभ नहीं।", "Y clearly gained, so Y must pay.": "Y को फायदा हुआ है, इसलिए Y को भुगतान करना होगा।", "X: 2/3 → 1/2 sacrifices 1/6. Y: 1/3 → 1/2 gains 1/6. So Y pays X 90,000 × 1/6 = ₹15,000.": "X: 2/3 → 1/2, 1/6 का त्याग करता है। Y: 1/3 → 1/2, 1/6 का लाभ प्राप्त करता है। इसलिए Y, X को 90,000 × 1/6 = ₹15,000 का भुगतान करेगा।", "On a change in profit sharing ratio, accumulated reserves are distributed among the partners in ______.": "लाभ साझाकरण अनुपात में बदलाव होने पर, संचित भंडार भागीदारों के बीच ______ में वितरित किए जाते हैं।", "the new ratio": "नए अनुपात में", "The new ratio has no claim on past profits.": "नए अनुपात का पिछले मुनाफे पर कोई दावा नहीं होता।", "the old ratio": "पुराने अनुपात में", "The gaining ratio applies to goodwill, not reserves.": "लाभ अनुपात सद्भावना पर लागू होता है, भंडार पर नहीं।", "equal shares": "समान शेयरों में", "Equal shares ignore the old ratio.": "समान शेयर पुराने अनुपात को नज़रअंदाज़ करते हैं।", "The reserves were built under the old arrangement, so they follow the old ratio.": "भंडार पुराने समझौते के तहत बनाए गए थे, इसलिए वे पुराने अनुपात के अनुसार ही बँटे जाते हैं।", "A revaluation loss on change of profit sharing ratio is borne by the partners in ______.": "लाभ साझाकरण अनुपात में बदलाव पर होने वाले पुनर्मूल्यांकन नुकसान को भागीदार ______ में वहन करते हैं।", "The new ratio did not exist when the loss arose.": "नया अनुपात तब मौजूद नहीं था जब नुकसान हुआ था।", "The gaining ratio is for goodwill.": "लाभ अनुपात सद्भावना के लिए होता है।", "the sacrificing ratio": "त्याग अनुपात में", "The sacrificing ratio is for goodwill too.": "त्याग अनुपात भी सद्भावना के लिए ही होता है।", "The loss arose while the old ratio applied, so it is shared in the old ratio.": "नुकसान तब हुआ जब पुराना अनुपात लागू था, इसलिए इसे पुराने अनुपात में ही साझा किया जाता है।", "s capital is more than his due share, he will ______.": "अनुपात में बदलाव के बाद, यदि किसी भागीदार की पूंजी उसके हिस्से से अधिक है, तो वह ______ करेगा।", "Bringing in cash is for a deficit, not a surplus.": "नकद लाना घाटे के लिए होता है, सरप्लस के लिए नहीं।", "withdraw the excess": "अतिरिक्त राशि निकालेगा", "transfer it to goodwill": "इसे सद्भावना में ट्रांसफर करेगा", "Goodwill is a separate adjustment.": "सद्भावना एक अलग एडजस्टमेंट है।", "Ignoring it leaves the capitals misaligned.": "इसे नज़रअंदाज़ करने से पूंजी का संतुलन बिगड़ जाता है।", "Capitals are usually realigned to the new ratio — a surplus is withdrawn, a deficit is brought in.": "पूंजी को आमतौर पर नए अनुपात में फिर से अलाइन किया जाता है — सरप्लस निकाला जाता है, और घाटे के लिए नकद लाया जाता है।", "Explain the accounting treatment of goodwill when the existing partners change their profit sharing ratio.": "मौजूदा भागीदारों द्वारा अपना लाभ साझाकरण अनुपात बदलने पर सद्भावना की अकाउंटिंग ट्रीटमेंट समझाइए।", "Start with what has happened.": "जो हुआ है, उससे शुरुआत करें।", "Some partners have gained and some have sacrificed.": "कुछ भागीदारों को फायदा हुआ है और कुछ ने त्याग किया है।", "Value the goodwill by any accepted method.": "किसी भी स्वीकृत विधि से सद्भावना का मूल्यांकन करें।", "Debit the gaining partners in their gaining ratio.": "लाभ प्राप्त करने वाले भागीदारों को उनके लाभ अनुपात में डेबिट करें।", "Credit the sacrificing partners in their sacrificing ratio.": "त्याग करने वाले भागीदारों को उनके त्याग अनुपात में क्रेडिट करें।", "Answer: the gainers are debited and the sacrificers credited, so the gainers compensate the sacrificers.": "उत्तर: लाभ पाने वालों को डेबिट किया जाता है और त्याग करने वालों को क्रेडिट किया जाता है, इसलिए लाभ पाने वाले त्याग करने वालों को मुआवजा देते हैं।", "What adjustments are needed when partners change their profit sharing ratio?": "जब भागीदार अपना लाभ साझाकरण अनुपात बदलते हैं तो कौन-से एडजस्टमेंट की आवश्यकता होती है?", "List each adjustment in order.": "प्रत्येक एडजस्टमेंट को क्रम में सूचीबद्ध करें।", "Revalue the assets and liabilities; share the gain or loss in the old ratio.": "संपत्तियों और देनदारियों का पुनर्मूल्यांकन करें; लाभ या हानि को पुराने अनुपात में साझा करें।", "Distribute reserves and accumulated profits or losses in the old ratio.": "भंडार और संचित लाभ या हानि को पुराने अनुपात में वितरित करें।", "Adjust goodwill — debit the gainers, credit the sacrificers.": "सद्भावना को एडजस्ट करें — लाभ पाने वालों को डेबिट करें, त्याग करने वालों को क्रेडिट करें।", "Realign the capitals to the new ratio by bringing in or withdrawing cash.": "नकद लाकर या निकालकर पूंजी को नए अनुपात में फिर से अलाइन करें।", "Answer: revaluation, reserves, goodwill, and adjustment of capitals.": "उत्तर: पुनर्मूल्यांकन, भंडार, सद्भावना, और पूंजी का एडजस्टमेंट।", "A and B share 3 : 2. They agree to change to 1 : 1. Goodwill is valued at ₹80,000. Pass the adjustment.": "A और B का हिस्सा 3 : 2 है। वे इसे 1 : 1 में बदलने के लिए सहमत होते हैं। सद्भावना का मूल्य ₹80,000 है। एडजस्टमेंट पास करें।", "s old and new share.": "प्रत्येक भागीदार का पुराना और नया हिस्सा निकालें।", "A: old 3/5, new 1/2, so A sacrifices 3/5 − 1/2 = 1/10.": "A: पुराना 3/5, नया 1/2, इसलिए A 3/5 − 1/2 = 1/10 का त्याग करता है।", "B: old 2/5, new 1/2, so B gains 1/2 − 2/5 = 1/10.": "B: पुराना 2/5, नया 1/2, इसलिए B 1/2 − 2/5 = 1/10 का लाभ प्राप्त करता है।", "The sacrifice equals the gain, which confirms the working.": "त्याग लाभ के बराबर है, जो इस कैलकुलेशन के सही होने की पुष्टि करता है।", "B is debited with 80,000 × 1/10 = ₹8,000; A is credited with the same ₹8,000.": "B को 80,000 × 1/10 = ₹8,000 डेबिट किया जाता है; A को उतना ही ₹8,000 क्रेडिट किया जाता है।", "Answer: debit B ₹8,000, credit A ₹8,000.": "उत्तर: B को ₹8,000 डेबिट करें, A को ₹8,000 क्रेडिट करें।", "P, Q and R share 4 : 3 : 2. They change to 2 : 3 : 4. Find the sacrificing and gaining ratios.": "P, Q और R का हिस्सा 4 : 3 : 2 है। वे इसे 2 : 3 : 4 में बदलते हैं। त्याग और लाभ अनुपात निकालें।", "Write the old shares over 9: P 4/9, Q 3/9, R 2/9.": "पुराने शेयरों को 9 के हर पर लिखें: P 4/9, Q 3/9, R 2/9.", "Write the new shares over 9: P 2/9, Q 3/9, R 4/9.": "नए शेयरों को 9 के हर पर लिखें: P 2/9, Q 3/9, R 4/9.", "P: 4/9 − 2/9 = 2/9 sacrificed.": "P: 4/9 − 2/9 = 2/9 का त्याग किया।", "Q: 3/9 − 3/9 = nil.": "Q: 3/9 − 3/9 = शून्य।", "R: 4/9 − 2/9 = 2/9 gained.": "R: 4/9 − 2/9 = 2/9 का लाभ हुआ।", "Answer: sacrificing ratio 2 (P alone); gaining ratio 2 (R alone).": "उत्तर: त्याग अनुपात 2 (केवल P); लाभ अनुपात 2 (केवल R)।", "A and B share 2 : 1. They change to 3 : 2. Goodwill is ₹1,50,000. Show the adjustment.": "A और B का हिस्सा 2 : 1 है। वे इसे 3 : 2 में बदलते हैं। सद्भावना ₹1,50,000 है। एडजस्टमेंट दिखाएं।", "Old shares: A 2/3, B 1/3.": "पुराने शेयर: A 2/3, B 1/3.", "New shares: A 3/5, B 2/5.": "नए शेयर: A 3/5, B 2/5.", "A: 2/3 − 3/5 = 10/15 − 9/15 = 1/15 sacrificed.": "A: 2/3 − 3/5 = 10/15 − 9/15 = 1/15 का त्याग किया।", "B: 2/5 − 1/3 = 6/15 − 5/15 = 1/15 gained.": "B: 2/5 − 1/3 = 6/15 − 5/15 = 1/15 का लाभ हुआ।", "B is debited 1,50,000 × 1/15 = ₹10,000; A is credited ₹10,000.": "B को 1,50,000 × 1/15 = ₹10,000 डेबिट किया जाता है; A को ₹10,000 क्रेडिट किया जाता है।", "Answer: debit B ₹10,000, credit A ₹10,000.": "उत्तर: B को ₹10,000 डेबिट करें, A को ₹10,000 क्रेडिट करें।", "The master method — one procedure for every question": "मास्टर मेथड — हर सवाल के लिए एक प्रक्रिया", "Every reconstitution question, however it is dressed up, runs the same seven steps. Learn the order and you will not be lost even when the wording is unfamiliar.": "हर पुनर्निर्माण सवाल, चाहे उसे कितना भी घुमा-फिराकर क्यों न पूछा गया हो, उसी सात चरणों में चलता है। क्रम सीख लें और जब शब्द भी नए लगें तब भी आप नहीं भटकेंगे।", "The seven steps, and why each one exists": "सात चरण, और हर एक के होने का कारण", "Use this order every time. Do not skip step 3 — it is the one that catches the mistake.": "हर बार इसी क्रम का उपयोग करें। चरण 3 को न छोड़ें — यही वह चरण है जो गलती पकड़ता है।", "Ask what actually changed: someone joined, someone left, or the same partners re-cut.": "पूछें कि वास्तव में क्या बदला: कोई भागीदार आया, कोई गया, या उन्हीं हिस्सेदारों ने फिर से बंटवारा किया।", "The type decides which ratio formula you use.": "प्रकार यह तय करता है कि आप कौन सा अनुपात फॉर्मूला इस्तेमाल करेंगे।", "s NEW share, over a common denominator.": "हर भागीदार का पुराना हिस्सा और नया हिस्सा एक सामान्य हर के ऊपर लिखें।", "You cannot subtract fifths from thirds. A common denominator is what makes the arithmetic possible.": "आप तिहाई में से पांचवां हिस्सा नहीं घटा सकते। एक सामान्य हर ही अंकगणित को संभव बनाता है।", "Subtract: new − old. Positive is a gain, negative is a sacrifice.": "घटाएं: नया − पुराना। धनात्मक लाभ है, ऋणात्मक त्याग है।", "at the same time.": "यह एक घटाव एक ही समय में", "Check the deltas add to zero.": "जांचें कि डेल्टा का योग शून्य होता है।", "The parts must still total 1. If they do not add to zero, your shares or your denominator are wrong — stop and fix it before going on.": "कुल योग अभी भी 1 होना चाहिए। यदि उनका योग शून्य नहीं होता है, तो आपके हिस्से या आपका हर गलत है — आगे बढ़ने से पहले रुकें और इसे ठीक करें।", "Value the goodwill, then debit the gainers and credit the sacrificers in proportion to their deltas.": "सद्भावना का मूल्य निर्धारित करें, फिर लाभ पाने वालों को डेबिट करें और त्याग करने वालों को उनके डेल्टा के अनुपात में क्रेडिट करें।", "Whoever gained must pay whoever gave up. The deltas ARE the ratio to use.": "जिसने लाभ उठाया है उसे भुगतान करना होगा जिसने छोड़ दिया है। डेल्टा ही वह अनुपात है जिसका उपयोग करना है।", "Share revaluation, reserves and accumulated losses in the OLD ratio.": "पुराने अनुपात में शेयर पुनर्मूल्यांकन, रिज़र्व और संचित घाटे का बंटवारा करें।", "All of these arose while the old arrangement was in force, so the old ratio owns them.": "ये सभी तब उत्पन्न हुए जब पुरानी व्यवस्था लागू थी, इसलिए पुराने अनुपात का ही अधिकार है।", "Realign the capitals to the new ratio — deficit brought in, surplus withdrawn.": "नए अनुपात के अनुसार पूंजी को फिर से संरेखित करें — घाटा लाया गया, सरप्लस निकाला गया।", "Only the capitals follow the new ratio. Everything above followed the old one.": "केवल पूंजी नए अनुपात का पालन करती है। ऊपर की हर चीज़ ने पुराने अनुपात का पालन किया।", "The zero-sum checker — try to break it": "शून्य-योग जांचकर्ता — इसे तोड़ने का प्रयास करें", "Set any three new shares you like. The checker tells you at once whether the parts still total 10, and whether the gains cancel the sacrifices. Try making A 7, B 3 and C 2 and see what it says.": "कोई भी तीन नए हिस्से सेट करें जो आपको पसंद हों। जांचकर्ता आपको तुरंत बता देता है कि क्या कुल योग अभी भी 10 है, और क्या लाभ और त्याग एक-दूसरे को रद्द करते हैं। A को 7, B को 3 और C को 2 बनाने का प्रयास करें और देखें कि यह क्या कहता है।", "If the deltas do not add to zero, the question is impossible — which means you have misread a figure, not that the answer is odd.": "यदि डेल्टा का योग शून्य नहीं होता है, तो प्रश्न असंभव है — जिसका अर्थ है कि आपने कोई अंक गलत पढ़ा है, न कि यह कि उत्तर अजीब है।", "Six traps the board actually sets": "छह जाल जो बोर्ड वास्तव में बिछाता है", "Each of these changes the answer, and each appears in real papers.": "इनमें से हर एक उत्तर को बदल देता है, और हर एक असली पेपर में दिखाई देता है।", "New ratio not given on admission": "प्रवेश पर नया अनुपात नहीं दी गई", "s share is acquired in the OLD ratio. On retirement, assume the survivors continue in their OLD ratio among themselves — the two assumptions are not the same.": "मान लें कि नए भागीदार का हिस्सा पुराने अनुपात में प्राप्त किया गया है। सेवानिवृत्ति पर, मान लें कि बचे हुए भागीदार आपस में अपने पुराने अनुपात में ही जारी रहते हैं — ये दोनों मान्यताएं एक जैसी नहीं हैं।", "A debit balance in P&L": "P&L में डेबिट बैलेंस", "That is an accumulated LOSS. Distribute it in the old ratio and DEDUCT from capitals — do not add it.": "वह एक संचित घाटा है। इसे पुराने अनुपात में वितरित करें और पूंजी से घटाएं — इसे जोड़ें नहीं।", "Goodwill already in the books": "सद्भावना पहले से ही बहीखातों में है", "Write it off among ALL partners in the old ratio FIRST, then adjust the fresh goodwill. Doing it in the other order gives a different answer.": "सबसे पहले सभी भागीदारों के बीच पुराने अनुपात में इसे राइट ऑफ करें, फिर ताज़ा सद्भावना को समायोजित करें। दूसरे क्रम में ऐसा करने से अलग उत्तर मिलता है।", "One partner both gains and sacrifices": "एक भागीदार लाभ भी उठाता है और त्याग भी करता है", "Impossible in a two-partner firm, possible with three or more. Never assume the gainers are only the newcomers.": "दो-भागीदार फर्म में असंभव, तीन या अधिक के साथ संभव। कभी भी यह न मान लें कि केवल नए आने वालों को ही लाभ हुआ है।", "If the amount paid exceeds capital + reserves + revaluation share, the excess IS the goodwill. Work it backwards.": "यदि भुगतान की गई राशि पूंजी + रिज़र्व + पुनर्मूल्यांकन हिस्से से अधिक है, तो अधिकता ही सद्भावना है। इसे उल्टा हल करें।", "Reserve with a condition": "शर्त के साथ रिज़र्व", "A workmen compensation reserve is credited to capital only for the excess over the actual claim; the claim itself is a liability.": "वर्कमैन कंपनसेशन रिज़र्व को केवल वास्तविक दावे से अधिक अतिरिक्त राशि के लिए ही पूंजी में क्रेडिट किया जाता है; दावा स्वयं एक देनदारी है।", "Tricky case — working hidden goodwill backwards": "पेचीदा मामला — छिपी हुई सद्भावना को उल्टा हल करना", "s capital after all adjustments is ₹80,000. He is paid ₹95,000. His share is 1/4. What is the goodwill of the firm?": "सभी समायोजनों के बाद एक सेवानिवृत्त भागीदार की पूंजी ₹80,000 है। उसे ₹95,000 का भुगतान किया जाता है। उसका हिस्सा 1/4 है। फर्म की सद्भावना क्या है?", "The excess actually paid over what he is owed is ₹95,000 − ₹80,000 = ₹15,000.": "उसे जो देय है उससे अधिक वास्तव में भुगतान की गई अतिरिक्त राशि ₹95,000 − ₹80,000 = ₹15,000 है।", "He cannot be paid more than his due unless something extra is being bought.": "उसे उसके देय से अधिक भुगतान नहीं किया जा सकता जब तक कि कुछ अतिरिक्त न खरीदा जा रहा हो।", "That ₹15,000 must be his share of the goodwill.": "वह ₹15,000 सद्भावना में उसका हिस्सा होना चाहिए।", "The only thing left to explain the extra money is goodwill.": "अतिरिक्त पैसे को समझाने के लिए केवल सद्भावना ही बची है।", "If 1/4 of the goodwill is ₹15,000, then the whole is ₹15,000 × 4.": "यदि सद्भावना का 1/4 हिस्सा ₹15,000 है, तो पूरा हिस्सा ₹15,000 × 4 होगा।", "Scale his share back up to the whole.": "उसके हिस्से को वापस पूरे हिस्से तक बढ़ाएं।", "Goodwill of the firm = ₹60,000.": "फर्म की सद्भावना = ₹60,000।", "Now you can pass the normal goodwill entries with a real figure.": "अब आप एक वास्तविक आंकड़े के साथ सामान्य सद्भावना प्रविष्टियां कर सकते हैं।", "His share ₹15,000 is credited to him; the gainers are debited in their gaining ratio.": "उसका हिस्सा ₹15,000 उसे क्रेडिट किया जाता है; लाभ पाने वालों को उनके लाभ अनुपात में डेबिट किया जाता है।", "The treatment is exactly the same as before — only the valuation was hidden.": "इसका उपचार बिल्कुल पहले जैसा ही है — केवल मूल्यांकन छिपा हुआ था।", "A, B and C share 5 : 3 : 2. After a change, their new shares are 7 : 3 : 2. What is wrong with this?": "A, B और C का हिस्सा 5 : 3 : 2 है। बदलाव के बाद, उनके नए हिस्से 7 : 3 : 2 हैं। इसमें क्या गलत है?", "7 + 3 + 2 = 12, not 10. The parts must always total the whole, so this ratio cannot exist — the question is testing whether you check.": "7 + 3 + 2 = 12, 10 नहीं। कुल योग हमेशा पूरे हिस्से के बराबर होना चाहिए, इसलिए यह अनुपात मौजूद नहीं हो सकता — प्रश्न यह परीक्षण कर रहा है कि क्या आप जांच करते हैं।", "Nothing — the shares add to 12": "कुछ नहीं — हिस्से का योग 12 होता है", "The shares must still total 10, so this ratio is impossible": "कुल योग अभी भी 10 होना चाहिए, इसलिए यह अनुपात असंभव है", "C must sacrifice 2/10": "C को 2/10 का त्याग करना होगा", "What the newcomer actually pays for": "नया साझेदार असल में किस चीज़ का भुगतान करता है", "On admission the new partner brings two separate things: capital for his share of the assets, and a premium for goodwill. The premium is not kept by the firm — it is handed to the partners who gave up part of their share, in their sacrificing ratio.": "प्रवेश पर नया साझेदार दो अलग-अलग चीज़ें लाता है: संपत्तियों में अपने हिस्से के लिए पूंजी, और सद्भावना के लिए प्रीमियम। प्रीमियम फर्म के पास नहीं रहता — यह उन साझेदारों को दिया जाता है जिन्होंने अपने हिस्से का कुछ भाग छोड़ा, और उनके त्याग अनुपात में दिया जाता है।", "Worked example — C pays for goodwill": "हल किया गया उदाहरण — C सद्भावना का भुगतान करता है", "A and B share 3 : 2. C is admitted for 1/5 of the firm. Goodwill is valued at ₹50,000 and C brings his share of it in cash. Show who receives what.": "A और B का हिस्सा 3 : 2 है। C को फर्म के 1/5 हिस्से के लिए शामिल किया जाता है। सद्भावना का मूल्य ₹50,000 है और C उसका अपना हिस्सा नकद में लाता है। दिखाएं कि किसे क्या मिलता है।", "s share of the goodwill = 1/5 × ₹50,000 = ₹10,000.": "C का सद्भावना में हिस्सा = 1/5 × ₹50,000 = ₹10,000.", "He pays only for the part of the firm he is buying into.": "वह केवल उसी हिस्से का भुगतान करता है जितना फर्म में वह खरीद रहा है।", "The deed is silent, so A and B sacrifice in their old ratio 3 : 2.": "विलेख में कुछ नहीं कहा गया, इसलिए A और B अपने पुराने अनुपात 3 : 2 में त्याग करते हैं।", "Silence is read as acquisition in the old ratio.": "चुप्पी को पुराने अनुपात में अधिग्रहण के रूप में पढ़ा जाता है।", "s sacrifice = 10,000 × 3/5 = ₹6,000.": "A का त्याग = 10,000 × 3/5 = ₹6,000.", "He gave up three parts of every five.": "उसने हर पांच में से तीन हिस्से छोड़े।", "s sacrifice = 10,000 × 2/5 = ₹4,000.": "B का त्याग = 10,000 × 2/5 = ₹4,000.", "He gave up two parts of every five.": "उसने हर पांच में से दो हिस्से छोड़े।", "C brings ₹10,000 in cash; A is credited ₹6,000 and B ₹4,000.": "C नकद में ₹10,000 लाता है; A को ₹6,000 और B को ₹4,000 क्रेडिट किया जाता है।", "The premium does not stay with the firm — it goes to the partners who made room for him.": "प्रीमियम फर्म के पास नहीं रुकता — यह उन साझेदारों को जाता है जिन्होंने उसके लिए जगह बनाई।", "Check: 6,000 + 4,000 = 10,000, exactly what C paid.": "जांचें: 6,000 + 4,000 = 10,000, बिल्कुल वही जो C ने दिया।", "Nothing is lost in the transfer, which confirms the sacrificing ratio.": "स्थानांतरण में कुछ भी नहीं खोता, जो त्याग अनुपात की पुष्टि करता है।", "Revaluation on admission is the same as on retirement": "प्रवेश पर पुनर्मूल्यांकन सेवानिवृत्ति जैसा ही होता है", "Assets are revalued and liabilities reassessed before the newcomer is admitted, so that he neither gains nor loses from a change that happened before he arrived. The net gain or loss goes to the OLD partners only, in the old ratio.": "नए साझेदार के प्रवेश से पहले संपत्तियों का पुनर्मूल्यांकन और देनदारियों का पुनर्मूल्यांकन किया जाता है, ताकि उसे उस बदलाव से न लाभ हो न हानि जो उसके आने से पहले हुआ था। शुद्ध लाभ या हानि केवल पुराने साझेदारों को, पुराने अनुपात में जाती है।", "A and B share 3 : 2. C is admitted for 1/5. Goodwill is ₹50,000 and C brings his share in cash. How much does A receive?": "A और B का हिस्सा 3 : 2 है। C को 1/5 के लिए शामिल किया जाता है। सद्भावना ₹50,000 है और C अपना हिस्सा नकद में लाता है। A को कितना मिलता है?", "s sacrifice is 3/5 of that = ₹6,000; B takes the remaining ₹4,000.": "C अपने 1/5 के लिए ₹10,000 देता है। A का त्याग उसका 3/5 = ₹6,000 है; B शेष ₹4,000 लेता है।", "One firm, three events": "एक फर्म, तीन घटनाएँ", "Accountancy · Class 12 · Partnership reconstitution": "अकाउंटेंसी · कक्षा 12 · साझेदारी का पुनर्गठन", "s goodwill is valued at ₹1,00,000. Three things can now happen to them — and every one of them is the same idea.": "आशा, बीना और चेतन एक फर्म चलाते हैं। वे मुनाफ़ा 5 : 3 : 2 के अनुपात में बाँटते हैं और उनके पास क्रमशः ₹5,00,000, ₹3,00,000 और ₹2,00,000 की पूंजी है। फर्म की गुडविल का मूल्य ₹1,00,000 है। अब उनके साथ तीन में से कोई एक बात हो सकती है — और हर एक का मूल विचार एक ही है।", "The one idea you must hold on to": "वह एक विचार जिसे आपको हमेशा याद रखना चाहिए", "So every question is three lines": "इसलिए हर सवाल तीन लाइनों का है", "s new share over the same denominator. Subtract. A positive answer means he gained; a negative answer means he gave up. Everything else in this chapter is built on that one subtraction.": "हर पार्टनर का पुराना हिस्सा लिखें। हर पार्टनर का नया हिस्सा उसी हर पर लिखें। घटाएँ। अगर जवाब पॉज़िटिव है तो उसका फायदा हुआ है; अगर नेगेटिव है तो उसने हिस्सा छोड़ा है। इस अध्याय में बाकी सब कुछ इसी एक घटाव पर टिका है।", "The method, in seven steps": "यह तरीका, सात चरणों में", "Use this order every time. Step 4 is the one that saves you.": "हर बार इसी क्रम का पालन करें। चरण 4 ही आपको बचाता है।", "Say what changed — someone joined, someone left, or the same partners re-cut.": "बताइए कि क्या बदला — कोई शामिल हुआ, कोई गया, या उसी पार्टनर ने फिर से बँटवारा किया।", "That tells you which direction the subtraction runs.": "इससे पता चलता है कि घटाव किस दिशा में होगा।", "Write old shares and new shares over one common denominator.": "पुराने और नए हिस्से एक समान हर पर लिखें।", "You cannot subtract fifths from tenths until they speak the same language.": "आप पाँचवें हिस्से में से दसवाँ हिस्सा तब तक नहीं घटा सकते जब तक वे एक ही भाषा में न हों।", "Subtract: new minus old.": "घटाएँ: नया में से पुराना।", "One subtraction gives you both the gainers and the sacrificers.": "एक घटाव से आपको फायदा उठाने वाले और हिस्सा छोड़ने वाले दोनों मिल जाते हैं।", "Add up the differences. They must come to zero.": "अंतरों को जोड़ें। उनका जोड़ शून्य होना चाहिए।", "If they do not, your shares or your denominator are wrong. Stop and fix it.": "अगर ऐसा नहीं होता, तो आपके हिस्से या हर गलत हैं। रुकें और उन्हें ठीक करें।", "Value the goodwill. Debit the gainers, credit the sacrificers, in proportion to those differences.": "गुडविल का मूल्य निकालें। फायदा उठाने वालों के खाते में डेबिट करें और हिस्सा छोड़ने वालों के खाते में क्रेडिट करें, उन अंतरों के अनुपात में।", "The differences themselves are the ratio you need.": "वे अंतर ही वह अनुपात हैं जिसकी आपको ज़रूरत है।", "They arose while the old arrangement stood, so the old ratio owns them.": "वे तब बने थे जब पुरानी व्यवस्था लागू थी, इसलिए पुराना अनुपात ही उनका मालिक है।", "Bring the capitals in line with the new ratio.": "पूँजी को नए अनुपात के हिसाब से लाएँ।", "Only capital follows the new ratio. Everything above follows the old one.": "केवल पूँजी नए अनुपात का पालन करती है। ऊपर की हर चीज़ पुराने अनुपात का पालन करती है।", "Event one — they re-cut the ratio": "घटना एक — उन्होंने फिर से अनुपात बाँटा", "Same three partners, same firm. They simply agree to change 5 : 3 : 2 into 2 : 3 : 5. Nobody joins, nobody leaves. Watch what has to happen for that to be possible.": "वही तीन पार्टनर, वही फर्म। वे बस 5 : 3 : 2 को 2 : 3 : 5 में बदलने पर सहमत हो जाते हैं। कोई शामिल नहीं होता, कोई नहीं जाता। देखिए कि ऐसा होने के लिए क्या होना चाहिए।", "Re-cut it and watch who moves": "फिर से बँटवारा करें और देखें कि कौन बदलता है", "s share and watch him trade parts with Asha, while Bina does not move at all.": "आशा, बीना और चेतन के पास 5 : 3 : 2 है। चेतन के हिस्से को खिसकाएँ और देखें कि वह आशा के साथ हिस्से बदल रहा है, जबकि बीना बिल्कुल नहीं बदलती।", "At one end Chetan gains. At the other he gives up. Same control, opposite directions.": "एक तरफ चेतन को फायदा होता है। दूसरी तरफ वह हिस्सा छोड़ता है। एक ही कंट्रोल, उल्टी दिशाएँ।", "5 : 3 : 2 becomes 2 : 3 : 5": "5 : 3 : 2, 2 : 3 : 5 बन जाता है", "Work it through and check that nothing has been created or destroyed.": "इसे हल करें और जाँचें कि कुछ भी नया नहीं बना या नष्ट नहीं हुआ है।", "Old: Asha 5/10, Bina 3/10, Chetan 2/10.": "पुराना: आशा 5/10, बीना 3/10, चेतन 2/10।", "Ten parts in all.": "कुल दस हिस्से।", "New: Asha 2/10, Bina 3/10, Chetan 5/10.": "नया: आशा 2/10, बीना 3/10, चेतन 5/10।", "Still ten parts, cut differently.": "अभी भी दस हिस्से, बस अलग तरीके से कटे हैं।", "Asha goes 5/10 to 2/10. She gives up 3/10.": "आशा 5/10 से 2/10 पर आ जाती है। वह 3/10 छोड़ देती है।", "Old minus new is positive, so she handed something over.": "पुराना में से नया पॉज़िटिव है, इसलिए उसने कुछ सौंप दिया।", "Bina stays at 3/10.": "बीना 3/10 पर ही रहती है।", "Her slice is the same size in both deals.": "दोनों सौदों में उसका हिस्सा एक ही आकार का है।", "Chetan goes 2/10 to 5/10. He gains 3/10.": "चेतन 2/10 से 5/10 पर जाता है। उसे 3/10 का फायदा होता है।", "Asha lost 3/10, Chetan took 3/10. It balances.": "आशा ने 3/10 खोया, चेतन ने 3/10 लिया। यह बैलेंस हो जाता है।", "Nothing appeared. This is the check that catches errors.": "कुछ भी नया नहीं आया। यह वह जाँच है जो गलतियों को पकड़ती है।", "Chetan pays Asha for 3/10 of the ₹1,00,000 goodwill = ₹30,000.": "चेतन आशा को ₹1,00,000 की गुडविल के 3/10 के लिए भुगतान करता है = ₹30,000।", "Whoever gains pays whoever gave up. That is what goodwill compensation means.": "जो फायदा उठाता है, वह उसे भुगतान करता है जिसने हिस्सा छोड़ा है। गुडविल मुआवजे का यही मतलब है।", "The entry you write for event one": "घटना एक के लिए आप जो एंट्री लिखते हैं", "s account is increased because she is being paid. No cash moves. The partners settle it between their capital accounts.": "चेतन का कैपिटल अकाउंट डॉ. ₹30,000 — टू आशा का कैपिटल अकाउंट ₹30,000। इसे एक वाक्य की तरह पढ़ें: चेतन का खाता कम हो गया क्योंकि उस पर उसका बकाया है, और आशा का खाता बढ़ गया क्योंकि उसे भुगतान किया जा रहा है। कोई नकद नहीं चलता है। पार्टनर इसे अपने कैपिटल अकाउंट के बीच सेटल करते हैं।", "Asha, Bina and Chetan share 5 : 3 : 2 and change to 2 : 3 : 5. Who gains, and by how much?": "आशा, बीना और चेतन 5 : 3 : 2 साझा करते हैं और 2 : 3 : 5 में बदलते हैं। किसे फायदा होता है, और कितना?", "Chetan moves from 2/10 to 5/10 — a gain of 3/10, exactly the 3/10 Asha gives up.": "चेतन 2/10 से 5/10 पर जाता है — 3/10 का फायदा, बिल्कुल वही 3/10 जो आशा छोड़ देती है।", "Asha gains 3/10": "आशा को 3/10 का फायदा होता है", "Chetan gains 3/10": "चेतन को 3/10 का फायदा होता है", "Bina gains 3/10": "बीना को 3/10 का फायदा होता है", "Event two — a new partner joins": "घटना दो — एक नया पार्टनर शामिल होता है", "Now the firm admits Daksh for 1/5 of the profits. He cannot simply take it; every part he gets must come from somebody who already had it. So all three of them give something up.": "अब फर्म मुनाफ़े के 1/5 हिस्से के लिए दक्ष को शामिल करती है। वह इसे बस ले नहीं सकता; उसे जो भी हिस्सा मिलता है, वह किसी ऐसे व्यक्ति से आना चाहिए जिसके पास वह पहले से था। इसलिए वे तीनों कुछ न कुछ छोड़ते हैं।", "Admit him and watch them give way": "उसे शामिल करें और देखें कि वे कैसे रास्ता देते हैं", "Set how much of the firm the newcomer asks for. The bars show Asha and Bina shrinking as he grows — and the parts they lose add up exactly to the part he takes.": "तय करें कि नया आने वाला फर्म का कितना हिस्सा माँगता है। बार दिखाते हैं कि आशा और बीना सिकुड़ रही हैं जबकि वह बढ़ रहा है — और उनके द्वारा खोए गए हिस्से ठीक उसी हिस्से के बराबर हैं जो वह लेता है।", "Sacrificing ratio = old share minus new share. It is the mirror image of the gaining ratio.": "बलिदान अनुपात = पुराना हिस्सा में से नया हिस्सा। यह फायदा उठाने वाले अनुपात का ही उल्टा रूप है।", "Daksh is admitted for one fifth": "दक्ष को एक-पाँचवें हिस्से के लिए शामिल किया जाता है", "The deed says nothing about who gives up what, so the sacrifice follows the old ratio 5 : 3 : 2.": "दस्तावेज़ में इस बारे में कुछ नहीं कहा गया है कि कौन क्या छोड़ता है, इसलिए बलिदान पुराने अनुपात 5 : 3 : 2 का पालन करता है।", "s share is 1/5, which is 10/50.": "दक्ष का हिस्सा 1/5 है, जो 10/50 है।", "Write everything over fifty so the numbers will line up.": "सब कुछ पचास पर लिखें ताकि नंबर एक सीध में आ जाएँ।", "The three of them give up 10/50 between them, in 5 : 3 : 2.": "वे तीनों मिलकर 5 : 3 : 2 में 10/50 छोड़ते हैं।", "Asha gives 5/10 of 10/50 = 5/50. Bina gives 3/50. Chetan gives 2/50.": "आशा 10/50 का 5/10 = 5/50 देती है। बीना 3/50 देती है। चेतन 2/50 देता है।", "Five, three and two parts of the ten he needs.": "उसे जिन दस हिस्सों की ज़रूरत है, उनमें से पाँच, तीन और दो हिस्से।", "New shares: Asha 20/50, Bina 12/50, Chetan 8/50, Daksh 10/50.": "नए हिस्से: आशा 20/50, बीना 12/50, चेतन 8/50, दक्ष 10/50।", "Old share minus what each gave up.": "पुराना हिस्सा में से हर एक ने जो छोड़ा, वह घटाएँ।", "New ratio = 20 : 12 : 8 : 10, which is 10 : 6 : 4 : 5.": "नया अनुपात = 20 : 12 : 8 : 10, जो 10 : 6 : 4 : 5 है।", "Divide through by two to tidy it.": "इसे साफ करने के लिए दो से भाग दें।", "What he received is precisely what they handed over.": "उसे जो मिला, वह ठीक वही है जो उन्होंने सौंप दिया।", "Daksh pays for the goodwill — in two entries": "दक्ष गुडविल के लिए भुगतान करता है — दो एंट्री में", "What Daksh does not touch": "दक्ष जिसे नहीं छूता", "The assets are revalued, and the reserves are distributed, before he arrives. Both go to the old partners only, in the old ratio 5 : 3 : 2. He has no claim on a profit earned, or a loss suffered, before he existed in the firm.": "उसके आने से पहले संपत्तियों का पुनर्मूल्यांकन किया जाता है, और रिज़र्व बाँटे जाते हैं। दोनों केवल पुराने पार्टनरों को जाते हैं, पुराने अनुपात 5 : 3 : 2 में। फर्म में उसके अस्तित्व में आने से पहले कमाए गए मुनाफ़े या झेले गए नुकसान पर उसका कोई दावा नहीं है।", "Daksh is admitted for 1/5 with goodwill of ₹1,00,000, bringing his share in cash. How much does Asha receive?": "दक्ष को ₹1,00,000 की गुडविल के साथ 1/5 हिस्से के लिए शामिल किया जाता है, जिससे नकद में उसका हिस्सा आता है। आशा को कितना मिलता है?", "Daksh pays ₹20,000. It is shared in the sacrificing ratio 5 : 3 : 2, so Asha gets 5/10 of it = ₹10,000.": "दक्ष ₹20,000 का भुगतान करता है। इसे बलिदान अनुपात 5 : 3 : 2 में बाँटा जाता है, इसलिए आशा को इसका 5/10 हिस्सा मिलता है = ₹10,000।", "Event three — Chetan leaves": "घटना तीन — चेतन जाता है", "Chetan retires. His 2/10 must now be taken by Asha and Bina, and this time they gain instead of giving up. The direction reverses, but the subtraction is the same one.": "चेतन रिटायर होता है। उसके 2/10 अब आशा और बीना को लेने होंगे, और इस बार वे देने के बजाय हासिल करती हैं। दिशा उलट जाती है, लेकिन घटाव वही रहता है।", "Watch his share drain into theirs": "देखें कि उसका हिस्सा कैसे उनके हिस्से में मिल जाता है", "s share each survivor takes. Their bars rise while his falls to nothing — and the parts they gain are exactly the parts he held.": "तय करें कि हर जीवित भागीदार चेतन के हिस्से का कितना हिस्सा लेता है। उनके बार ऊपर जाते हैं जबकि उसका हिस्सा गिरकर शून्य हो जाता है — और जो हिस्सा वे हासिल करती हैं, वह बिल्कुल वही है जो उसके पास था।", "If the deed is silent, the survivors take his share in their old ratio among themselves.": "यदि विलेख में कुछ नहीं लिखा है, तो जीवित भागीदार उसके हिस्से को आपस में अपने पुराने अनुपात में लेते हैं।", "Chetan retires from 5 : 3 : 2": "चेतन 5 : 3 : 2 से रिटायर होता है", "Asha and Bina continue, sharing future profits 5 : 3 between themselves, as before.": "आशा और बीना पहले की तरह ही भविष्य के मुनाफे को आपस में 5 : 3 के अनुपात में बांटना जारी रखती हैं।", "s share is 2/10.": "चेतन का हिस्सा 2/10 है।", "That is the part that has to go somewhere.": "यह वह हिस्सा है जिसे कहीं न कहीं जाना है।", "The deed is silent, so Asha and Bina take it in 5 : 3.": "विलेख में कुछ नहीं लिखा है, इसलिए आशा और बीना इसे 5 : 3 में लेती हैं।", "Their old ratio among themselves decides who gains what.": "उनके बीच का पुराना अनुपात तय करता है कि किसे क्या मिलेगा।", "Asha gains 5/8 of 2/10 = 1/8. Bina gains 3/8 of 2/10 = 3/40.": "आशा 2/10 का 5/8 = 1/8 हासिल करती है। बीना 2/10 का 3/8 = 3/40 हासिल करती है।", "Five parts and three parts of every eight.": "हर आठ का पांच हिस्सा और तीन हिस्सा।", "New ratio of Asha and Bina = 5 : 3.": "आशा और बीना का नया अनुपात = 5 : 3।", "It is unchanged, because they took his share in the same proportion they already sh
