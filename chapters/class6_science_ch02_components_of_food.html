ared in.": "यह अपरिवर्तित रहता है, क्योंकि उन्होंने उसका हिस्सा उसी अनुपात में लिया है जिसमें वे पहले से हिस्सा बांट रही थीं।", "Gaining ratio = 5 : 3.": "लाभ का अनुपात = 5 : 3।", "New share minus old share gives exactly that.": "नया हिस्सा माइनस पुराना हिस्सा बिल्कुल यही देता है।", "s share of goodwill is 2/10 of ₹1,00,000 = ₹20,000.": "सद्भावना में चेतन का हिस्सा ₹1,00,000 का 2/10 = ₹20,000 है।", "s Capital ₹20,000.": "आशा का कैपिटल Dr ₹12,500; बीना का कैपिटल Dr ₹7,500; टू चेतन का कैपिटल ₹20,000।", "The gainers pay, in the gaining ratio 5 : 3. The two debits add to exactly what he is credited.": "लाभ पाने वाले लाभ के अनुपात 5 : 3 में भुगतान करते हैं। दोनों डेबिट मिलकर बिल्कुल उतना ही होते हैं जितना उसे क्रेडिट किया गया है।", "Now build what Chetan is owed": "अब बनाएं कि चेतन को कितना मिलना है", "Chetan holds ₹2,00,000 capital, ₹20,000 of goodwill and ₹10,000 of reserves, and has drawn ₹15,000. Move the slider and watch the total he takes away with him.": "चेतन के पास ₹2,00,000 का कैपिटल, ₹20,000 की सद्भावना और ₹10,000 का रिजर्व है, और उसने ₹15,000 निकाले हैं। स्लाइडर को घुमाएं और देखें कि वह अपने साथ कुल कितना ले जाता है।", "Capital plus every credit, minus everything he already took out.": "कैपिटल प्लस हर क्रेडिट, माइनस वह सब जो वह पहले ही निकाल चुका है।", "Settling it": "इसका निपटान", "He can be paid at once, or the balance can sit in his loan account earning interest, or be paid in instalments, or be settled by handing him an asset. The question only asks which; the amount is already fixed.": "उसे तुरंत भुगतान किया जा सकता है, या शेष राशि उसके लोन खाते में ब्याज कमाते हुए रह सकती है, या किश्तों में भुगतान किया जा सकता है, या उसे कोई संपत्ति सौंपकर निपटाया जा सकता है। प्रश्न केवल यह पूछता है कि कौन सा; राशि पहले ही तय है।", "Same subtraction, opposite directions": "समान घटाव, विपरीत दिशाएं", "Cover one column and try to say the other from memory.": "एक कॉलम को ढक दें और याददाश्त से दूसरे को बताने का प्रयास करें।", "Someone joins": "कोई नया आता है", "What moves": "क्या बदलता है", "sacrificing = old − new": "त्याग = पुराना − नया", "Who pays goodwill": "सद्भावना का भुगतान कौन करता है", "the newcomer pays them": "नवागंतुक उन्हें भुगतान करता है", "old partners only, old ratio": "केवल पुराने भागीदार, पुराना अनुपात", "Someone leaves": "कोई जाता है", "the leaver gives up everything": "जाने वाला सब कुछ छोड़ देता है", "gaining = new − old": "लाभ = नया − पुराना", "all partners, old ratio": "सभी भागीदार, पुराना अनुपात", "Six things that cost marks": "छह चीजें जो नंबर कटवाती हैं", "Each one changes the answer, and each one appears in real papers.": "हर एक उत्तर को बदल देती है, और हर एक असली पेपर में दिखाई देती है।", "New ratio not given": "नया अनुपात नहीं दिया गया", "On admission, assume the share was taken in the old ratio. On retirement, assume the survivors continue in their old ratio among themselves. These are not the same assumption.": "प्रवेश पर, मान लें कि हिस्सा पुराने अनुपात में लिया गया था। रिटायरमेंट पर, मान लें कि जीवित भागीदार आपस में अपने पुराने अनुपात में जारी रहते हैं। ये समान धारणा नहीं हैं।", "That is an accumulated loss. Distribute it in the old ratio and deduct it from capital — do not add it.": "यह एक संचित हानि है। इसे पुराने अनुपात में बांटें और इसे कैपिटल से घटाएं — इसे जोड़ें नहीं।", "Write it off among all partners in the old ratio first, then adjust the fresh goodwill. The other order gives a different answer.": "इसे पहले सभी भागीदारों के बीच पुराने अनुपात में राइट ऑफ करें, फिर ताजी सद्भावना को समायोजित करें। दूसरा क्रम एक अलग उत्तर देता है।", "Only his share belongs to him. The rest belongs to the others.": "केवल उसका हिस्सा उसका है। बाकी दूसरों का है।", "Revaluation in the new ratio": "नए अनुपात में पुनर्मूल्यांकन", "It happened under the old arrangement. Always the old ratio.": "यह पुराने समझौते के तहत हुआ था। हमेशा पुराना अनुपात।", "If the amount paid exceeds capital plus reserves plus revaluation share, the excess is the goodwill. Work it backwards.": "यदि भुगतान की गई राशि कैपिटल प्लस रिजर्व प्लस पुनर्मूल्यांकन हिस्से से अधिक है, तो अधिकता सद्भावना है। इसे पीछे की ओर हल करें।", "A tricky one, worked backwards": "एक पेचीदा, जिसे पीछे की ओर हल किया गया", "s goodwill?": "सभी समायोजनों के बाद एक रिटायर होने वाले भागीदार का कैपिटल ₹80,000 है। उसे ₹95,000 का भुगतान किया जाता है। उसका हिस्सा 1/4 है। फर्म की सद्भावना क्या है?", "He is paid ₹15,000 more than he is owed.": "उसे उसके बकाया से ₹15,000 अधिक का भुगतान किया जाता है।", "₹95,000 minus ₹80,000. He cannot receive more than his due unless something extra is being bought.": "₹95,000 माइनस ₹80,000। वह अपने देय से अधिक प्राप्त नहीं कर सकता जब तक कि कुछ अतिरिक्त खरीदा न जा रहा हो।", "Nothing else can explain the extra money.": "कोई और चीज अतिरिक्त पैसे की व्याख्या नहीं कर सकती।", "If 1/4 of the goodwill is ₹15,000, the whole is ₹60,000.": "यदि सद्भावना का 1/4 हिस्सा ₹15,000 है, तो पूरा हिस्सा ₹60,000 है।", "Scale his share back up to the firm.": "उसके हिस्से को वापस फर्म के हिसाब से बढ़ाएं।", "His ₹15,000 is credited to him; the gainers are debited in their gaining ratio.": "उसके ₹15,000 उसे क्रेडिट किए जाते हैं; लाभ पाने वालों को उनके लाभ के अनुपात में डेबिट किया जाता है।", "Once you have the figure, the treatment is exactly as before.": "एक बार जब आपके पास आंकड़ा आ जाए, तो व्यवहार बिल्कुल पहले जैसा ही होता है।", "Everything on one page": "सब कुछ एक पेज पर", "If you remember nothing else, remember this.": "यदि आपको कुछ और याद न रहे, तो इसे याद रखें।", "the shares always total one — what one loses, another takes": "हिस्से हमेशा एक होते हैं — जो एक खोता है, दूसरा लेता है", "new minus old. Positive is a gain, negative is a sacrifice": "नया माइनस पुराना। सकारात्मक लाभ है, नकारात्मक त्याग है", "the differences must add to zero, or you have gone wrong": "अंतर का योग शून्य होना चाहिए, अन्यथा आपने गलती की है", "the gainers always pay the sacrificers, in proportion to those differences": "लाभ पाने वाले हमेशा त्यागने वालों को भुगतान करते हैं, उन अंतरों के अनुपात में", "always the old ratio, whoever is coming or going": "हमेशा पुराना अनुपात, चाहे कोई भी आ रहा हो या जा रहा हो", "only capital follows the new ratio": "केवल कैपिटल नए अनुपात का पालन करता है", "Now test it": "अब इसका परीक्षण करें", "You have followed one firm through all three events. The arena has 47 questions built on exactly this.": "आपने तीनों घटनाओं के माध्यम से एक फर्म का अनुसरण किया है। एरिना में बिल्कुल इसी पर आधारित 47 प्रश्न हैं।", "Open the assessment file when you are ready.": "जब आप तैयार हों तो असेसमेंट फ़ाइल खोलें।", "Change in Profit Sharing Ratio": "प्रॉफिट शेयरिंग रेशियो में बदलाव", "Accountancy · Class 12 · Chapter 3": "अकाउंटेंसी · क्लास 12 · चैप्टर 3", "First, the picture in your head": "सबसे पहले, अपने दिमाग में एक तस्वीर बनाओ", "Two words only": "सिर्फ दो शब्द", "Now the part that fools everyone": "अब वह हिस्सा जो सबको बेवकूफ बनाता है", "Move the slice and watch it happen": "स्लाइस को खिसकाओ और देखो क्या होता है", "s share. Watch who has to give. Bina never moves in this one — because in this arrangement Chetan takes only from Asha.": "आशा, बीना और चेतन के पास 5 : 3 : 2 है। चेतन का हिस्सा खिसकाओ। देखो कि किसे देना पड़ेगा। इस मामले में बीना का हिस्सा कभी नहीं बदलता — क्योंकि इस अरेंजमेंट में चेतन सिर्फ आशा से लेता है।", "The bars tell you the truth faster than the numbers. Look at who falls.": "बार तुम्हें नंबरों से ज़्यादा तेज़ी से सच बताते हैं। देखो कि कौन नीचे गिरता है।", "The table method — always use this": "टेबल का तरीका — हमेशा इसका इस्तेमाल करो", "Case 1 — Z takes 1/5 from X alone": "केस 1 — Z सिर्फ X से 1/5 लेता है", "X, Y and Z share 5 : 3 : 2. New arrangement: Z takes 1/5 of the firm, and he takes it from X only. Find the new ratio and the sacrificing ratio.": "X, Y और Z का हिस्सा 5 : 3 : 2 है। नया अरेंजमेंट: Z फर्म का 1/5 हिस्सा लेता है, और वह इसे सिर्फ X से लेता है। नया रेशियो और सैक्रिफाइसिंग रेशियो निकालो।", "Old: X 5/10, Y 3/10, Z 2/10.": "पुराना: X 5/10, Y 3/10, Z 2/10।", "Ten slices, shared five, three and two.": "दस स्लाइस, पाँच, तीन और दो में बँटे हुए।", "Z takes 1/5, which is 2/10, and he takes it all from X.": "Z 1/5 लेता है, जो 2/10 है, और वह इसे पूरा X से लेता है।", "X becomes 5/10 minus 2/10 = 3/10.": "X बन जाता है 5/10 माइनस 2/10 = 3/10।", "He gave up two slices.": "उसने दो स्लाइस छोड़ दिए।", "Y stays at 3/10. Z becomes 2/10 plus 2/10 = 4/10.": "Y 3/10 पर ही रहता है। Z बन जाता है 2/10 प्लस 2/10 = 4/10।", "Y was not touched; Z gained exactly what X lost.": "Y का कुछ नहीं गया; Z को ठीक उतना ही मिला जितना X का नुकसान हुआ।", "New ratio 3 : 3 : 4.": "नया रेशियो 3 : 3 : 4।", "Add them: 3 + 3 + 4 = 10. Still one pizza.": "इन्हें जोड़ो: 3 + 3 + 4 = 10। अभी भी एक पिज़्ज़ा है।", "Sacrifice is X alone, 1/5. Gain is Z alone, 1/5.": "त्याग सिर्फ X का है, 1/5। लाभ सिर्फ Z का है, 1/5।", "Only one partner on each side, so each carries the whole amount.": "दोनों तरफ सिर्फ एक ही पार्टनर है, इसलिए हर कोई पूरी रकम का हिसाब रखता है।", "Case 2 — Z takes 1/5 equally from X and Y": "केस 2 — Z X और Y से बराबर 1/5 लेता है", "Same firm, same 5 : 3 : 2. Now Z takes 1/5, but half from X and half from Y. Watch how different the answer becomes.": "वही फर्म, वही 5 : 3 : 2। अब Z 1/5 लेता है, लेकिन आधा X से और आधा Y से। देखो जवाब कितना अलग हो जाता है।", "Z needs 2/10 in total.": "Z को कुल 2/10 चाहिए।", "Same amount as before — that is the trap. The amount did not change.": "पहले जितना ही — यही तो जाल है। रकम नहीं बदली।", "He takes half from X and half from Y, so 1/10 each.": "वह आधा X से और आधा Y से लेता है, यानी दोनों से 1/10।", "X becomes 5/10 minus 1/10 = 4/10.": "X बन जाता है 5/10 माइनस 1/10 = 4/10।", "X lost one slice, not two.": "X ने एक स्लाइस खोया, दो नहीं।", "Y becomes 3/10 minus 1/10 = 2/10.": "Y बन जाता है 3/10 माइनस 1/10 = 2/10।", "This is the difference. Y pays this time.": "यही फर्क है। इस बार Y का नुकसान हुआ।", "Z becomes 2/10 plus 2/10 = 4/10.": "Z बन जाता है 2/10 प्लस 2/10 = 4/10।", "Z ends in the same place — he still has four.": "Z उसी जगह पहुँचता है — उसके पास अभी भी चार हैं।", "New ratio 4 : 2 : 4, that is 2 : 1 : 2.": "नया रेशियो 4 : 2 : 4, यानी 2 : 1 : 2।", "Add: 4 + 2 + 4 = 10. Safe.": "जोड़ो: 4 + 2 + 4 = 10। सेफ।", "Sacrificing ratio X : Y = 1 : 1.": "सैक्रिफाइसिंग रेशियो X : Y = 1 : 1।", "Both gave the same, so they share the loss equally.": "दोनों ने बराबर दिया, इसलिए वे नुकसान को बराबर बाँटते हैं।", "s new share?": "X, Y, Z का हिस्सा 5 : 3 : 2 है। Z X और Y से बराबर 1/5 लेता है। X का नया हिस्सा क्या है?", "Z takes 2/10 in total, half from each — so X gives 1/10 and falls from 5/10 to 4/10. In Case 1 he would have fallen to 3/10.": "Z कुल 2/10 लेता है, दोनों से आधा-आधा — इसलिए X 1/10 देता है और 5/10 से गिरकर 4/10 हो जाता है। केस 1 में वह गिरकर 3/10 हो जाता।", "Case 3 — they decide to share equally": "केस 3 — वे बराबर बाँटने का फैसला करते हैं", "from anyone — everyone simply moves to 1/3. This one catches students because there is no obvious taker.": "अब तीनों भविष्य के सभी प्रॉफिट को बराबर बाँटने पर सहमत होते हैं। कोई किसी से कुछ", "Old: X 5/10, Y 3/10, Z 2/10. New: each 1/3.": "पुराना: X 5/10, Y 3/10, Z 2/10। नया: हर एक 1/3।", "Write the new shares over thirty so they line up with tenths.": "नए हिस्सों को तीस के डिनॉमिनेटर के साथ लिखो ताकि वे दसवें हिस्से के साथ लाइन में आ जाएँ।", "X: 5/10 minus 1/3 = 15/30 minus 10/30 = 5/30 sacrifice.": "X: 5/10 माइनस 1/3 = 15/30 माइनस 10/30 = 5/30 त्याग।", "Positive, so X gave up.": "पॉज़िटिव है, इसलिए X ने छोड़ा।", "Y: 3/10 minus 1/3 = 9/30 minus 10/30 = minus 1/30.": "Y: 3/10 माइनस 1/3 = 9/30 माइनस 10/30 = माइनस 1/30।", "Negative — so Y actually gained one-thirtieth.": "नेगेटिव — इसलिए Y का असल में 1/30 का लाभ हुआ।", "Z: 2/10 minus 1/3 = 6/30 minus 10/30 = minus 4/30.": "Z: 2/10 माइनस 1/3 = 6/30 माइनस 10/30 = माइनस 4/30।", "Negative too, so Z gained four-thirtieths.": "यह भी नेगेटिव है, इसलिए Z का 4/30 का लाभ हुआ।", "Check: 5/30 out, 1/30 plus 4/30 in. It balances.": "चेक करो: 5/30 गया, 1/30 प्लस 4/30 आया। यह बैलेंस हो जाता है।", "This is why you never skip the check.": "इसीलिए तुम कभी भी चेक करना नहीं छोड़ते।", "Gaining ratio Y : Z = 1 : 4.": "गेनिंग रेशियो Y : Z = 1 : 4।", "Their gains, written in order.": "उनके लाभ, क्रम में लिखे गए।", "Case 4 — Z takes 1/5 of X and 1/6 of Y": "केस 4 — Z, X का 1/5 और Y का 1/6 लेता है", "s share. Not one-fifth of the firm — one-fifth of what X holds.": "इस चैप्टर की सबसे मुश्किल लाइन। इसे धीरे-धीरे पढ़ो: Z, X के हिस्से का एक-पाँचवाँ लेता है, और Y के हिस्से का एक-छठा लेता है। फर्म का एक-पाँचवाँ नहीं — बल्कि X के पास जो है उसका एक-पाँचवाँ।", "X holds 5/10. Z takes 1/5 of that = 1/10.": "X के पास 5/10 है। Z उसका 1/5 लेता है = 1/10।", "Y holds 3/10. Z takes 1/6 of that = 1/20.": "Y के पास 3/10 है। Z उसका 1/6 लेता है = 1/20।", "One-sixth of three-tenths.": "तीन-दशमांश का एक-छठा।", "s total gain = 1/10 plus 1/20 = 3/20.": "Z का कुल लाभ = 1/10 प्लस 1/20 = 3/20।", "Add what he took from each.": "जो उसने हर एक से लिया है उसे जोड़ें।", "X becomes 5/10 minus 1/10 = 4/10 = 8/20.": "X बन जाता है 5/10 माइनस 1/10 = 4/10 = 8/20।", "Write everything over twenty now.": "अब सब कुछ बीस के ऊपर लिखें।", "Y becomes 3/10 minus 1/20 = 6/20 minus 1/20 = 5/20.": "Y बन जाता है 3/10 माइनस 1/20 = 6/20 माइनस 1/20 = 5/20।", "Three-tenths is six-twentieths.": "तीन-दशमांश छह-बीसवां होता है।", "Z becomes 2/10 plus 3/20 = 4/20 plus 3/20 = 7/20.": "Z बन जाता है 2/10 प्लस 3/20 = 4/20 प्लस 3/20 = 7/20।", "Old share plus everything he took.": "पुराना हिस्सा प्लस वह सब जो उसने लिया।", "New ratio 8 : 5 : 7. Sacrificing ratio X : Y = 1/10 : 1/20 = 2 : 1.": "नया अनुपात 8 : 5 : 7। त्यागने का अनुपात X : Y = 1/10 : 1/20 = 2 : 1।", "Clear the fractions by multiplying by twenty.": "बीस से गुणा करके भिन्नों को हटा दें।", "Now backwards — the question that scares everyone": "अब पीछे की ओर — वह सवाल जो हर किसी को डराता है", "Finding the old ratio from the new one": "नए अनुपात से पुराना अनुपात खोजना", "New ratio 9 : 5 : 6. Rajesh gained 1/10, taken equally from Raju and Rajeev. Find the old ratio.": "नया अनुपात 9 : 5 : 6। राजेश ने 1/10 लिया, जो राजू और राजीव से बराबर लिया गया। पुराना अनुपात निकालें।", "Write the new shares over twenty: Raju 9/20, Rajeev 5/20, Rajesh 6/20.": "नए हिस्सों को बीस के ऊपर लिखें: राजू 9/20, राजीव 5/20, राजेश 6/20।", "A common denominator again — it always starts here.": "फिर से एक उभयनिष्ठ हर — यह हमेशा यहीं से शुरू होता है।", "Rajesh gained 1/10, which is 2/20.": "राजेश ने 1/10 लिया, जो कि 2/20 है।", "That is what he took in total.": "यह कुल मिलाकर वही है जो उसने लिया।", "He took it equally, so 1/20 from Raju and 1/20 from Rajeev.": "उसने इसे बराबर लिया, इसलिए राजू से 1/20 और राजीव से 1/20।", "Equal means equal.": "बराबर का मतलब बराबर ही है।", "Old Raju = 9/20 plus 1/20 = 10/20.": "पुराना राजू = 9/20 प्लस 1/20 = 10/20।", "Go backwards: he had more before he lost it.": "पीछे जाएं: इसे खोने से पहले उसके पास ज्यादा था।", "Old Rajeev = 5/20 plus 1/20 = 6/20.": "पुराना राजीव = 5/20 प्लस 1/20 = 6/20।", "Old Rajesh = 6/20 minus 2/20 = 4/20.": "पुराना राजेश = 6/20 माइनस 2/20 = 4/20।", "He had less before he gained.": "लेने से पहले उसके पास कम था।", "Old ratio 10 : 6 : 4, that is 5 : 3 : 2.": "पुराना अनुपात 10 : 6 : 4, यानी 5 : 3 : 2।", "Add: 10 + 6 + 4 = 20. Safe.": "जोड़ें: 10 + 6 + 4 = 20। सुरक्षित।", "Goodwill — who pays whom": "सद्भावना — कौन किसे भुगतान करता है", "s is credited. No cash moves between them — the partners settle it inside their capital accounts.": "जिसने भी लाभ लिया है उसे उस व्यक्ति को भुगतान करना होगा जिसने छोड़ा है। बस यही बात है। फर्म की सद्भावना का मूल्यांकन करें, लाभ लेने वाले का हिस्सा लें, और एक एंट्री पास करें: लाभ लेने वाले के कैपिटल अकाउंट को डेबिट किया जाता है, त्यागने वाले को क्रेडिट किया जाता है। उनके बीच कोई नकद नहीं जाता — भागीदार इसे अपने कैपिटल अकाउंट के अंदर सेटल करते हैं।", "The entry, written properly": "एंट्री, सही तरीके से लिखी गई", "s Capital A/c. If goodwill already sits in the books, write that off first among all partners in the old ratio, then pass this entry for the new figure. Doing it the other way round gives a different answer, and the examiner knows it.": "लाभ लेने वाले पार्टनर का कैपिटल A/c Dr — To त्यागने वाले पार्टनर का कैपिटल A/c। अगर सद्भावना पहले से ही किताबों में है, तो पहले सभी भागीदारों के बीच पुराने अनुपात में उसे राइट ऑफ करें, फिर नए आंकड़े के लिए यह एंट्री पास करें। इसे उल्टा करने से अलग जवाब आता है, और परीक्षक यह जानता है।", "Five things that cost marks": "पांच चीजें जो अंक कम करती हैं", "Every one of these appears in real papers. Read them the night before.": "इनमें से हर एक असली पेपर में आता है। पिछली रात इन्हें पढ़ लें।", "Not reading who takes from whom": "यह न पढ़ना कि कौन किससे लेता है", "Case 1 and Case 2 have the same numbers and different answers. The sentence decides, not the figure.": "केस 1 और केस 2 में समान संख्याएं और अलग-अलग जवाब हैं। वाक्य तय करता है, संख्या नहीं।", "Skipping the total check": "कुल जांच को छोड़ देना", "Row three must still add to the same total. If it does not, you have made an arithmetic slip — find it before you move on.": "पंक्ति तीन का जोड़ अभी भी उसी कुल योग के बराबर होना चाहिए। अगर ऐसा नहीं होता है, तो आपने गणित की गलती की है — आगे बढ़ने से पहले इसे खोजें।", "Writing off goodwill last": "सद्भावना को अंत में राइट ऑफ करना", "Old goodwill goes off first, in the old ratio, among all partners. Then the new adjustment.": "पुरानी सद्भावना पहले जाती है, पुराने अनुपात में, सभी भागीदारों के बीच। फिर नया समायोजन।", "Forgetting the sacrificing ratio needs clearing": "त्यागने वाले अनुपात को साफ करना भूल जाना", "1/10 : 1/20 is not a ratio until you clear it to 2 : 1.": "1/10 : 1/20 तब तक अनुपात नहीं है जब तक आप इसे 2 : 1 में साफ नहीं करते।", "s share, and Y holds 3/10. How much does Z take from Y?": "Z, Y के हिस्से का 1/6 लेता है, और Y के पास 3/10 है। Z, Y से कितना लेता है?", "means multiply — it does not mean Y gives one-sixth of the firm.": "तीन-दशमांश का एक-छठा 1/20 होता है।", "The chapter on one page": "एक पृष्ठ पर अध्याय", "If you remember nothing else, remember these six lines.": "अगर आपको कुछ और याद न रहे, तो इन छह पंक्तियों को याद रखें।", "one pizza, ten slices — nobody gains a slice without someone losing one": "एक पिज्जा, दस स्लाइस — कोई भी किसी और का const CONN = {
  and:"और", but:"लेकिन", because:"क्योंकि", so:"इसलिए", if:"अगर", when:"जब", while:"जबकि",
  although:"हालांकि", or:"या", therefore:"इसलिए", however:"परंतु", since:"चूंकि", unless:"जब तक नहीं"
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escA(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function normalizeWord(w){
  return String(w).toLowerCase().replace(/[’']s$/,"").replace(/[^a-z\-]/g,"");
}

function lookupWord(raw){
  const n = normalizeWord(raw);
  if (WM2[n]) return {known:true, h:WM2[n].h, p:WM2[n].p||""};
  const base = n.replace(/(ing|ed|es|s|ly)$/,"");
  if (WM2[base]) return {known:true, h:WM2[base].h, p:WM2[base].p||""};
  return {known:false, h:"(शब्दकोश में देखें)", p:""};
}

function rtText(text){
  const shielded = [];
  text = text.replace(/\{\{([\s\S]*?)\}\}/g, function(m,g){
    shielded.push(g);
    return "\u0001" + (shielded.length-1) + "\u0001";
  });
  const parts = text.split(/(<[^>]+>|\u0001\d+\u0001)/g);
  let connCount = 0;
  return parts.map(function(seg){
    if (/^<[^>]+>$/.test(seg)) return seg;
    const sm = seg.match(/^\u0001(\d+)\u0001$/);
    if (sm) return esc(shielded[+sm[1]]);
    return seg.replace(/([A-Za-z][A-Za-z'\-]*)|([.!?]+\s*)/g, function(m, word, punc){
      if (punc){ connCount = 0; return punc; }
      if (!word) return m;
      if (/^\d/.test(word)) return word;
      const low = word.toLowerCase();
      if (CONN[low] && connCount < 4){
        connCount++;
        return '<span class="conn" title="connector">' + word + ' (' + CONN[low] + ')</span>';
      }
      return '<span class="tapable" data-w="' + escA(normalizeWord(word)) + '" tabindex="0" role="button">' + word + '</span>';
    });
  }).join("");
}

  if(el && (el.textContent||'').replace(/\s+/g,' ').trim().length < 6) return;
  if (!hi) return;
  if (el.dataset.hiDone) return; el.dataset.hiDone = "1";
  const wrap = document.createElement("div"); wrap.className = "hiWrap";
  const btn = document.createElement("button"); btn.type="button"; btn.className="hiBtn";
  btn.setAttribute("aria-expanded","false"); btn.setAttribute("aria-label","Show Hindi translation");
  btn.textContent = "अ";
  const box = document.createElement("div"); box.className="hiBox"; box.hidden=true; box.setAttribute("lang","hi");
  box.textContent = hi;
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    const open = box.hidden; box.hidden = !open; wrap.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
    btn.classList.toggle("on", open);
  });
  wrap.appendChild(btn); wrap.appendChild(box); el.appendChild(wrap);
}

function applyLang(root){
  (root||document).querySelectorAll("[data-lang]").forEach(function(el){
    if (el.dataset.langDone) return;
    const en = (el.dataset.hi ? "" : el.textContent).replace(/\s+/g," ").trim();
    el.innerHTML = rtText(el.innerHTML);
    el.dataset.langDone = "1";
    attachHi(el, el.dataset.hi || PH[en]);
  });
  bindTaps(root||document);
}

function lang(root){
  if (!root) return;
  const els = root.querySelectorAll("[data-lang]");
  for (let i=0; i<els.length; i++){
    delete els[i].dataset.langDone;
    delete els[i].dataset.hiDone;
  }
  applyLang(root);
}

function bindTaps(root){
  (root||document).querySelectorAll(".tapable").forEach(function(el){
    if (el.dataset.bound) return; el.dataset.bound = "1";
    const open = function(){ showWord(el.dataset.w); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", function(e){
      if (e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); }
    });
  });
}

function showWord(w){
  const r = lookupWord(w);
  const eW=document.getElementById("wpWord"), eH=document.getElementById("wpHindi"), eP=document.getElementById("wpPron");
  if(eW) eW.textContent = w;
  if(eH) eH.textContent = r.h;
  if(eP) eP.textContent = (r.known && r.p) ? "उच्चारण · " + r.p : "";
  const panel = document.getElementById("wp");
  if(!panel) return;
  panel.classList.add("up"); panel.dataset.cur = w;
  speak(w);
}

function closeWord(){
  const p = document.getElementById("wp");
  if(p) p.classList.remove("up");
}

let lastUtter = null;
function speak(text){
  try{
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    lastUtter = new SpeechSynthesisUtterance(text);
    lastUtter.rate = 0.85; lastUtter.lang = "en-IN";
    window.speechSynthesis.speak(lastUtter);
  }catch(e){}
}

(function bindWordPanel(){
  const closeBtn = document.getElementById("wpClose");
  if(closeBtn) closeBtn.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); closeWord();
  });
  const spk = document.getElementById("wpSpeak");
  if(spk) spk.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    const p = document.getElementById("wp");
    if(p && p.dataset.cur) speak(p.dataset.cur);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" || e.key === "Esc") closeWord();
  });
  document.addEventListener("click", function(e){
    const p = document.getElementById("wp");
    if(!p || !p.classList.contains("up")) return;
    if(p.contains(e.target)) return;
    if(e.target && e.target.classList && e.target.classList.contains("tapable")) return;
    closeWord();
  }, true);
})();

</script>

<script>
const VB = 'viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"';
function svgOpen(extra){ return '<svg '+VB+' font-family="system-ui,sans-serif" '+(extra||"")+'>'; }

function vizCard(type){
  let s = svgOpen();
  s += '<rect x="25" y="25" width="350" height="250" rx="16" fill="rgba(49,230,196,.04)" stroke="rgba(49,230,196,.2)"/>';

}

function vizThali(){
  let s = svgOpen();

  s += '<text x="150" y="99" fill="#ff9d5b" font-size="12" font-weight="900" text-anchor="middle">Dal (Protein)</text>';

  // 2. Rice / Roti (Carbs - Gold)
  s += '<circle cx="200" cy="170" r="42" fill="#ffc247" fill-opacity=".2" stroke="#ffc247" stroke-width="2"/>';
  s += '<text x="200" y="174" fill="#ffc247" font-size="13" font-weight="900" text-anchor="middle">Roti (Carbs)</text>';

  // 3. Spinach Sabzi (Vitamins - Emerald)
  s += '<circle cx="250" cy="95" r="32" fill="#4ade80" fill-opacity=".25" stroke="#4ade80" stroke-width="2"/>';
  s += '<text x="250" y="99" fill="#4ade80" font-size="12" font-weight="900" text-anchor="middle">Greens (Vit)</text>';

  // 4. Ghee drop (Fat - Rose)
  s += '<circle cx="140" cy="170" r="16" fill="#ff5f78" fill-opacity=".3" stroke="#ff5f78" stroke-width="1.5"/>';
  s += '<text x="140" y="174" fill="#ff5f78" font-size="9" font-weight="800" text-anchor="middle">Ghee</text>';

  s += '<text x="200" y="285" fill="#31e6c4" font-size="15" font-weight="800" text-anchor="middle">The Balanced Indian Thali Architecture</text>';
  return s + '</svg>';
}

function vizLab(testType){
  let s = svgOpen();
  const tx = 200, ty = 140;

  // Test tube rack stand
  s += '<rect x="100" y="240" width="200" height="14" rx="4" fill="#5c7386"/>';

  // Test Tube
  s += '<path d="M 175 70 L 175 220 A 25 25 0 0 0 225 220 L 225 70 Z" fill="#0d2133" stroke="#8ba2b6" stroke-width="3"/>';

  let liquidCol = '#38d6c0', label = 'Raw Sample', dropCol = '#ffc247';
  if(testType === "starch"){
    liquidCol = '#1a1f55'; // Blue-black
    dropCol = '#d97706'; // Brown iodine
    label = 'Starch + Iodine -> Deep Blue-Black!';
  } else if(testType === "protein"){
    liquidCol = '#8b5cf6'; // Violet
    dropCol = '#3b82f6'; // Copper sulfate blue
    label = 'Protein + Biuret -> Rich Violet!';
  } else if(testType === "fat"){
    liquidCol = '#ffd98a';
    dropCol = '#ffc247';
    label = 'Fat -> Translucent Greasy Patch!';
  }

  // Liquid in test tube
  s += '<path d="M 177 150 L 177 220 A 23 23 0 0 0 223 220 L 223 150 Z" fill="'+liquidCol+'" fill-opacity=".85"/>';

  // Dropper
  s += '<rect x="195" y="15" width="10" height="35" rx="3" fill="#8ba2b6"/>';
  s += '<circle cx="200" cy="12" r="10" fill="#ff5f78"/>';
  // Falling drop
  s += '<circle cx="200" cy="62" r="5" fill="'+dropCol+'"/>';

  s += '<rect x="40" y="265" width="320" height="28" rx="6" fill="#122436" stroke="rgba(255,255,255,.1)"/>';
  s += '<text x="200" y="284" fill="#ffc247" font-size="14" font-weight="800" text-anchor="middle">'+label+'</text>';
  return s + '</svg>';
}

const VIZ = {
  thali_visual: ()=> vizThali(),
  nutrients_circle: ()=> vizThali(),
  energy_visual: ()=> vizThali(),
  protein_visual: ()=> vizLab("protein"),
  vitamins_visual: ()=> vizThali(),
  starch_test_visual: ()=> vizLab("starch"),
  protein_test_visual: ()=> vizLab("protein"),
  fat_test_visual: ()=> vizLab("fat"),
  roughage_visual: ()=> vizThali(),
  deficiency_visual: ()=> vizThali(),
};

const SIM = {
  reagent_lab: ()=>'<label style="font-size:13.5px;color:var(--muted)">Select Biochemical Test:</label>'+
    '<div class="switch">'+
      '<button id="btnStarch" class="on">1. Starch Test</button>'+
      '<button id="btnProtein">2. Protein Test</button>'+
      '<button id="btnFat">3. Fat Test</button>'+
    '</div>'+
    '<div class="readout"><span id="oReaction">Reagent: <b>Dilute Iodine Solution (Brown)</b></span></div>'
};

function simViz(name, v){
  if(name === "reagent_lab") return vizLab(v);
  return vizThali();
}

function initSim(name){
  return "starch";
}

function wireSim(name){
  if(name === "reagent_lab"){
    const bS = document.getElementById("btnStarch");
    const bP = document.getElementById("btnProtein");
    const bF = document.getElementById("btnFat");
    const oR = document.getElementById("oReaction");

    const clear = ()=>{ bS.classList.remove("on"); bP.classList.remove("on"); bF.classList.remove("on"); };

    bS.addEventListener("click", ()=>{
      clear(); bS.classList.add("on");
      oR.innerHTML = "Reagent: <b>Dilute Iodine</b> -> Result: <b style='color:#63a9ff'>Deep Blue-Black</b>";
      setVis(vizLab("starch"));
    });
    bP.addEventListener("click", ()=>{
      clear(); bP.classList.add("on");
      oR.innerHTML = "Reagents: <b>Copper Sulfate + Caustic Soda</b> -> Result: <b style='color:#9d7bff'>Rich Violet</b>";
      setVis(vizLab("protein"));
    });
    bF.addEventListener("click", ()=>{
      clear(); bF.classList.add("on");
      oR.innerHTML = "Medium: <b>White Paper</b> -> Result: <b style='color:#ffc247'>Translucent Grease Patch</b>";
      setVis(vizLab("fat"));
    });
  }
}
</script>

<script>
const SLIDES = [{"kind": "title", "t": "Components of Food — Nutrients, Balanced Diet & Chemical Tests", "s": "Science · Class 6 · Chapter 2", "b": "Look at a traditional Indian thali: dal, roti, ghee, curd, and spinach. Why is it arranged like that? Because it is a complete nutritional laboratory on your plate!", "viz": "thali_visual"}, {"kind": "text", "t": "The whole chapter in one line", "b": "Food fuels life through five major nutrients — carbohydrates, fats, proteins, vitamins, and minerals — supported by roughage and water.", "mentor": "Namaste! I am Acharya. Your body is the most complex machine on Earth, and food is its high-octane rocket fuel!", "viz": "thali_visual"}, {"kind": "text", "t": "What Are Nutrients?", "b": "The chemical substances present in our food that our body needs to grow, repair tissues, produce energy, and defend against diseases are called NUTRIENTS.", "viz": "nutrients_circle"}, {"kind": "text", "t": "Energy Givers: Carbohydrates and Fats", "b": "Carbohydrates (rice, wheat, potatoes, sugar) provide quick energy. Fats (ghee, butter, mustard oil, nuts) store concentrated energy — giving more than twice the energy of carbohydrates!", "viz": "energy_visual"}, {"kind": "text", "t": "Body Builders: Proteins", "b": "Proteins are the building blocks of human life. They are essential for cell growth, muscle repair, and making new tissues. Rich sources: pulses (dal), milk, eggs, paneer, and fish.", "mentor": "Notice how Indian wrestlers eat soaked almonds and drink buffalo milk? That's natural protein building strong muscle fibers!", "viz": "protein_visual"}, {"kind": "text", "t": "Protectors: Vitamins and Minerals", "b": "Though needed in tiny amounts, vitamins and minerals protect our eyes, bones, teeth, and gums from dangerous illnesses. Vitamin A keeps eyes sharp; Vitamin C fights infections.", "viz": "vitamins_visual"}, {"kind": "sim", "sim": "reagent_lab", "t": "Try it: Virtual Chemical Dropper Lab", "b": "Select a food item and drop chemical reagents onto the test tube. Watch the authentic color change take place right in front of your eyes!", "hint": "Iodine turns starch blue-black; Copper Sulfate + Caustic Soda turns protein violet!"}, {"kind": "text", "t": "The Iodine Test for Starch", "b": "Take a slice of raw potato. Add 2-3 drops of dilute Iodine solution. If it contains starch, the brown iodine turns into a deep BLUE-BLACK color!", "viz": "starch_test_visual"}, {"kind": "text", "t": "The Biuret Test for Protein", "b": "Make a paste of boiled dal. Add 2 drops of Copper Sulfate (blue) and 10 drops of Caustic Soda. Shake well. The mixture turns a beautiful VIOLET color if protein is present!", "viz": "protein_test_visual"}, {"kind": "text", "t": "The Paper Translucency Test for Fat", "b": "Rub a small piece of butter or crushed groundnut on a clean white paper. Let it dry. If a translucent oily patch appears under a light bulb, fats are confirmed!", "viz": "fat_test_visual"}, {"kind": "text", "t": "Roughage (Dietary Fibre) and Water", "b": "Roughage does not provide energy, but adds bulk to food, helping our digestive tract push out undigested waste smoothly. Water absorbs nutrients and flushes toxins in urine and sweat.", "viz": "roughage_visual"}, {"kind": "text", "t": "What is a Balanced Diet?", "b": "A diet that contains all essential nutrients in the right proportions, along with adequate roughage and water. You don't need expensive foreign food: sattu, jaggery, sprouted moong, and spinach make a world-class balanced diet!", "mentor": "A balanced diet doesn't cost gold: traditional sattu and roasted chana provide more bio-available nutrition than costly imported cereals!", "viz": "thali_visual"}, {"kind": "text", "t": "Deficiency Diseases: When Nutrients Go Missing", "b": "Diseases caused by the prolonged lack of specific nutrients in food are called DEFICIENCY DISEASES. Lack of Vitamin A causes Night Blindness; Vitamin D deficiency causes brittle Rickets!", "viz": "deficiency_visual"}, {"kind": "steps", "t": "Worked example — Diagnosing Deficiency", "b": "A 10-year-old child in Bihar suffers from bleeding gums and wounds that take very long to heal. What nutrient is lacking?", "steps": ["Step 1: Bleeding gums and delayed wound healing are classic symptoms of Scurvy.", "Step 2: Scurvy is caused strictly by the deficiency of Vitamin C.", "Step 3: Treatment: Consume citrus fruits like Amla (आंवला), lemons, oranges, and raw tomatoes.", "Adding fresh Amla restored the child's gums within 2 weeks!"], "viz": "vitamins_visual"}, {"kind": "check", "q": "Which chemical turns blue-black in the presence of starch?", "opts": ["Iodine Solution", "Copper Sulfate", "Caustic Soda"], "ans": 0, "why": "Dilute Iodine solution reacts with starch carbohydrates to form a deep blue-black chemical complex."}, {"kind": "check", "q": "Which disease is caused by lack of Iodine in diet?", "opts": ["Goitre (घेंघा)", "Anaemia (अरक्तता)", "Rickets (रिकेट्स)"], "ans": 0, "why": "Iodine deficiency causes Goitre, where the thyroid gland in the neck becomes visibly enlarged."}, {"kind": "mistake", "t": "Three mistakes that cost marks", "b": "Watch out for these common misconceptions about food preparation and nutrients.", "items": [["Washing vegetables after cutting", "Never wash peeled and chopped vegetables! Water-soluble Vitamins B and C wash right down the kitchen drain with the water."], ["Over-cooking and deep frying", "Vitamin C is fragile and gets completely destroyed by high cooking heat. Always include fresh raw fruits and salads in your diet!"], ["Confusing energy providers", "Fats give more energy than carbohydrates gram-for-gram, but carbohydrates are the primary source utilized first by the body."]]}, {"kind": "text", "t": "Where you meet it in real life", "b": "From government school midday meals to village sprouted grams, nutrition is actively engineered.", "mentor": "Whenever you eat sprouted moong, you are enjoying 300% extra Vitamin C generated purely by mother nature!", "viz": "thali_visual"}, {"kind": "summary", "t": "The chapter on one card", "b": "The 5 major nutrients, diagnostic tests, and disease matrix on a single reference card.", "items": [["Carbohydrates", "Quick energy (Rice, Wheat, Potato). Blue-black with Iodine."], ["Proteins", "Growth & Repair (Dal, Milk, Egg). Violet with Biuret."], ["Fats", "Energy storage (Ghee, Butter). Translucent paper patch."], ["Vitamins & Minerals", "Immunity & Protection (Vit A, B, C, D, Iron, Iodine)."], ["Roughage & Water", "Smooth digestion and toxin elimination. Essential bulk."]]}, {"kind": "end", "t": "Now test yourself", "s": "Mastery unlocked! You are certified in food nutrition and biochemical analysis.", "b": "You understand how every nutrient in an Indian thali keeps the body energized and disease-free!"}];
const card = document.getElementById("card");
const prog = document.getElementById("prog");
const prevB = document.getElementById("prev");
const nextB = document.getElementById("next");
const hiAll = document.getElementById("hiAll");
let i = 0, allHi = false;

const T = (s)=>'<span data-lang>'+esc(s)+'</span>';
function setVis(html){ const v=document.getElementById("vis"); if(v) v.innerHTML = html; }

function render(){
  const s = SLIDES[i];
  const hasSim = s.kind === "sim";
  card.className = "card" + (s.kind === "end" ? "" : " split");
  let title="", txt="", vis="", ctl="";

  switch(s.kind){
    case "title":
      title = '<div class="kindrow"><span class="kind">Chapter 2</span></div><h1 data-lang>'+esc(s.t)+'</h1>';
      txt = '<p class="sub" data-lang>'+esc(s.s||"")+'</p><p class="b" data-lang>'+esc(s.b||"")+'</p>';
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("hero");
      break;
    case "text":
      title = '<div class="kindrow"><span class="kind">Concept</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>';
      if(s.mentor){
        txt += '<div class="mentor-bubble"><div class="mentor-av">आ</div><div class="mentor-content">'+
               '<div class="mentor-name">आचार्य (Acharya)</div><div class="mentor-msg" data-lang>'+esc(s.mentor)+'</div></div></div>';
      }
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("concept");
      break;
    case "sim":
      title = '<div class="kindrow"><span class="kind">Interactive Lab</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+(s.hint?'<div class="hint" data-lang>'+esc(s.hint)+'</div>':'');
      ctl = '<div class="simctl">'+(SIM[s.sim]?SIM[s.sim]():"")+'</div>';
      break;
    case "steps":
      title = '<div class="kindrow"><span class="kind">Worked Example</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        '<div class="steps">'+(s.steps||[]).map((x,n)=>'<div class="step"><span class="n">'+(n+1)+
        '</span><span data-lang>'+esc(x)+'</span></div>').join("")+'</div>';
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("steps");
      break;
    case "check":
      title = '<div class="kindrow"><span class="kind">Your Turn</span></div><h2 data-lang>'+esc(s.q)+'</h2>';
      txt = '<div class="opts">'+(s.opts||[]).map((o,n)=>'<div class="opt" data-k="'+n+'">'+
        '<span class="k">'+String.fromCharCode(65+n)+'</span><span data-lang>'+esc(o)+'</span></div>').join("")+
        '</div><div class="fb" id="fb"></div>';
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("quiz");
      break;
    case "mistake":
      title = '<div class="kindrow"><span class="kind">Watch Out</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        (s.items||[]).map(it=>'<div class="mrow"><div style="font-size:24px;line-height:1">⚠️</div><div><b data-lang>'+esc(it[0])+
        '</b><span data-lang>'+esc(it[1])+'</span></div></div>').join("");
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("mistake");
      break;
    case "summary":
      title = '<div class="kindrow"><span class="kind">Master Summary</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = (s.items||[]).map(it=>'<div class="mrow"><div style="font-size:20px;line-height:1;color:var(--green)">✓</div><div><b data-lang>'+esc(it[0])+
        '</b><span data-lang>'+esc(it[1])+'</span></div></div>').join("");
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("summary");
      break;
    case "end":
      title = '<div class="kindrow"><span class="kind">Mastery Unlocked</span></div><h1 data-lang>'+esc(s.t)+'</h1>';
      txt = '<p class="sub" data-lang>'+esc(s.s||"")+'</p><p class="b" data-lang>'+esc(s.b||"")+'</p>'+
            '<div class="mentor-bubble"><div class="mentor-av">🏆</div><div class="mentor-content">'+
            '<div class="mentor-name">आचार्य (Acharya)</div><div class="mentor-msg">शाबाश! आपने इस अध्याय के सभी सिद्धांतों में पूर्ण दक्षता हासिल कर ली है।</div></div></div>';
      vis = s.viz && VIZ[s.viz] ? VIZ[s.viz]() : vizCard("trophy");
      break;
    default:
      title = '<h2 data-lang>'+esc(s.t||"")+'</h2>'; txt = '<p class="b" data-lang>'+esc(s.b||"")+'</p>';
      vis = vizCard("default");
  }

  card.innerHTML =
    '<div class="head">'+title+'</div>' +
    '<div class="txt">'+txt+'</div>' +
    '<div class="visual" id="vis">'+(hasSim ? simViz(s.sim, initSim(s.sim)) : vis)+'</div>' +
    '<div class="ctl">'+(hasSim ? ctl : '')+'</div>';

  lang(card);
  if(s.kind === "check") wireCheck(s);
  if(hasSim) wireSim(s.sim);
  prog.style.width = Math.round(((i+1)/SLIDES.length)*100)+"%";
  const chip = document.getElementById("chip");
  if(chip) chip.textContent = (i+1) + " / " + SLIDES.length;
  prevB.disabled = i === 0;
  nextB.textContent = (i === SLIDES.length-1) ? "Finish ✓" : "Next ▶";
}

function wireCheck(s){
  card.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = +el.dataset.k;
      const fb = document.getElementById("fb");
      card.querySelectorAll(".opt").forEach(o=>o.classList.remove("ok","no"));
      const right = (k === s.ans);
      if(right){ el.classList.add("ok"); fb.className="fb show ok"; }
      else { el.classList.add("no"); card.querySelectorAll(".opt")[s.ans].classList.add("ok");
             fb.className="fb show no"; }
      fb.innerHTML = T(s.why||(right?"Correct!":"Not quite."));
      lang(fb);
    });
  });
}

prevB.addEventListener("click", ()=>{ if(i>0){ i--; render(); } });
nextB.addEventListener("click", ()=>{ if(i<SLIDES.length-1){ i++; render(); } });
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") nextB.click();
  if(e.key==="ArrowLeft") prevB.click();
});
hiAll.addEventListener("click", ()=>{
  allHi = !allHi;
  hiAll.style.background = allHi ? "rgba(255,194,71,.18)" : "transparent";
  hiAll.style.color = allHi ? "var(--gold)" : "";
  document.querySelectorAll(".hiBtn").forEach(b=>{
    const on = b.classList.contains("on");
    if(allHi && !on) b.click();
    if(!allHi && on) b.click();
  });
});

render();
</script>
