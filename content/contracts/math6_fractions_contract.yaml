title: Fractions — Understanding Parts and Equivalency
subject: Mathematics
class: Class 6
textbook_source: NCERT Class 6 Mathematics Chapter 7 (Fractions) & State Board Curriculum
learning_objectives:
  - Identify a fraction as equal parts of a whole quantity or collection.
  - Understand numerator (number of parts taken) and denominator (total equal parts).
  - Recognize and generate equivalent fractions by multiplying or dividing numerator and denominator by the same non-zero number.
  - Distinguish between Proper, Improper, and Mixed fractions.
  - Represent fractions on a number line by partitioning unit intervals.
  - Add and subtract fractions with like and unlike denominators using LCM.

lle_vocabulary:
  - word: Fraction
    hindi: भिन्न
    phonics: Bhin-na
    meaning: A numerical quantity that represents part of a whole or set.
  - word: Numerator
    hindi: अंश
    phonics: Ansh
    meaning: The top number in a fraction showing how many equal parts are selected.
  - word: Denominator
    hindi: हर
    phonics: Har
    meaning: The bottom number in a fraction showing the total equal parts that make up the whole.
  - word: Whole
    hindi: पूर्ण
    phonics: Poor-na
    meaning: The complete object, shape, or group before division into equal parts.
  - word: Equivalent Fraction
    hindi: तुल्य भिन्न
    phonics: Tul-ya Bhin-na
    meaning: Fractions that look different but represent the exact same value or region.
  - word: Proper Fraction
    hindi: उचित भिन्न
    phonics: U-chit Bhin-na
    meaning: A fraction where numerator is strictly smaller than denominator (less than 1).
  - word: Improper Fraction
    hindi: अनुचित भिन्न
    phonics: A-nu-chit Bhin-na
    meaning: A fraction where numerator is greater than or equal to denominator (1 or more).
  - word: Mixed Fraction
    hindi: मिश्रित भिन्न
    phonics: Mish-rit Bhin-na
    meaning: A number expressed as a combination of a whole number and a proper fraction.
  - word: Simplest Form
    hindi: सरलतम रूप
    phonics: Sa-ral-tam Roop
    meaning: A fraction where numerator and denominator share no common factor other than 1.
  - word: Like Fractions
    hindi: समान भिन्न
    phonics: Sa-maan Bhin-na
    meaning: Fractions that have the exact same denominator.

