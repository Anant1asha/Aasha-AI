scaffolding_hints_schema:
  H1: Visual hook drawing attention to the shaded parts vs total parts.
  H2: Conceptual definition of numerator and denominator with Hindi LLE phonics.
  H3: Mathematical relationship or scaling formula (e.g. multiply both top and bottom by 2).
  H4: Concrete intermediate calculation step with zero final answer spoilers.

interactions:
  - type: multiple_choice
    id: q-parts-1
    question: "In the fraction 3/8, what does the number 8 represent?"
    options:
      - text: "The total number of equal parts that make up the whole (Denominator / हर)"
        isCorrect: true
        feedback: "Correct! The denominator (हर) 8 shows the total equal parts."
      - text: "The number of parts that are shaded or selected"
        misconceptionId: confused_numerator_denominator
        m: "Selected the top number meaning (numerator) instead of total equal parts."
      - text: "The remaining unshaded parts only"
        misconceptionId: unshaded_parts_confusion
        m: "Counted only the unshaded parts rather than the total equal parts."
      - text: "The sum of 3 and 8"
        misconceptionId: general_addition_confusion
        m: "Added numerator and denominator together instead of identifying denominator function."
    hints:
      H1: "Look at the bottom number of the fraction."
      H2: "The bottom number is called the Denominator (हर - Har). It names the total equal divisions."
      H3: "Top number = parts taken (अंश); Bottom number = total equal parts (हर)."
      H4: "Count all parts in 1 whole unit: there are 8 equal pieces in total."

  - type: multiple_choice
    id: q-equiv-1
    question: "Which fraction is equivalent to 1/2?"
    options:
      - text: "3/6"
        isCorrect: true
        feedback: "Correct! Multiplying numerator and denominator of 1/2 by 3 gives 3/6."
      - text: "2/3"
        misconceptionId: added_one_to_both
        m: "Added 1 to numerator and denominator instead of multiplying by same factor."
      - text: "1/4"
        misconceptionId: same_numerator_smaller_value
        m: "Assumed same numerator means equal value, ignoring denominator change."
      - text: "2/5"
        misconceptionId: arbitrary_ratio
        m: "Chose an arbitrary fraction without checking multiplicative scaling."
    hints:
      H1: "Equivalent fractions cover the exact same area or amount."
      H2: "To find equivalent fractions, multiply BOTH top (अंश) and bottom (हर) by the same non-zero number."
      H3: "Multiply 1 by 3, and multiply 2 by 3."
      H4: "1 * 3 = 3, and 2 * 3 = 6, yielding 3/6."

  - type: multiple_choice
    id: q-add-1
    question: "What is the result of adding 2/7 + 3/7?"
    options:
      - text: "5/7"
        isCorrect: true
        feedback: "Correct! When denominators are equal, add numerators: 2 + 3 = 5, keeping denominator 7."
      - text: "5/14"
        misconceptionId: added_denominators
        m: "Added the denominators together (7 + 7 = 14) instead of keeping slice size constant."
      - text: "6/7"
        misconceptionId: multiplied_numerators
        m: "Multiplied numerators instead of adding them."
      - text: "1/7"
        misconceptionId: subtracted_numerators
        m: "Subtracted numerators instead of adding."
    hints:
      H1: "Both fractions have the same size slices (sevenths)."
      H2: "For like fractions (समान भिन्न), keep the denominator constant and add only the top numbers."
      H3: "Add numerators: 2 + 3."
      H4: "2 + 3 = 5, placed over the common denominator 7."
