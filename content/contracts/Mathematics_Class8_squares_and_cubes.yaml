curriculum_intent:
  core_concepts:
    - id: "concept_1"
      title: "Queen Ratnamanjuri's Lockers & Geometric Dot Grids"
      hook: "Why do only 10 out of 100 lockers remain open? Because square numbers have an odd number of factors!"
      why_type: "Conceptual"
      explanation_student_layer: "A square number represents the area of a square whose side is a whole number of units."
      academic_precision_layer: "A natural number n is a square number (or perfect square) if n = m² for some natural number m."
    - id: "concept_2"
      title: "Units Digits, Parity & Trailing Zeros"
      hook: "Can 2048 or 1057 ever be a perfect square? No! Ending in 2, 3, 7, or 8 rules it out instantly."
      why_type: "Structural"
      explanation_student_layer: "Every integer square must end in 0, 1, 4, 5, 6, or 9, and trailing zeros always come in pairs."
      academic_precision_layer: "For any base integer b, b² mod 10 in {0, 1, 4, 5, 6, 9}. Trailing zeros count of b² is 2k where k is trailing zeros count of b."
    - id: "concept_3"
      title: "Square Roots: Inverted L Gnomon & Prime Factor Pairing"
      hook: "How does adding odd numbers like 1 + 3 + 5 build larger and larger squares?"
      why_type: "Procedural & Geometric"
      explanation_student_layer: "The sum of the first n odd numbers is n². Repeated subtraction of odd numbers finds the square root."
      academic_precision_layer: "Sum_{i=1}^n (2i - 1) = n². Prime factorisation yields sqrt(N) by pairing identical prime factors."
    - id: "concept_4"
      title: "Cubic Numbers & 3D Isometric Stacking"
      hook: "How many unit cubes build a solid cube of edge 4? 4 layers of 16 cubes = 64 cubes!"
      why_type: "Geometric & Structural"
      explanation_student_layer: "A cubic number represents the volume of a solid cube whose edge is an integer."
      academic_precision_layer: "Volume V = s³. Perfect cubes have prime exponents divisible by 3 and trailing zeros as multiples of 3."
    - id: "concept_5"
      title: "Cube Roots, Taxicab Numbers & Difference Calculus"
      hook: "Why did Ramanujan call 1729 the smallest number expressible as the sum of two cubes in two different ways?"
      why_type: "Inquiry & Algebraic"
      explanation_student_layer: "1729 = 1³ + 12³ = 9³ + 10³. Cube roots are found by splitting prime factors into triplets."
      academic_precision_layer: "Third successive differences Delta³(n³) = 6 = 3!. Cube roots extracted by 3-digit grouping estimation."

misconceptions:
  - id: "misc_linearization"
    trigger_error: "Confusing squaring with doubling (e.g. 5² = 10 rather than 25) or cubing with tripling (e.g. 2³ = 6)"
    feedback_4_tier_hints:
      hint_1_attention: "Look closely at the exponent 2 or 3 above the base."
      hint_2_relationship: "The exponent denotes repeated multiplication of the base by itself, not multiplication by the exponent value."
      hint_3_strategy: "Write out the full repeated product: base multiplied by base."
      hint_4_procedure: "Calculate (n * n) for square area or (n * n * n) for cube volume."
    zero_spoiler_explanation: "Doubled or tripled the base rather than evaluating repeated multiplication by itself."

  - id: "misc_radical_division"
    trigger_error: "Treating square root as dividing by 2 or cube root as dividing by 3"
    feedback_4_tier_hints:
      hint_1_attention: "Recall what side length of a square produces this total area."
      hint_2_relationship: "The square root asks what value multiplied by itself reproduces the radicand."
      hint_3_strategy: "Test if your candidate squared matches the number under the radical sign."
      hint_4_procedure: "Group the prime factors into identical pairs or triplets."
    zero_spoiler_explanation: "Divided the radicand by the root index rather than finding the inverse power factor."

  - id: "misc_units_converse"
    trigger_error: "Assuming that ending in 0, 1, 4, 5, 6, or 9 guarantees a number is a perfect square"
    feedback_4_tier_hints:
      hint_1_attention: "Test numbers like 16 vs 26: both end in 6, but is 26 a square?"
      hint_2_relationship: "Units digits rule out non-squares ending in 2, 3, 7, 8, but do not prove a number is square."
      hint_3_strategy: "Test the candidate using prime factorisation or interval bounding."
      hint_4_procedure: "Bracket the number between two consecutive decade squares."
    zero_spoiler_explanation: "Assumed ending in a valid square units digit guarantees the integer is a square."

  - id: "misc_zero_count"
    trigger_error: "Adding single zeros or miscounting trailing zeros in squares and cubes"
    feedback_4_tier_hints:
      hint_1_attention: "Observe what occurs to powers of ten under exponentiation."
      hint_2_relationship: "Every zero in the base pairs with another zero when squared, doubling the zero count."
      hint_3_strategy: "Multiply the base trailing zero count by 2 for squares and by 3 for cubes."
      hint_4_procedure: "Separate the non-zero integer base from the powers of ten."
    zero_spoiler_explanation: "Miscounted trailing zeros by adding rather than multiplying the exponent of ten."

  - id: "misc_cube_factor_parity"
    trigger_error: "Believing that cube numbers have an odd number of factors because square numbers do"
    feedback_4_tier_hints:
      hint_1_attention: "Count the total factors of a small cube such as 8: 1, 2, 4, 8."
      hint_2_relationship: "Only numbers with identical partner factors a = b have an odd number of factors."
      hint_3_strategy: "Examine whether prime exponents plus one multiply to an even or odd product."
      hint_4_procedure: "Notice that 8 has four factors, which represents an even count."
    zero_spoiler_explanation: "Overgeneralized the odd factor count theorem of squares to cubic powers."

