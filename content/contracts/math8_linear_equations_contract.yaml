# AASHA Section 24 Reusable Content Contract
# Chapter: Linear Equations in One Variable (Class 8 Mathematics)
# Source: NCERT Class 8 Mathematics Chapter 2 & State Board Curriculum
# Universal Scope: Any Board, Any Class, Any Subject
# Reuse Mandate: NEVER BUILD FROM SCRATCH

title: "Linear Equations in One Variable — Balancing the Unknown"
subject: "Mathematics"
class: "Class 8"
textbook_source: "NCERT Class 8 Mathematics Chapter 2 & NEP-2020 Universal Teaching System"
learning_objectives:
  - "Understand the definition and balance structure of a linear algebraic equation in one variable."
  - "Apply inverse operations to solve linear equations having expressions on one side and numbers on the other."
  - "Solve linear equations having variables on both sides by transposing terms systematically."
  - "Translate contextual word problems (ages, perimeter, number puzzles) into balanced linear equations and verify solutions."

lle_vocabulary:
  - word: "Linear Equation"
    hindi: "रैखिक समीकरण"
    phonics: "Rai-khik Sa-mee-ka-ran"
    meaning: "An algebraic equation where the highest power of the variable is strictly 1 (degree 1)."
  - word: "Variable"
    hindi: "चर"
    phonics: "Char"
    meaning: "An unknown symbol (such as x, y, or z) that represents an unspecified numerical quantity."
  - word: "Constant"
    hindi: "अचर"
    phonics: "A-char"
    meaning: "A fixed numerical value that does not alter its quantity."
  - word: "Equality"
    hindi: "समानता / समता"
    phonics: "Sam-ta"
    meaning: "The relationship of balance expressed by the equals sign (=) indicating both sides have the exact same value."
  - word: "Transposition"
    hindi: "पक्षांतरण"
    phonics: "Pak-shaan-ta-ran"
    meaning: "Moving an algebraic term from one side of the equation to the other while reversing its mathematical operation."
  - word: "Solution"
    hindi: "हल / मूल"
    phonics: "Hal / Mool"
    meaning: "The specific numerical value of the variable that satisfies and balances the equation."
  - word: "Left Hand Side"
    hindi: "बायाँ पक्ष"
    phonics: "Baayan Paksh"
    meaning: "The complete algebraic expression residing to the left of the equals sign (LHS)."
  - word: "Right Hand Side"
    hindi: "दायाँ पक्ष"
    phonics: "Daayan Paksh"
    meaning: "The complete algebraic expression residing to the right of the equals sign (RHS)."
  - word: "Inverse Operation"
    hindi: "प्रतिलोम संक्रिया"
    phonics: "Prati-lom San-kri-ya"
    meaning: "An opposing mathematical operation that undoes an action (addition undoes subtraction; division undoes multiplication)."
  - word: "Coefficient"
    hindi: "गुणांक"
    phonics: "Gu-naank"
    meaning: "The numerical multiplier placed immediately in front of a variable (e.g. 5 in 5x)."

foundations_and_sims:
  game_engines:
    - id: "F26"
      name: "Balance Scale Equation Solver"
      type: "tactile_balance_scale"
      role: "Interactive physical two-pan balance scale, weight dragging, inverse operations toolbar, and auto-leveling."
    - id: "F01"
      name: "Escape Run Equation Runner"
      type: "speed_runner"
      role: "Obstacle-dodging speed equation solver matching unknown weights."
    - id: "F06"
      name: "MathFluency Diagnostic Engine"
      type: "adaptive_practice"
      role: "Mastery-gated 3-tier quiz with 4-tier progressive hints and misconception diagnosis."

scaffolding_hints_schema:
  H1: "Visual hook drawing attention to maintaining balance on both pans of the balance scale."
  H2: "Conceptual rule of equality: whatever operation is performed on LHS must be performed on RHS."
  H3: "Transposition strategy: group variable terms on one side and constant numbers on the opposite side."
  H4: "Step-by-step intermediate equation without revealing the final isolated variable value."

interactions:
  - type: "multiple_choice"
    id: "q-lin-warm-1"
    tier: "warm_up"
    question: "In the linear equation 2x + 7 = 15, what is the first balanced operation to isolate the term with the variable x?"
    options:
      - text: "Subtract 7 from both sides of the equation."
        isCorrect: true
        feedback: "Correct! Subtracting 7 from both sides undoes the +7 addition while keeping the scale balanced."
      - text: "Add 7 to both sides of the equation."
        misconceptionId: "misc_same_operation_error"
        m: "Repeated the existing operation (+7) instead of applying the inverse operation (-7) to isolate the term."
      - text: "Divide only the left side by 2."
        misconceptionId: "misc_unbalanced_side_error"
        m: "Applied an operation to only one side of the equation, breaking the balance of equality."
      - text: "Multiply both sides by 7."
        misconceptionId: "misc_unrelated_multiplication"
        m: "Multiplied by a constant term instead of using inverse operations to isolate the variable."
    hints:
      H1: "Look at the constant number +7 on the left side alongside 2x."
      H2: "To eliminate a positive constant (+7), apply its inverse operation."
      H3: "To maintain perfect balance across the equals sign, perform the inverse on both sides."
      H4: "Calculate (2x + 7 - 7 = 15 - 7) to discover the simplified balanced equation."

  - type: "multiple_choice"
    id: "q-lin-deep-2"
    tier: "deep_dive"
    question: "Solve the linear equation with variables on both sides: 5x - 3 = 2x + 9. What is the value of x?"
    options:
      - text: "x = 4"
        isCorrect: true
        feedback: "Correct! Transposing 2x yields 3x - 3 = 9; then adding 3 yields 3x = 12; dividing by 3 gives x = 4."
      - text: "x = 2"
        misconceptionId: "misc_transposition_sign_error"
        m: "Added 2x to 5x instead of subtracting it when transposing across the equals sign."
      - text: "x = 6"
        misconceptionId: "misc_constant_subtraction_error"
        m: "Subtracted 3 from 9 instead of adding 3 when transposing the negative constant across the equals sign."
      - text: "x = 12"
        misconceptionId: "misc_forgot_coefficient_division"
        m: "Found 3x = 12 but forgot to divide both sides by the variable coefficient 3."
    hints:
      H1: "First, collect the variable terms on the left: subtract 2x from both sides."
      H2: "Next, collect the constant numbers on the right: add 3 to both sides."
      H3: "This yields a simplified single-step equation: 3x = 12."
      H4: "Divide 12 by the coefficient 3 to find the final value of x."

  - type: "multiple_choice"
    id: "q-lin-boss-3"
    tier: "boss_challenge"
    question: "The perimeter of a rectangular field is 80 meters. Its length is 4 meters more than its width. Which balanced equation models this problem, where w represents the width?"
    options:
      - text: "2(w + (w + 4)) = 80, which simplifies to 4w + 8 = 80"
        isCorrect: true
        feedback: "Correct! Perimeter is 2(length + width) = 2(w + (w + 4)) = 2(2w + 4) = 4w + 8 = 80."
      - text: "w + (w + 4) = 80, which simplifies to 2w + 4 = 80"
        misconceptionId: "misc_half_perimeter_error"
        m: "Equated only length plus width to the full perimeter, forgetting that a rectangle has four boundary sides."
      - text: "w * (w + 4) = 80"
        misconceptionId: "misc_area_perimeter_confusion"
        m: "Multiplied length and width to find perimeter, confusing perimeter (boundary length) with area."
      - text: "2w + 4 = 80"
        misconceptionId: "misc_unbracketed_multiplier"
        m: "Multiplied only the width by 2 instead of scaling both dimensions by 2 in the perimeter formula."
    hints:
      H1: "Recall the geometric perimeter formula for a rectangle: Perimeter = 2 * (Length + Width)."
      H2: "Express the length algebraically in terms of width w: Length = w + 4."
      H3: "Substitute Length into the perimeter equation: 2 * ((w + 4) + w) = 80."
      H4: "Combine inside parentheses: 2w + 4; then distribute 2 across both terms."
