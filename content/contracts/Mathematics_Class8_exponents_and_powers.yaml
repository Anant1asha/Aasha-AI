curriculum_intent:
  core_concepts:
    - id: "concept_1"
      title: "Exponential Notation and Sign Rules"
      hook: "How can repeated multiplication of very large or tiny quantities be written without writing dozens of factors?"
      why_type: "Conceptual"
      explanation_student_layer: "When a number multiplies itself repeatedly, we write the number once (base) and show how many times it multiplies with a raised count (exponent). An odd number of negative factors stays negative, while an even count turns positive."
      academic_precision_layer: "In a^n, a in Q is the base and n in Z is the exponent. (-1)^odd = -1, (-1)^even = 1, and (p/q)^n = p^n / q^n."

    - id: "concept_2"
      title: "Negative Integral Exponents and Reciprocals"
      hook: "What does an exponent mean when it becomes negative? Does the number become negative?"
      why_type: "Structural"
      explanation_student_layer: "A positive exponent means repeated multiplication; decreasing the power divides by the base. Passing below zero means repeated division — the number flips into its reciprocal fraction without changing sign!"
      academic_precision_layer: "For any non-zero rational base a, a^(-n) = 1 / a^n. For any fraction, (p/q)^(-n) = (q/p)^n. a^(-n) is the multiplicative inverse of a^n."

    - id: "concept_3"
      title: "The Five Fundamental Laws of Exponents"
      hook: "Why do powers add when like bases multiply, but subtract when they divide?"
      why_type: "Algebraic"
      explanation_student_layer: "Like bases group their factors together: multiplying factors adds factor counts, and dividing factors cancels them out one-by-one."
      academic_precision_layer: "Rule 1: a^m * a^n = a^(m+n); Rule 2: a^m / a^n = a^(m-n); Rule 3: (a^m)^n = a^(mn); Rule 4: a^m * b^m = (ab)^m; Rule 5: a^0 = 1 for a != 0."

    - id: "concept_4"
      title: "Solving Exponential Equations"
      hook: "How do we isolate an unknown variable when it is trapped inside the power exponent?"
      why_type: "Analytical"
      explanation_student_layer: "When both sides of an equation have the exact same base, their exponents must balance equally like weights on a scale."
      academic_precision_layer: "If a^x = a^y where a is not in {-1, 0, 1}, then x = y. Unknown powers are isolated by rewriting terms with common prime bases."

    - id: "concept_5"
      title: "Standard Form and Scientific Notation"
      hook: "How do astronomers compare star distances and microbiologists measure viruses without making errors from long strings of zeros?"
      why_type: "Application"
      explanation_student_layer: "Scientific notation normalizes every number into a single whole digit followed by decimals, multiplied by an exponent of 10."
      academic_precision_layer: "Normalized form k * 10^n where 1 <= k < 10 and n in Z. Rightward decimal shift yields negative n; leftward shift yields positive n."

misconceptions:
  - id: "misc_base_negation"
    name: "Base Negation Error"
    trigger_error: "Confusing negative exponent with a negative base sign"
    feedback_4_tier_hints:
      hint_1_attention: "Look at whether the negative sign is attached to the base or the exponent."
      hint_2_relationship: "A negative exponent represents division and fraction flipping, not subtraction."
      hint_3_strategy: "Apply the reciprocal rule: a^(-n) = 1 / a^n."
      hint_4_procedure: "Invert the fraction or place the base in the denominator with a positive exponent."
    zero_spoiler_explanation: "A negative sign in an exponent designates reciprocal division, not an arithmetic negative sign on the base."

  - id: "misc_base_mul"
    name: "Base Multiplication Confusion"
    trigger_error: "Multiplying like bases during the product law (e.g. 2^3 * 2^4 = 4^7)"
    feedback_4_tier_hints:
      hint_1_attention: "Observe the bases in both factors: are they identical?"
      hint_2_relationship: "When like bases multiply, the base represents the unchanging factor unit."
      hint_3_strategy: "Recall the product law: a^m * a^n = a^(m+n)."
      hint_4_procedure: "Keep the common base unchanged and sum the integer exponents."
    zero_spoiler_explanation: "When identical bases are multiplied, the base represents the unchanging factor; only factor counts combine."

  - id: "misc_quotient_div"
    name: "Quotient Exponent Division"
    trigger_error: "Dividing exponents during quotient law instead of subtracting them"
    feedback_4_tier_hints:
      hint_1_attention: "Focus on how division of like bases cancels repeated factors."
      hint_2_relationship: "Each factor in the denominator cancels one matching factor in the numerator."
      hint_3_strategy: "Apply the quotient rule: a^m / a^n = a^(m-n)."
      hint_4_procedure: "Subtract the bottom exponent from the top exponent."
    zero_spoiler_explanation: "Division of like bases cancels common factors; therefore, denominator exponent count subtracts from numerator count."

  - id: "misc_zero_power"
    name: "Zero Power Value Confusion"
    trigger_error: "Assuming non-zero base to power zero equals zero or equals the base"
    feedback_4_tier_hints:
      hint_1_attention: "Recall what happens when any non-zero number is divided by itself."
      hint_2_relationship: "By quotient rule, a^m / a^m = a^(m-m) = a^0."
      hint_3_strategy: "Any quantity divided by itself equals the multiplicative identity."
      hint_4_procedure: "Evaluate any non-zero base with exponent zero directly to 1."
    zero_spoiler_explanation: "Dividing any non-zero quantity by itself yields an exponent difference of zero and an arithmetic value of 1."

  - id: "misc_non_normalized"
    name: "Non-Normalized Coefficient Error"
    trigger_error: "Leaving multiple non-zero digits before the decimal point in standard form"
    feedback_4_tier_hints:
      hint_1_attention: "Inspect how many non-zero digits appear to the left of the decimal point."
      hint_2_relationship: "Standard scientific form requires the leading coefficient to be strictly between 1 and 10."
      hint_3_strategy: "Shift the decimal point until exactly one non-zero digit remains on the left."
      hint_4_procedure: "Count every position shifted to adjust the power of 10."
    zero_spoiler_explanation: "Standard scientific notation requires the leading decimal coefficient to contain strictly one non-zero digit to the left of the point."

