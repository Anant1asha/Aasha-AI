# AASHA Section 24 Reusable Content Contract
# Chapter: The Other Side of Zero: Integers (Class 6 Mathematics)
# Source: NCERT Class 6 Mathematics (Ganita Prakash) Chapter 10 & State Board Curriculum
# Universal Scope: Any Board, Any Class, Any Subject
# Reuse Mandate: NEVER BUILD FROM SCRATCH

title: "The Other Side of Zero: Integers — Understanding Directed Numbers"
subject: "Mathematics"
class: "Class 6"
textbook_source: "NCERT Class 6 Mathematics (Ganita Prakash) Chapter 10 & NEP-2020 Universal Teaching System"
learning_objectives:
  - "Understand the necessity of negative numbers to represent opposite real-world quantities (depth, debt, temperature below zero)."
  - "Represent positive integers, negative integers, and zero on an infinite horizontal number line."
  - "Compare and order integers using number line positions (further right is always strictly greater)."
  - "Understand additive inverses (opposite numbers) and their geometric cancellation around the zero origin."
  - "Perform addition and subtraction of integers using directed movement along the number line."

lle_vocabulary:
  - word: "Integer"
    hindi: "पूर्णांक"
    phonics: "Poor-naank"
    meaning: "A complete whole number that can be positive, negative, or zero (..., -3, -2, -1, 0, 1, 2, 3, ...)."
  - word: "Positive Number"
    hindi: "धनात्मक संख्या"
    phonics: "Dha-naat-mak Sankhya"
    meaning: "A number strictly greater than zero, located to the right of zero on the number line."
  - word: "Negative Number"
    hindi: "ऋणात्मक संख्या"
    phonics: "Rin-aat-mak Sankhya"
    meaning: "A number strictly less than zero, carrying a minus sign (-), located to the left of zero."
  - word: "Zero"
    hindi: "शून्य"
    phonics: "Shoon-ya"
    meaning: "The neutral origin on the number line; it is neither positive nor negative."
  - word: "Number Line"
    hindi: "संख्या रेखा"
    phonics: "Sankhya Rekha"
    meaning: "A straight continuous line with numbers marked at equal intervals extending infinitely in both directions."
  - word: "Opposite Number"
    hindi: "विपरीत संख्या"
    phonics: "Vi-pa-reet Sankhya"
    meaning: "A number at the exact same distance from zero on the opposite side (e.g. +4 and -4)."
  - word: "Additive Inverse"
    hindi: "योज्य प्रतिलोम"
    phonics: "Yoj-ya Prati-lom"
    meaning: "The number that yields zero when added to a given number (e.g. the additive inverse of 5 is -5)."
  - word: "Predecessor"
    hindi: "पूर्ववर्ती"
    phonics: "Poorv-var-tee"
    meaning: "The number that comes immediately before a given number on the number line (one unit to the left, n - 1)."
  - word: "Successor"
    hindi: "परवर्ती"
    phonics: "Par-var-tee"
    meaning: "The number that comes immediately after a given number on the number line (one unit to the right, n + 1)."
  - word: "Absolute Value"
    hindi: "निरपेक्ष मान"
    phonics: "Nir-peksh Maan"
    meaning: "The actual non-negative distance of a number from zero regardless of direction."

foundations_and_sims:
  game_engines:
    - id: "F25"
      name: "Number-Line Hunter"
      type: "tactile_number_line"
      role: "Interactive directed jumps, frog steps, opposite reflection around 0, and dynamic integer addition/subtraction."
    - id: "F01"
      name: "Escape Run Sub-Zero Runner"
      type: "speed_runner"
      role: "Rapid integer comparison obstacle course navigating above and below zero."
    - id: "F06"
      name: "MathFluency Diagnostic Engine"
      type: "adaptive_practice"
      role: "Mastery-gated 3-tier quiz with 4-tier progressive hints and misconception diagnosis."

scaffolding_hints_schema:
  H1: "Visual hook drawing attention to relative direction from zero on the horizontal number line."
  H2: "Conceptual definition of positive (rightward) vs negative (leftward) orientation."
  H3: "Mathematical rule: moving right adds positive values; moving left moves towards lesser values."
  H4: "Concrete step-by-step vector hop calculation with zero final answer spoilers."

interactions:
  - type: "multiple_choice"
    id: "q-int-comp-1"
    tier: "warm_up"
    question: "Which of the following statements correctly compares the integers -7 and -2?"
    options:
      - text: "-2 is greater than -7 because -2 lies further to the right on the number line."
        isCorrect: true
        feedback: "Correct! On the number line, numbers further to the right are always strictly greater."
      - text: "-7 is greater than -2 because 7 is larger than 2."
        misconceptionId: "misc_magnitude_bias"
        m: "Compared absolute numeral sizes without accounting for the negative sign and position relative to zero."
      - text: "-7 and -2 have the exact same value because both are negative."
        misconceptionId: "misc_sign_undifferentiated"
        m: "Assumed all negative numbers share identical value regardless of distance from zero."
      - text: "Neither number can be compared because negative numbers have no order."
        misconceptionId: "misc_no_order_concept"
        m: "Assumed negative integers cannot be systematically ordered on the number line."
    hints:
      H1: "Locate zero first, then look at where -2 and -7 sit on the left side."
      H2: "Remember: as you move rightward along the number line, numbers always increase."
      H3: "Which integer sits closer to zero and further right?"
      H4: "Notice that -2 is 5 steps to the right of -7 on the horizontal axis."

  - type: "multiple_choice"
    id: "q-int-add-2"
    tier: "deep_dive"
    question: "A submarine is cruising at a depth of 6 meters below sea level (-6 m). It then dives 4 meters deeper. What is its new position relative to sea level?"
    options:
      - text: "-10 meters (10 meters below sea level)"
        isCorrect: true
        feedback: "Correct! Starting at -6 and diving 4 meters deeper moves further left/down to -10."
      - text: "-2 meters (2 meters below sea level)"
        misconceptionId: "misc_subtraction_addition_confusion"
        m: "Added 4 upwards towards sea level instead of continuing deeper downward."
      - text: "+10 meters (10 meters above sea level)"
        misconceptionId: "misc_sign_loss"
        m: "Dropped the negative sign, confusing depth below sea level with altitude above."
      - text: "+2 meters (2 meters above sea level)"
        misconceptionId: "misc_inverted_operation"
        m: "Inverted both the direction of the dive and the sign of the elevation."
    hints:
      H1: "Visualize depth below sea level as negative numbers on a vertical line."
      H2: "Starting at -6, does diving deeper mean going further down or coming up?"
      H3: "Diving deeper represents adding more negative depth: (-6) + (-4)."
      H4: "Start at -6 on the axis and step 4 units further in the negative direction."

  - type: "multiple_choice"
    id: "q-int-boss-3"
    tier: "boss_challenge"
    question: "What is the value of (-8) - (-5) evaluated using directed steps?"
    options:
      - text: "-3"
        isCorrect: true
        feedback: "Correct! Subtracting a negative number is equivalent to adding its opposite: (-8) + 5 = -3."
      - text: "-13"
        misconceptionId: "misc_double_negative_subtraction"
        m: "Subtracted 5 further to the left instead of reversing direction when subtracting a negative."
      - text: "+3"
        misconceptionId: "misc_sign_inversion_boss"
        m: "Inverted the sign of the larger magnitude number."
      - text: "+13"
        misconceptionId: "misc_all_positive_bias"
        m: "Treated all negative numbers as positive during calculation."
    hints:
      H1: "Pay close attention to the operation: you are subtracting a negative quantity."
      H2: "Subtracting a negative quantity is equivalent to adding its positive opposite."
      H3: "Rewrite the expression by transforming the subtraction of -5 into addition of +5."
      H4: "Compute the sum of -8 and +5 by starting at -8 and moving 5 units to the right."
