<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aasha Learn — Direct and Inverse Proportion</title>
<style>
:root{
  --bg0:#070c12; --bg1:#0d1620; --panel:#121c27; --panel2:#16222f;
  --ink:#eef5fa; --ink2:#c9d9e6; --muted:#8ba2b6;
  --teal:#31e6c4; --teal2:#19b79e; --gold:#ffc247; --red:#ff5f78; --green:#4ade80; --blue:#63a9ff;
  --line:rgba(125,185,225,.14); --line2:rgba(125,185,225,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(49,230,196,.10), transparent 62%),
    radial-gradient(900px 520px at 6% 108%, rgba(255,194,71,.08), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 60%);
  background-attachment:fixed}
.app{max-width:1260px;margin:0 auto;padding:10px 12px 10px;display:flex;flex-direction:column;
  gap:9px;height:100dvh}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.logo{width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--teal),var(--gold));
  display:grid;place-items:center;color:#06231f;font-weight:900;font-size:13px}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1}
.brand em{font-style:normal;color:var(--teal)}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-top:2px}
.chip{margin-left:auto;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;font-weight:600}

/* ---------- progress ---------- */
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s cubic-bezier(.4,0,.2,1)}

/* ---------- card ---------- */
.card{flex:1 1 auto;min-height:0;overflow:hidden;border-radius:18px;
  background:linear-gradient(168deg,var(--panel2),var(--panel) 55%,#101a24);
  border:1px solid var(--line2);
  box-shadow:0 18px 44px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.045);
  padding:15px 16px;display:grid;gap:11px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"head" "txt" "vis" "ctl"}
.card .head{grid-area:head}
.card .txt{grid-area:txt;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px}
.card .visual{grid-area:vis;min-height:0;overflow:hidden;border-radius:14px;
  background:radial-gradient(120% 100% at 50% 0%, rgba(49,230,196,.07), rgba(10,17,24,.55));
  border:1px solid rgba(125,185,225,.10);display:grid;place-items:center;padding:4px}
.card .visual svg{width:100%;height:100%;display:block}
.card .ctl{grid-area:ctl}

@media (min-width:940px){
  .card.split{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"head head" "txt vis" "txt ctl"}
  .card.split .txt{padding-right:4px}
}

/* ---------- type ---------- */
.kindrow{display:flex;align-items:center;gap:9px;flex:0 0 auto;margin-bottom:5px}
.kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
  color:var(--teal);background:rgba(49,230,196,.10);border:1px solid rgba(49,230,196,.22);
  padding:3px 9px;border-radius:999px}
h1{font-size:clamp(23px,3.2vw,33px);line-height:1.2;margin:0;letter-spacing:-.015em;font-weight:800}
h2{font-size:clamp(20px,2.7vw,27px);line-height:1.24;margin:0;letter-spacing:-.01em;font-weight:800}
p.b{font-size:clamp(17px,2.05vw,21px);line-height:1.62;margin:0;color:var(--ink2)}
.sub{color:var(--muted);font-size:clamp(15px,1.75vw,17px);margin:0;font-weight:600}
.em{vertical-align:-5px;margin-right:6px}

/* ---------- footer ---------- */
.tapline{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.taphint{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.taphint b{color:var(--gold);font-weight:700}
@media (max-width:540px){.taphint{font-size:11px}}

button{font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;border-radius:12px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);
  padding:10px 18px;min-height:46px;transition:transform .08s ease, background .15s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.3;cursor:default}
button.pri{background:linear-gradient(180deg,#37ebca,#16a98f);color:#052a24;border:0;font-weight:800;
  box-shadow:0 8px 20px -8px rgba(49,230,196,.75)}
button.gho{background:transparent}

/* quiet Hindi mark instead of a word pill */
.hiWrap{display:inline}
.hiBox{display:block}
.hiBox[hidden]{display:none}
.hiBtn{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;min-height:0;padding:0;margin-left:6px;vertical-align:3px;
  font-size:11px;font-weight:800;line-height:1;border-radius:50%;
  color:var(--gold);background:rgba(255,194,71,.10);
  border:1px solid rgba(255,194,71,.30);opacity:.8}
.hiBtn:hover{opacity:1;background:rgba(255,194,71,.2)}
.hiBtn.on{background:rgba(255,194,71,.9);color:#2a1d00;border-color:transparent}
.hiBox{margin-top:7px;padding:9px 12px;border-left:3px solid var(--gold);
  background:linear-gradient(90deg,rgba(255,194,71,.11),rgba(255,194,71,.03));
  border-radius:0 10px 10px 0;font-size:clamp(15px,1.8vw,18px);line-height:1.6;color:#ffe6a8}

/* ---------- tap target ---------- */
.tapable{cursor:pointer;border-bottom:1.5px dotted rgba(49,230,196,.55);transition:background .12s}
.tapable:hover{background:rgba(49,230,196,.10);border-radius:3px}
.tapable:active{background:rgba(49,230,196,.22)}

/* ---------- tables ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:clamp(15px,1.7vw,18px);
  border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:center}
tr:last-child td{border-bottom:0}
th{background:rgba(49,230,196,.09);font-weight:800;color:#d9f7f1}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}

/* ---------- steps ---------- */
.steps{display:flex;flex-direction:column;gap:7px}
.step{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-left:3px solid rgba(49,230,196,.55);
  border-radius:10px;padding:10px 12px;font-size:clamp(16px,1.9vw,19px);line-height:1.5}
.step .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--teal);color:#06231f;
  font-weight:900;font-size:12px;display:grid;place-items:center;margin-top:1px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:rgba(255,255,255,.035);
  font-size:clamp(16px,1.9vw,19px);cursor:pointer;min-height:50px;display:flex;align-items:center;gap:10px;
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.opt .k{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.09);display:grid;
  place-items:center;font-size:12px;font-weight:800;color:var(--ink2);flex:0 0 auto}
.opt.ok{border-color:var(--green);background:rgba(74,222,128,.13)}
.opt.ok .k{background:var(--green);color:#06231f}
.opt.no{border-color:var(--red);background:rgba(255,95,120,.13)}
.opt.no .k{background:var(--red);color:#2a0009}
.fb{font-size:clamp(15px,1.8vw,18px);line-height:1.55;padding:11px 13px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.ok{background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.38)}
.fb.no{background:rgba(255,95,120,.10);border:1px solid rgba(255,95,120,.38)}

/* ---------- rows ---------- */
.mrow{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mrow .em{flex:0 0 auto;margin:0}
.mrow b{display:block;font-size:clamp(16px,1.9vw,19px);margin-bottom:1px}
.mrow span{font-size:clamp(15px,1.75vw,17.5px);color:var(--ink2);line-height:1.5}

/* ---------- sim controls ---------- */
.simctl{display:flex;flex-direction:column;gap:7px}
.simctl input[type=range]{width:100%;accent-color:var(--teal);height:30px;margin:0;cursor:pointer}
.readout{display:flex;gap:16px;flex-wrap:wrap;font-size:clamp(14px,1.7vw,17px);color:var(--ink2)}
.readout b{color:var(--teal);font-size:clamp(16px,1.9vw,19px);font-weight:800}
.hint{font-size:clamp(14px,1.7vw,17px);color:var(--gold);line-height:1.5;
  background:rgba(255,194,71,.07);border-left:3px solid rgba(255,194,71,.5);
  padding:8px 11px;border-radius:0 9px 9px 0}
.switch{display:flex;gap:7px}
.switch button{flex:1;font-size:13.5px;padding:8px;min-height:40px}

/* ---------- word panel ---------- */
#wp{position:fixed;left:0;right:0;bottom:0;transform:translateY(130%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
  background:linear-gradient(180deg,#182534,#0f1922);
  border-top:1px solid var(--line2);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  z-index:50;box-shadow:0 -18px 46px rgba(0,0,0,.7);border-radius:18px 18px 0 0}
#wp.up{transform:translateY(0)}
#wp .r1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#wpWord{font-weight:800;font-size:22px;letter-spacing:-.01em}
#wpHindi{color:var(--gold);font-size:20px;font-weight:700}
#wpPron{color:var(--muted);font-size:15px}
.spk{background:rgba(255,255,255,.07);border:1px solid var(--line2);border-radius:999px;
  padding:7px 14px;min-height:0;font-size:14px;font-weight:600}
.spk.cls{margin-left:auto;background:rgba(255,95,120,.12);border-color:rgba(255,95,120,.35);color:#ffc2cb}
</style>
</head>

</div>

/* =============================================================================
   LLE — Language Learning Extension (English → Hindi)
   tap any English word → Hindi meaning + Devanagari sound + audio
   per block          → full-sentence Hindi translation toggle
   ============================================================================= */
const CONN = {{CONN_JSON}};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escA(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function normalizeWord(w){
  return String(w).toLowerCase().replace(/[’']s$/,"").replace(/[^a-z\-]/g,"");
}
function lookupWord(raw){
  const n = normalizeWord(raw);
  if (WM2[n]) return {known:true, h:WM2[n].h, p:WM2[n].p||""};
  const base = n.replace(/(ing|ed|es|s|ly)$/,"");
  if (WM2[base]) return {known:true, h:WM2[base].h, p:WM2[base].p||""};
  return {known:false, h:"(हिंदी अर्थ उपलब्ध नहीं)", p:""};
}
function rtText(text){
  const shielded = [];
  text = text.replace(/\{\{([\s\S]*?)\}\}/g, (m,g)=>{ shielded.push(g); return "\u0001"+(shielded.length-1)+"\u0001"; });
  const parts = text.split(/(<[^>]+>|\u0001\d+\u0001)/g);
  let connCount = 0;
  return parts.map(seg=>{
    if (/^<[^>]+>$/.test(seg)) return seg;
    const sm = seg.match(/^\u0001(\d+)\u0001$/);
    if (sm) return esc(shielded[+sm[1]]);
    return seg.replace(/([A-Za-z][A-Za-z'\-]*)|([.!?]+\s*)/g, (m, word, punc)=>{
      if (punc){ connCount = 0; return punc; }
      if (!word) return m;
      if (/^\d/.test(word)) return word;
      const low = word.toLowerCase();
      if (CONN[low] && connCount < 4){
        connCount++;
        return '<span class="conn" title="connector">'+word+' ('+CONN[low]+')</span>';
      }
      return '<span class="tapable" data-w="'+escA(normalizeWord(word))+'" tabindex="0" role="button">'+word+'</span>';
    });
  }).join("");
}
function attachHi(el, hi){
  if(el && (el.textContent||'').replace(/\s+/g,' ').trim().length < 14) return;
  if (!hi) return;
  if (el.dataset.hiDone) return; el.dataset.hiDone = "1";
  const wrap = document.createElement("div"); wrap.className = "hiWrap";
  const btn = document.createElement("button"); btn.type="button"; btn.className="hiBtn";
  btn.setAttribute("aria-expanded","false"); btn.setAttribute("aria-label","Show Hindi translation");
  btn.textContent = "अ";
  const box = document.createElement("div"); box.className="hiBox"; box.hidden=true; box.setAttribute("lang","hi");
  box.textContent = hi;
  btn.addEventListener("click", e=>{ e.stopPropagation();
    const open = box.hidden; box.hidden = !open; wrap.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
    btn.classList.toggle("on", open); btn.textContent = "अ";
  });
  wrap.appendChild(btn); wrap.appendChild(box); el.appendChild(wrap);
}
function applyLang(root){
  (root||document).querySelectorAll("[data-lang]").forEach(el=>{
    if (el.dataset.langDone) return;
    const en = (el.dataset.hi ? "" : el.textContent).replace(/\s+/g," ").trim();
    el.innerHTML = rtText(el.innerHTML);
    el.dataset.langDone = "1";
    attachHi(el, el.dataset.hi || PH[en]);
  });
  bindTaps(root||document);
}
function lang(root){
  if (!root) return;
  const els = root.querySelectorAll("[data-lang]");
  for (let i=0;i<els.length;i++){ delete els[i].dataset.langDone; delete els[i].dataset.hiDone; }
  applyLang(root);
}
function bindTaps(root){
  (root||document).querySelectorAll(".tapable").forEach(el=>{
    if (el.dataset.bound) return; el.dataset.bound = "1";
    const open = ()=>showWord(el.dataset.w);
    el.addEventListener("click", open);
    el.addEventListener("keydown", e=>{ if (e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
}
function showWord(w){
  const r = lookupWord(w);
  const eW=document.getElementById("wpWord"), eH=document.getElementById("wpHindi"), eP=document.getElementById("wpPron");
  if(eW) eW.textContent = w;
  if(eH) eH.textContent = r.h;
  if(eP) eP.textContent = (r.known && r.p) ? "उच्चारण · "+r.p : "";
  const panel = document.getElementById("wordpanel") || document.getElementById("wp");
  if(!panel) return;
  panel.classList.add("up"); panel.dataset.cur = w;
  speak(w);
}
function closeWord(){
  const p = document.getElementById("wordpanel") || document.getElementById("wp");
  if(p) p.classList.remove("up");
}
let lastUtter = null;
function speak(text){
  try{
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    lastUtter = new SpeechSynthesisUtterance(text);
    lastUtter.rate = 0.85; lastUtter.lang = "en-IN";
    window.speechSynthesis.speak(lastUtter);
  }catch(e){/* audio is a bonus, never a dependency */}
}


/* ---- panel wiring: Close, speaker, Escape, tap-outside ---- */
(function bindWordPanel(){
  const P = ()=> document.getElementById("wordpanel") || document.getElementById("wp");
  const closeBtn = document.getElementById("wpClose");
  if(closeBtn) closeBtn.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation(); closeWord(); });
  const spk = document.getElementById("wpSpeak");
  if(spk) spk.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    const p = P(); if(p && p.dataset.cur) speak(p.dataset.cur); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" || e.key === "Esc") closeWord(); });
  document.addEventListener("click", function(e){
    const p = P(); if(!p || !p.classList.contains("up")) return;
    if(p.contains(e.target)) return;
    if(e.target && e.target.classList && e.target.classList.contains("tapable")) return;
    closeWord();
  }, true);
})();

const VB = 'viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"';

function grid(){

  for(let x=40;x<=360;x+=40) g+='<line x1="'+x+'" y1="30" x2="'+x+'" y2="260" stroke="rgba(120,180,220,.10)"/>';

function vizLine(xv, k, showPoint){

/* inverse: hyperbola y = k/x */
function vizCurve(xv, k, showPoint){

  s += '<text x="200" y="95" fill="#e9f2f8" font-size="30" font-weight="800">'+c+'</text>';
  s += '<text x="200" y="135" fill="#e9f2f8" font-size="30" font-weight="800">'+d+'</text>';
  s += '<text x="250" y="120" fill="#8ba2b6" font-size="30">:</text>';
  s += '<line x1="85" y1="85" x2="215" y2="145" stroke="'+col+'" stroke-width="2.5" stroke-dasharray="6 4"/>';
  s += '<line x1="85" y1="145" x2="215" y2="85" stroke="'+col+'" stroke-width="2.5" stroke-dasharray="6 4"/>';
  s += '<text x="30" y="215" fill="'+col+'" font-size="15" font-weight="700">'+a+' × '+d+' = '+(a*d)+'</text>';
  s += '<text x="205" y="215" fill="'+col+'" font-size="15" font-weight="700">'+b+' × '+c+' = '+(b*c)+'</text>';
  s += '<text x="30" y="245" fill="#8ba2b6" font-size="13">'+(ok===false?'not equal — not a proportion':'equal — it is a proportion')+'</text>';
  return s + '</svg>';
}

/* balance / scale */
function vizBalance(){
  let s = svgOpen();
  s += '<line x1="200" y1="80" x2="200" y2="220" stroke="#5c7386" stroke-width="4"/>';
  s += '<line x1="110" y1="80" x2="290" y2="80" stroke="#2ee6c5" stroke-width="4"/>';
  s += '<path d="M110 80 L80 140 L140 140 Z" fill="none" stroke="#2ee6c5" stroke-width="3"/>';
  s += '<path d="M290 80 L260 140 L320 140 Z" fill="none" stroke="#2ee6c5" stroke-width="3"/>';
  s += '<text x="92" y="172" fill="#2ee6c5" font-size="15" font-weight="700">a : b</text>';
  s += '<text x="272" y="172" fill="#2ee6c5" font-size="15" font-weight="700">c : d</text>';
  s += '<rect x="160" y="220" width="80" height="10" rx="4" fill="#5c7386"/>';
  s += '<text x="140" y="262" fill="#8ba2b6" font-size="13">two equal ratios</text>';
  return s + '</svg>';
}

/* decision flow */
function vizFlow(){
  let s = svgOpen();
  const box=(x,y,w,h,t,c)=>
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+c+'" fill-opacity=".14" stroke="'+c+'" stroke-width="2"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+h/2+5)+'" fill="'+c+'" font-size="12.5" font-weight="700" text-anchor="middle">'+t+'</text>';
  s += box(140,14,120,44,"Make a table","#5aa9ff");
  s += '<line x1="200" y1="58" x2="200" y2="86" stroke="#5c7386" stroke-width="2"/>';
  s += '<polygon points="200,86 194,76 206,76" fill="#5c7386"/>';
  s += box(125,86,150,44,"Divide  y ÷ x","#ffc247");
  s += '<line x1="200" y1="130" x2="200" y2="152" stroke="#5c7386" stroke-width="2"/>';
  s += '<line x1="90" y1="152" x2="310" y2="152" stroke="#5c7386" stroke-width="2"/>';
  s += box(20,168,150,44,"Constant → DIRECT","#2ee6c5");
  s += box(230,168,150,44,"Not → check x × y","#ff5a72");
  s += '<line x1="90" y1="152" x2="90" y2="168" stroke="#5c7386" stroke-width="2"/>';
  s += '<line x1="310" y1="152" x2="310" y2="168" stroke="#5c7386" stroke-width="2"/>';
  s += box(230,228,150,40,"Constant → INVERSE","#ffc247");
  s += '<line x1="305" y1="212" x2="305" y2="228" stroke="#5c7386" stroke-width="2"/>';
  return s + '</svg>';
}

/* ratio as a part-whole bar */
function vizParts(a,b){
  const tot=a+b, wa=(a/tot)*300, wb=(b/tot)*300;
  let s = svgOpen();
  s += '<rect x="50" y="105" width="'+wa+'" height="52" rx="8" fill="#2ee6c5"/>';
  s += '<rect x="'+(50+wa)+'" y="105" width="'+wb+'" height="52" rx="8" fill="#ffc247"/>';
  s += '<text x="'+(50+wa/2)+'" y="138" fill="#06231f" font-size="16" font-weight="800" text-anchor="middle">'+a+'</text>';
  s += '<text x="'+(50+wa+wb/2)+'" y="138" fill="#3a2a00" font-size="16" font-weight="800" text-anchor="middle">'+b+'</text>';
  s += '<text x="50" y="90" fill="#8ba2b6" font-size="13">'+a+' parts</text>';
  s += '<text x="250" y="90" fill="#8ba2b6" font-size="13">'+b+' parts</text>';
  s += '<text x="50" y="200" fill="#d7e4ee" font-size="15" font-weight="700">ratio = '+a+' : '+b+'</text>';
  return s + '</svg>';
}

/* generic illustration for text slides */
function vizCard(pic, caption){
  let s = svgOpen();
  s += '<rect x="30" y="30" width="340" height="240" rx="18" fill="rgba(46,230,197,.05)" stroke="rgba(46,230,197,.25)"/>';
  s += '<circle cx="200" cy="140" r="62" fill="rgba(46,230,197,.10)"/>';
  s += '<text x="200" y="160" font-size="62" text-anchor="middle">'+EMO_GLYPH(pic)+'</text>';
  if(caption) s += '<text x="200" y="248" fill="#8ba2b6" font-size="13" text-anchor="middle">'+esc(caption)+'</text>';
  return s + '</svg>';
}
function EMO_GLYPH(name){
  const g={balance:"⚖️",ratio:"📊","arrow-up":"⬆️","arrow-down":"⬇️",divide:"➗",multiply:"✖️",
    graph:"📈",flow:"🔀",warning:"⚠️",water:"💧",car:"🚗",cart:"🛒",tree:"🌳",train:"🚆",
    map:"🗺️",rupee:"💰",magnify:"🔍",factory:"🏭",users:"👥",food:"🍚",paint:"🎨",pen:"🖊️"};
  return g[name]||"📐";
}


/* lookup table for text slides that name a visual */
const VIZ = {
  parts: ()=>vizParts(2,5),
  line:  ()=>vizLine(5,3),
  curve: ()=>vizCurve(4,12),
  flow:  ()=>vizFlow(),
  bars:  ()=>vizBars(4,10,"x","y","both rise together"),
  cross: ()=>vizCross(2,5,4,10,true),
  balance: ()=>vizBalance()
};

/* ============================ SIMS ============================ */
function simShell(id, inner){ return '<div class="simctl" id="'+id+'">'+inner+'</div>'; }

const SIM = {
  ratio: ()=>'<input type="range" id="sR" min="1" max="10" value="2" aria-label="multiplier">'+
    '<div class="readout"><span>A = <b id="oA">2</b></span><span>B = <b id="oB">5</b></span>'+
    '<span>ratio <b id="oR">2 : 5</b></span></div>',
  proportion: ()=>'<input type="range" id="sP" min="1" max="10" value="3" aria-label="c value">'+
    '<div class="readout"><span>a : b = <b>2 : 5</b></span><span>c : d = <b id="oC">3 : 5</b></span></div>',
  direct: ()=>'<input type="range" id="sD" min="1" max="12" value="4" aria-label="x value">'+
    '<div class="readout"><span>x = <b id="oX">4</b></span><span>y = <b id="oY">12</b></span>'+
    '<span>y ÷ x = <b id="oK">3</b></span></div>',
  inverse: ()=>'<input type="range" id="sI" min="1" max="12" value="4" aria-label="x value">'+
    '<div class="readout"><span>x = <b id="oX">4</b></span><span>y = <b id="oY">3</b></span>'+
    '<span>x × y = <b id="oK">12</b></span></div>',
  compare: ()=>'<div class="switch"><button id="cD" class="on">Direct</button><button id="cI">Inverse</button></div>'+
    '<input type="range" id="sC" min="1" max="12" value="4" aria-label="x value">'+
    '<div class="readout"><span>x = <b id="oX">4</b></span><span>y = <b id="oY">12</b></span>'+
    '<span id="oK">y ÷ x = <b>3</b></span></div>',
  cross: ()=>'<input type="range" id="sX" min="1" max="10" value="2" aria-label="multiplier">'+
    '<div class="readout"><span>2 : 5 = <b id="oC">4</b> : 10</span><span id="oK"><b>proportion ✓</b></span></div>',
  identify: ()=>'<div class="switch"><button id="kD">More pens → more cost</button></div>'+
    '<div class="readout"><span id="oK">Tap to test a pair</span></div>',
  scale: ()=>'<input type="range" id="sS" min="1" max="20" value="5" aria-label="map cm">'+
    '<div class="readout"><span>map = <b id="oX">5</b> cm</span><span>real = <b id="oY">90</b> km</span></div>'
};

function simViz(name, v){
  if(name==="generic_scale" || (typeof v==="object" && v && v.generic)){ const mult=(v&&v.mult)||4; const val=(v&&v.val)||3; return vizBars(val, val*mult, (v&&v.labelA)||"Input", (v&&v.labelB)||"Output", (v&&v.caption)||""); }
  if(name==="ratio")      return vizParts(2*v, 5*v);
  if(name==="proportion") return vizCross(2,5,v,5, 2*5===5*v);
  if(name==="direct")     return vizLine(v, 3);
  if(name==="inverse")    return vizCurve(v, 12);
  if(name==="compare")    return v.mode==="d" ? vizLine(v.x,3) : vizCurve(v.x,12);
  if(name==="cross")      return vizCross(2,5,2*v,10, true);
  if(name==="scale")      return vizBars(v, v*18, "map cm", "real km", "1 cm on the map = 18 km");
  if(name==="identify")   return vizFlow();
  return vizCard("balance");
}


/* === AASHA GENERIC CHAPTER SIM SUPPORT === */
if (typeof SIM !== 'undefined') {
  SIM.generic_scale = function(cfg) {
    const c = cfg || { labelA:'Input (x)', labelB:'Output (y)', min:1, max:10, val:3, mult:4, unitA:'', unitB:'' };
    return '<input type="range" id="sGen" min="'+(c.min||1)+'" max="'+(c.max||10)+'" value="'+(c.val||3)+'" aria-label="value">' +
      '<div class="readout"><span>'+(c.labelA||'x')+' = <b id="oGA">'+(c.val||3)+'</b> '+(c.unitA||'')+'</span>' +
      '<span>'+(c.labelB||'y')+' = <b id="oGB">'+((c.val||3)*(c.mult||4))+'</b> '+(c.unitB||'')+'</span></div>';
  };
}
const CUSTOM_SIMS = {{CUSTOM_SIMS_JSON}};

/* ============================ RENDER ============================ */
function render(){
  const s = SLIDES[i];
  const hasSim = s.kind === "sim";
  card.className = "card" + (s.kind === "end" ? "" : " split");
  let title="", txt="", vis="", ctl="";

  switch(s.kind){
    case "title":
      title = '<div class="kindrow"><span class="kind">{{CHAPTER_BADGE}}</span></div><h1 data-lang>'+esc(s.t)+'</h1>';
      txt = '<p class="sub" data-lang>'+esc(s.s||"")+'</p><p class="b" data-lang>'+esc(s.b||"")+'</p>';
      vis = vizLine(6,3);
      break;
    case "text":
      title = '<div class="kindrow"><span class="kind">Idea</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>';
      vis = s.viz ? VIZ[s.viz]() : vizCard(s.pic||"balance");
      break;
    case "sim":
      title = '<div class="kindrow"><span class="kind">Try it</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+(s.hint?'<div class="hint" data-lang>'+esc(s.hint)+'</div>':'');
      const simFn = SIM[s.sim] || SIM.generic_scale; ctl = '<div class="simctl">'+simFn(s.simCfg || CUSTOM_SIMS[s.sim])+'</div>';
      break;
    case "table":
      title = '<div class="kindrow"><span class="kind">Table</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        '<table><thead><tr>'+(s.head||[]).map(h=>'<th data-lang>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+
        (s.rows||[]).map(r=>'<tr>'+r.map(c=>'<td data-lang>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table>'+
        (s.note?'<div class="hint" data-lang>'+esc(s.note)+'</div>':'');
      vis = s.viz==="curve" ? vizCurve(4,12) : vizLine(4,3);
      break;
    case "steps":
      title = '<div class="kindrow"><span class="kind">Worked example</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        '<div class="steps">'+(s.steps||[]).map((x,n)=>'<div class="step"><span class="n">'+(n+1)+
        '</span><span data-lang>'+esc(x)+'</span></div>').join("")+'</div>';
      { const inv = /inverse|workers|hose|campers|painters|halve|less time|fewer hours/i.test(s.t+" "+s.b);
        vis = inv ? vizCurve(4,12) : vizLine(5,3); }
      break;
    case "check":
      title = '<div class="kindrow"><span class="kind">Your turn</span></div><h2 data-lang>'+esc(s.q)+'</h2>';
      txt = '<div class="opts">'+(s.opts||[]).map((o,n)=>'<div class="opt" data-k="'+n+'">'+
        '<span class="k">'+String.fromCharCode(65+n)+'</span><span data-lang>'+esc(o)+'</span></div>').join("")+
        '</div><div class="fb" id="fb"></div>';
      vis = vizFlow();
      break;
    case "compare":
      title = '<div class="kindrow"><span class="kind">Compare</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        '<table><thead><tr>'+(s.rows[0]).map(h=>'<th data-lang>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+
        s.rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td data-lang>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table>';
      vis = vizFlow();
      break;
    case "mistake":
      title = '<div class="kindrow"><span class="kind">Watch out</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = '<p class="b" data-lang>'+esc(s.b)+'</p>'+
        (s.items||[]).map(it=>'<div class="mrow">'+emo("warning",26)+'<div><b data-lang>'+esc(it[0])+
        '</b><span data-lang>'+esc(it[1])+'</span></div></div>').join("");
      vis = vizCross(3,4,9,12,false);
      break;
    case "summary":
      title = '<div class="kindrow"><span class="kind">Summary</span></div><h2 data-lang>'+esc(s.t)+'</h2>';
      txt = (s.items||[]).map(it=>'<div class="mrow">'+emo("check",24)+'<div><b data-lang>'+esc(it[0])+
        '</b><span data-lang>'+esc(it[1])+'</span></div></div>').join("");
      vis = vizBalance();
      break;
    case "end":
      title = '<div class="kindrow"><span class="kind">Done</span></div><h1 data-lang>'+esc(s.t)+'</h1>';
      txt = '<p class="sub" data-lang>'+esc(s.s||"")+'</p><p class="b" data-lang>'+esc(s.b||"")+'</p>';
      vis = vizCard("star","open the arena next");
      break;
    default:
      title = '<h2 data-lang>'+esc(s.t||"")+'</h2>'; txt = '<p class="b" data-lang>'+esc(s.b||"")+'</p>';
      vis = vizCard("balance");
  }

  card.innerHTML =
    '<div class="head">'+title+'</div>' +
    '<div class="txt">'+txt+'</div>' +
    '<div class="visual" id="vis">'+(hasSim ? simViz(s.sim, initSim(s.sim)) : vis)+'</div>' +
    '<div class="ctl">'+(hasSim ? ctl : '')+'</div>';

  lang(card);
  if(s.kind === "check") wireCheck(s);
  if(hasSim) wireSim(s.sim);
  prog.style.width = Math.round(((i+1)/SLIDES.length)*100)+"%";
  const chip = document.getElementById("chip");
  if(chip) chip.textContent = (i+1) + " / " + SLIDES.length;
  prevB.disabled = i === 0;
  nextB.textContent = (i === SLIDES.length-1) ? "Finish ✓" : "Next ▶";
}

/* initial state for a sim */
function initSim(name){
  if(name==="ratio") return 2;
  if(name==="proportion") return 3;
  if(name==="direct") return 4;
  if(name==="inverse") return 4;
  if(name==="compare") return {x:4, mode:"d"};
  if(name==="cross") return 2;
  if(name==="scale") return 5;
  return 0;
}

/* ============================ INTERACTION ============================ */
function wireCheck(s){
  card.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = +el.dataset.k;
      const fb = document.getElementById("fb");
      card.querySelectorAll(".opt").forEach(o=>o.classList.remove("ok","no"));
      const right = (k === s.ans);
      if(right){ el.classList.add("ok"); fb.className="fb show ok"; }
      else { el.classList.add("no"); card.querySelectorAll(".opt")[s.ans].classList.add("ok");
             fb.className="fb show no"; }
      fb.innerHTML = T(s.why||(right?"Correct.":"Not quite."));
      lang(fb);
    });
  });
}

function setVis(html){ const v=document.getElementById("vis"); if(v) v.innerHTML = html; }

function wireSim(name){
  const on = (id, fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener("input", fn); return e; };
  const gen = document.getElementById("sGen");
  if(gen){
    const sObj = SLIDES[i] || {};
    const cfg = sObj.simCfg || CUSTOM_SIMS[name] || {labelA:"Input",labelB:"Output",mult:4,val:3,caption:""};
    const upd=()=>{ const v=+gen.value; const m=cfg.mult||4;
      const ea=document.getElementById("oGA"), eb=document.getElementById("oGB");
      if(ea) ea.textContent=v;
      if(eb) eb.textContent=(v*m);
      setVis(simViz("generic_scale", {generic:true, val:v, mult:m, labelA:cfg.labelA||"Input", labelB:cfg.labelB||"Output", caption:cfg.caption||""}));
    };
    gen.addEventListener("input", upd); upd();
    return;
  }

  if(name==="ratio"){
    const s=document.getElementById("sR");
    const upd=()=>{ const m=+s.value;
      document.getElementById("oA").textContent=2*m;
      document.getElementById("oB").textContent=5*m;
      document.getElementById("oR").textContent=(2*m)+" : "+(5*m);
      setVis(vizParts(2*m,5*m)); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="proportion"){
    const s=document.getElementById("sP");
    const upd=()=>{ const c=+s.value;
      document.getElementById("oC").textContent=c+" : 5";
      setVis(vizCross(2,5,c,5, 2*5===5*c)); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="direct"){
    const s=document.getElementById("sD");
    const upd=()=>{ const x=+s.value, y=3*x;
      document.getElementById("oX").textContent=x;
      document.getElementById("oY").textContent=y;
      document.getElementById("oK").textContent=(y/x).toFixed(0);
      setVis(vizLine(x,3)); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="inverse"){
    const s=document.getElementById("sI");
    const upd=()=>{ const x=+s.value, y=12/x;
      document.getElementById("oX").textContent=x;
      document.getElementById("oY").textContent=y.toFixed(2).replace(/\.00$/,"");
      document.getElementById("oK").textContent=(x*y).toFixed(0);
      setVis(vizCurve(x,12)); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="compare"){
    const s=document.getElementById("sC");
    const bD=document.getElementById("cD"), bI=document.getElementById("cI");
    let mode="d";
    const upd=()=>{ const x=+s.value;
      const y = mode==="d" ? 3*x : 12/x;
      document.getElementById("oX").textContent=x;
      document.getElementById("oY").textContent=y.toFixed(2).replace(/\.00$/,"");
      document.getElementById("oK").innerHTML = mode==="d"
        ? 'y ÷ x = <b>'+(y/x).toFixed(0)+'</b> constant'
        : 'x × y = <b>'+(x*y).toFixed(0)+'</b> constant';
      setVis(mode==="d" ? vizLine(x,3) : vizCurve(x,12)); };
    bD.addEventListener("click",()=>{ mode="d"; bD.classList.add("on"); bI.classList.remove("on"); upd(); });
    bI.addEventListener("click",()=>{ mode="i"; bI.classList.add("on"); bD.classList.remove("on"); upd(); });
    s.addEventListener("input",upd); upd();
  }
  if(name==="cross"){
    const s=document.getElementById("sX");
    const upd=()=>{ const m=+s.value;
      document.getElementById("oC").textContent=(2*m);
      setVis(vizCross(2,5,2*m,10,true)); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="scale"){
    const s=document.getElementById("sS");
    const upd=()=>{ const c=+s.value;
      document.getElementById("oX").textContent=c;
      document.getElementById("oY").textContent=c*18;
      setVis(vizBars(c, c*18, "map cm", "real km", "1 cm on the map = 18 km")); };
    s.addEventListener("input",upd); upd();
  }
  if(name==="identify"){
    const b=document.getElementById("kD");
    const out=document.getElementById("oK");
    let n=0;
    const pairs=[["More pens → more cost","DIRECT"],["More workers → less time","INVERSE"],
                 ["More speed → less time","INVERSE"],["More items → more cost","DIRECT"],
                 ["Higher price → fewer books","INVERSE"]];
    b.textContent = pairs[0][0];
    out.innerHTML = "Tap the button to reveal the type";
    b.addEventListener("click",()=>{
      out.innerHTML = "This is <b>"+pairs[n][1]+"</b>";
      n=(n+1)%pairs.length; b.textContent = pairs[n][0];
    });
    setVis(vizFlow());
  }
}

/* ============================ NAV ============================ */
prevB.addEventListener("click", ()=>{ if(i>0){ i--; render(); } });
nextB.addEventListener("click", ()=>{ if(i<SLIDES.length-1){ i++; render(); } });
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") nextB.click();
  if(e.key==="ArrowLeft") prevB.click();
});
hiAll.addEventListener("click", ()=>{
  allHi = !allHi;
  hiAll.style.background = allHi ? "rgba(255,194,71,.18)" : "transparent";
  hiAll.style.color = allHi ? "var(--gold)" : "";
  document.querySelectorAll(".hiBtn").forEach(b=>{
    const on = b.classList.contains("on");
    if(allHi && !on) b.click();
    if(!allHi && on) b.click();
  });
});
window.addEventListener("resize", ()=>{ /* svg scales by itself */ });

render();
</script>
