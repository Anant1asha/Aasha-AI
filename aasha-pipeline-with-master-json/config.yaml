# Aasha Pipeline Configuration
# API keys are read from environment variables, never from this file.

llm:
  default_provider: openrouter
  providers:
    openrouter:
      # meta-llama/llama-3.1-8b-instruct:free was retired by OpenRouter (404:
      # "unavailable for free"). Verified working free models returning valid JSON.
      model: nvidia/nemotron-3-super-120b-a12b:free
      temperature: 0
    openai:
      model: gpt-4o-mini
      temperature: 0
    gemini:
      model: gemini-1.5-flash
      temperature: 0
    anthropic:
      model: claude-3-haiku-20240307
      temperature: 0
  cache_dir: ./.llm_cache
  max_retries: 3
  backoff_base: 1.0  # seconds
  backoff_max: 30.0  # seconds

pipeline:
  work_dir: ./work
  output_dir: ./output
  jobs_dir: ./jobs
  qa_runner: node ./qa/run_qa.js
  template_path: ./template/v5-engine-template.html
  defaults_path: ./config/defaults.json
  schema_path: ./schema/chapter_spec.schema.json

storage:
  type: local
  path: ./jobs
  retention_days: 30

web:
  host: 127.0.0.1
  port: 5000
  debug: false
