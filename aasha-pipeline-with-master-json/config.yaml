# Aasha Pipeline Configuration
# API keys are NEVER stored here — read from environment variables only.

llm:
  default_provider: openrouter
  providers:
    openrouter:
      # Tier-1 Anti-Bleed free model cascade (verified active & responsive on OpenRouter)
      model: nvidia/nemotron-3.5-lightning:free
      fallback_models:
        - liquid/lfm-2.5-2.6b:free
        - cohere/north-mini-code:free
        - recursive/flint-v1.0:free
      temperature: 0
      rate_limit_delay: 3.0      # 3s mandatory backoff (anti-bleed policy)
    openai:
      model: gpt-4o-mini
      temperature: 0
    gemini:
      # RESERVE — Tier-3 only. Requires explicit Super Admin authorization.
      # ALLOW_PAID_GEMINI_FALLBACK=false enforced in run_pipeline.ps1
      model: gemini-1.5-flash
      temperature: 0
    anthropic:
      model: claude-3-haiku-20240307
      temperature: 0
  cache_dir: ./.llm_cache
  max_retries: 3
  backoff_base: 3.0        # seconds — matches anti-bleed 3s policy
  backoff_max: 30.0        # seconds
  rate_limit_delay: 3.0

pipeline:
  work_dir: ./work
  output_dir: ./output
  jobs_dir: ./jobs
  qa_runner: node ./qa/run_qa.js
  template_path: ./template/v5-engine-template.html
  defaults_path: ./config/defaults.json
  schema_path: ./schema/chapter_spec.schema.json

storage:
  type: local
  path: ./jobs
  retention_days: 30

web:
  host: 127.0.0.1
  port: 5000
  debug: false
