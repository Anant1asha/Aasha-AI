<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Annanth Aasha Foundation — Learning</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <div class="brand">🪔 Annanth Aasha Foundation</div>
        <div class="tagline">Safe Learning. Real Impact.</div>
      </div>
      <div id="status" class="status">Offline-ready</div>
    </header>
    <main id="app"></main>
  </div>

  <dialog id="wordDialog">
    <div class="dlg-word" id="dlgWord"></div>
    <div class="dlg-hindi" id="dlgHindi"></div>
    <div class="dlg-desc" id="dlgDesc"></div>
    <button class="dlg-btn" onclick="document.getElementById('wordDialog').close()">OK</button>
  </dialog>
  <dialog id="levelUpDialog">
    <div class="lu-icon" id="luIcon">🎉</div>
    <div class="lu-title" id="luTitle">Mastered!</div>
    <div class="lu-sub" id="luSub">You learned a new concept!</div>
    <button class="dlg-btn" onclick="document.getElementById('levelUpDialog').close()">Awesome!</button>
  </dialog>

  <div class="combo-indicator" id="comboInd"></div>
  <canvas id="confettiCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200"></canvas>

  <script type="module" src="/app.js"></script>
  <script>if('serviceWorker'in navigator) navigator.serviceWorker.register('/sw.js')</script>
</body>
</html>
