<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aasha — Perimeter & Area Chapter (Enhanced)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4ff;--surface:#fff;--text:#1e293b;--muted:#64748b;
  --blue:#3b82f6;--blue-dk:#2563eb;--blue-lt:#dbeafe;
  --green:#22c55e;--green-dk:#16a34a;--green-lt:#dcfce7;
  --red:#ef4444;--red-lt:#fee2e2;
  --amber:#f59e0b;--amber-lt:#fef3c7;
  --purple:#8b5cf6;--purple-lt:#ede9fe;
  --pink:#ec4899;--teal:#14b8a6;
  --border:#e2e8f0;
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.15);
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --brand:#1e3a5f;--brand-lt:#2d5a8e;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* Brand Header */
.brand-header{background:linear-gradient(135deg,var(--brand),var(--brand-lt));padding:8px 14px;display:flex;align-items:center;gap:10px;color:#fff}
.brand-logo{width:42px;height:42px;flex-shrink:0}
.brand-logo svg{width:100%;height:100%}
.brand-info{flex:1;min-width:0}
.brand-name{font-size:.78rem;font-weight:800;letter-spacing:.02em;line-height:1.2}
.brand-name-hi{font-size:.68rem;opacity:.85;line-height:1.2}
.brand-tagline{font-size:.6rem;opacity:.7;margin-top:1px}

/* Topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}
.exit-btn{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.progress-track{flex:1;height:10px;background:var(--border);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0}
.stat{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:16px;white-space:nowrap;transition:transform .2s}
.stat.coins{color:var(--amber);background:var(--amber-lt)}
.stat.xp{color:var(--purple);background:var(--purple-lt)}
.stat.lvl{color:var(--blue);background:var(--blue-lt)}
.stat.streak{color:#ef4444;background:var(--red-lt)}
.stat.bump{transform:scale(1.3)}

/* Screen */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px 90px;min-height:calc(100vh - 120px);animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

/* Intro */
.intro-icon{font-size:3.2rem;margin-bottom:8px;text-align:center;animation:pop .5s ease}
.intro-title{font-size:1.15rem;font-weight:800;text-align:center;margin-bottom:6px}
.intro-sub{color:var(--muted);font-size:.85rem;font-weight:600;text-align:center;margin-bottom:12px}

/* Instruction */
.instruction{text-align:center;font-size:1.15rem;font-weight:800;color:#fff;margin:10px auto;padding:12px 18px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:14px;max-width:420px;box-shadow:0 3px 8px rgba(0,0,0,.15);line-height:1.5}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:6px 0}

/* LLE Text */
.lle-text{font-size:1.15rem;line-height:2.8;color:var(--text);max-width:400px;margin:10px auto;text-align:left}
.lle-text-sm{font-size:.95rem;line-height:2.2;color:var(--text);max-width:380px;margin:6px auto;text-align:left}
.word{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s;border-bottom:1px dotted rgba(0,0,0,.2)}.word:hover{background:#e0e7ff}
.connective{color:var(--blue);font-weight:700;cursor:pointer;border-bottom:2px dotted var(--blue);padding:0 1px}
.connective-hi{color:var(--purple);font-size:.85em;font-weight:600}

/* Fraction display */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1;margin:0 2px}
.frac-top{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac-bot{padding:0 4px}
.frac-display{text-align:center;font-size:2rem;font-weight:800;margin:8px 0}

/* Cards */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto 8px;box-shadow:var(--shadow)}
.card-caption{text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.4}
.canvas-visual{display:block;margin:0 auto;border-radius:var(--radius-xs)}

/* Game card */
.game-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:var(--shadow)}
.game-card canvas{display:block;margin:0 auto;cursor:pointer;border-radius:var(--radius-xs);touch-action:none}

/* Worked Example */
.we-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px;max-width:400px;width:100%;margin:0 auto;box-shadow:var(--shadow)}
.we-tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);margin-bottom:6px}
.we-question{margin-bottom:10px}
.we-step{padding:10px 12px;background:var(--blue-lt);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin-bottom:6px;animation:stepReveal .35s ease}
.we-step.green{background:var(--green-lt);border-left-color:var(--green)}
.we-step.amber{background:var(--amber-lt);border-left-color:var(--amber)}
.we-step.final{padding:10px;background:var(--green-lt);border:2px solid var(--green);border-radius:10px;margin-top:6px;text-align:center;font-weight:700;color:var(--green-dk)}
.we-num{display:inline-block;width:20px;height:20px;background:var(--blue);color:#fff;border-radius:50%;text-align:center;font-size:.65rem;font-weight:700;line-height:20px;margin-right:6px}
.we-step.green .we-num{background:var(--green)}.we-step.amber .we-num{background:var(--amber)}
.we-visual{margin:8px 0}
@keyframes stepReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Quiz */
.quiz-question{margin-bottom:14px;max-width:380px;margin-left:auto;margin-right:auto}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin-bottom:7px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;background:var(--surface)}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.selected{border-color:var(--blue);background:var(--blue-lt)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-lt)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-lt)}
.quiz-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;transition:all .15s}
.quiz-opt.selected .quiz-radio{border-color:var(--blue);background:var(--blue)}
.quiz-opt.correct .quiz-radio{border-color:var(--green);background:var(--green)}
.quiz-opt.wrong .quiz-radio{border-color:var(--red);background:var(--red)}
.quiz-opt-text{flex:1}

/* Feedback */
.feedback{padding:12px;border-radius:var(--radius-sm);margin:8px auto;max-width:380px;font-size:.85rem;text-align:center;line-height:1.4;animation:stepReveal .3s ease}
.feedback.ok{background:var(--green-lt);border:1px solid #86efac;color:#166534}
.feedback.no{background:var(--red-lt);border:1px solid #fca5a5;color:#991b1b}
.misconception{background:var(--red-lt);border:1px solid #fca5a5;border-radius:10px;padding:10px;margin:8px auto;max-width:380px;font-size:.8rem;color:#991b1b;line-height:1.4;animation:stepReveal .3s ease}

/* Visual quiz */
.vq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:380px;margin:0 auto}
.vq-opt{padding:10px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;background:var(--surface);text-align:center}
.vq-opt:hover{border-color:var(--blue)}
.vq-opt.selected{border-color:var(--blue);background:var(--blue-lt)}
.vq-opt.correct{border-color:var(--green);background:var(--green-lt)}
.vq-opt.wrong{border-color:var(--red);background:var(--red-lt)}
.vq-opt canvas{display:block;margin:0 auto;border-radius:6px}

/* Drag-drop */
.dd-label{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600}

.dd-zone.over{border-color:var(--green);background:var(--green-lt)}
.dd-zone.wrong{border-color:var(--red);background:var(--red-lt)}

.dd-item:hover{border-color:var(--blue);transform:scale(1.05)}
.dd-item.dragging{opacity:.5}
.dd-item.placed{background:var(--blue-lt);border-color:var(--blue)}

/* Input */
input[type=text]{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:1rem;margin-bottom:8px}
input[type=text]:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-lt)}
input[type=range]{width:100%;max-width:260px;accent-color:var(--blue);height:6px}

/* Tap area */
.tap-area{display:flex;gap:3px;justify-content:center;margin:12px auto;max-width:280px}
.tap-cell{flex:1;height:42px;border-radius:var(--radius-xs);border:3px solid var(--border);background:#f1f5f9;cursor:pointer;transition:all .15s;touch-action:none}
.tap-cell.tapped{background:var(--green);border-color:var(--green);transform:scale(1.05)}
.tap-count{text-align:center;font-size:1.2rem;font-weight:800;margin-top:6px}

/* Fraction label (vertical) */
.flb{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px auto}
.fn{font-size:2rem;font-weight:800;line-height:1;cursor:pointer}.fn:hover{transform:scale(1.1)}
.fln{width:48px;height:3px;background:var(--text);border-radius:2px}

/* Slider */
.slider-area{text-align:center;margin:12px auto}
.slider-display{font-size:1.6rem;font-weight:800;margin-bottom:6px}

/* Milestone / Progress */
.milestone-icon{font-size:3.5rem;margin-bottom:6px;animation:pop .5s ease}
.milestone-text{font-size:1.1rem;font-weight:700;text-align:center}
.milestone-reward{font-size:1.8rem;font-weight:800;color:var(--amber);margin:6px 0;animation:pop .4s ease .2s both}
.milestone-next{font-size:.8rem;color:var(--muted);margin-top:10px}

/* Complete */
.complete-icon{font-size:4rem;margin-bottom:8px;animation:pop .6s ease}
.complete-title{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.complete-coins{font-size:2.5rem;font-weight:800;color:var(--amber);margin:10px 0}
.star-row{display:flex;gap:4px;justify-content:center;margin:8px 0}
.star-row span{font-size:1.8rem}
.chip{padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:600}

/* Bottom bar */
.bottom-bar{position:sticky;bottom:0;left:0;right:0;background:var(--surface);padding:10px 16px;box-shadow:0 -1px 3px rgba(0,0,0,.06);z-index:50}
.btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dk)}.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;color:#fff}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-dk)}
.btn-amber{background:var(--amber);color:#fff}

/* Dialogs (native <dialog>) */
dialog{border:none;border-radius:18px;padding:24px;max-width:300px;width:100%;text-align:center;box-shadow:var(--shadow-lg);color:var(--text);animation:dlgIn .25s ease}
@keyframes dlgIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.dlg-word{font-size:1.5rem;font-weight:800}
.dlg-hindi{font-size:1.2rem;color:var(--purple);font-weight:600;margin-top:4px}
.dlg-desc{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.4}
.dlg-btn{margin-top:14px;padding:8px 24px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}
.dlg-btn:hover{background:var(--blue-dk)}
.lu-icon{font-size:3rem}.lu-title{font-size:1.2rem;font-weight:800;color:var(--amber);margin-top:4px}.lu-sub{font-size:.85rem;color:var(--muted);margin-top:6px}

/* Badge toast */
.badge-toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:12px 20px;box-shadow:var(--shadow-lg);z-index:95;text-align:center;animation:pop .4s ease}
.badge-toast-icon{font-size:2rem}.badge-toast-name{font-size:.8rem;font-weight:800;color:var(--amber)}.badge-toast-desc{font-size:.68rem;color:var(--muted)}

/* Streak combo indicator */
.combo-indicator{position:fixed;top:110px;right:16px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border-radius:12px;padding:6px 12px;font-size:.75rem;font-weight:800;z-index:90;display:none;box-shadow:0 4px 12px rgba(245,158,11,.4);animation:pop .3s ease}
.combo-indicator.show{display:block}

/* CSS 3D */
.css3d-scene{perspective:700px;width:100%;max-width:360px;margin:0 auto;padding:20px 0;touch-action:none}
.css3d-blocks{display:flex;gap:8px;justify-content:center;transform-style:preserve-3d;transition:transform .1s linear;transform:rotateX(-15deg) rotateY(-20deg)}
.css3d-block{width:40px;transition:transform .3s}
.css3d-block-filled{height:60px;background:linear-gradient(135deg,var(--blue),var(--blue-dk));border-radius:6px;box-shadow:0 4px 8px rgba(59,130,246,.3);border:1px solid rgba(255,255,255,.2)}
.css3d-block-empty{height:8px;background:var(--border);border-radius:3px;margin-top:26px}
.css3d-label{text-align:center;font-size:1.2rem;font-weight:800;margin-top:8px;color:var(--blue)}
.css3d-controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
.css3d-btn{padding:6px 14px;background:var(--blue-lt);border:1px solid var(--blue);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--blue)}
.css3d-btn:hover{background:var(--blue);color:#fff}

/* Confetti canvas */
#confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200}

/* Chapter map dialog */
.chap-map{max-width:360px}
.chap-map-title{font-size:1.1rem;font-weight:800;margin-bottom:10px}
.chap-map-list{display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto}
.chap-map-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:.82rem;text-align:left}
.chap-map-item.done{background:var(--green-lt);border:1px solid #86efac}
.chap-map-item.current{background:var(--blue-lt);border:1px solid var(--blue);font-weight:600}
.chap-map-item.locked{opacity:.4}
.chap-map-ic{font-size:1.2rem}

/* Number line interactive */
.numline-container{position:relative;width:100%;max-width:320px;margin:0 auto;height:80px;touch-action:none}
.btn-back{background:var(--surface);color:var(--muted);border:1.5px solid var(--border);padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}.btn-back:active{background:var(--border);transform:scale(.96)}.btn-back:disabled{opacity:.3;pointer-events:none}.bottom-bar{display:flex;gap:8px;align-items:center}.bottom-bar .btn-primary{flex:1}
.dd-tap-item{padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:700;font-size:1rem;transition:all .15s;text-align:center;user-select:none}.dd-tap-item:active{transform:scale(.95)}.dd-tap-item.selected{border-color:var(--blue);background:var(--blue-lt);box-shadow:0 0 0 3px var(--blue-lt)}.dd-tap-item.placed{opacity:.3;pointer-events:none}.dd-tap-zone{padding:8px;border:2px dashed var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .15s;text-align:center;user-select:none;min-height:50px;display:flex;align-items:center;justify-content:center}.dd-tap-zone:active{transform:scale(.95)}.dd-tap-zone.wrong{border-color:var(--red);background:#fee2e2}.dd-tap-zone.correct{border-color:var(--green);background:var(--green-lt)}.dd-placed-piece{display:inline-block;margin:2px;font-size:24px;color:var(--blue)}
</style>
</head>
<body>
<div class="app">
  <div class="brand-header">
    <div class="brand-logo">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/>
          </linearGradient>
          <linearGradient id="vine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#15803d"/><stop offset="50%" stop-color="#22c55e"/><stop offset="100%" stop-color="#4ade80"/>
          </linearGradient>
          <linearGradient id="medal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
        </defs>
        <!-- Left loop: water (infinity left) -->
        <path d="M 48 50 C 48 28, 28 18, 16 28 C 6 36, 8 50, 20 56 C 30 60, 42 56, 48 50 Z" fill="url(#water)" opacity="0.92"/>
        <!-- Water highlights -->
        <path d="M 32 30 C 26 32, 22 38, 24 44" stroke="#bfdbfe" stroke-width="2" fill="none" opacity="0.7"/>
        <circle cx="20" cy="40" r="1.5" fill="#dbeafe" opacity="0.8"/>
        <circle cx="26" cy="48" r="1" fill="#dbeafe" opacity="0.6"/>
        <!-- Right loop: vine (infinity right) -->
        <path d="M 52 50 C 52 72, 72 82, 84 72 C 94 64, 92 50, 80 44 C 70 40, 58 44, 52 50 Z" fill="url(#vine)" opacity="0.92"/>
        <!-- Vine leaves -->
        <ellipse cx="70" cy="38" rx="5" ry="2.5" fill="#22c55e" transform="rotate(-30 70 38)"/>
        <ellipse cx="78" cy="36" rx="4.5" ry="2.5" fill="#16a34a" transform="rotate(20 78 36)"/>
        <ellipse cx="62" cy="62" rx="4" ry="2" fill="#4ade80" transform="rotate(40 62 62)"/>
        <ellipse cx="76" cy="64" rx="4" ry="2.5" fill="#22c55e" transform="rotate(-25 76 64)"/>
        <ellipse cx="86" cy="56" rx="3.5" ry="2" fill="#15803d" transform="rotate(15 86 56)"/>
        <!-- Center crossing -->
        <ellipse cx="50" cy="50" rx="5" ry="4" fill="#1e3a5f" opacity="0.3"/>
        <!-- Book in lower-left loop -->
        <g transform="translate(22 44) rotate(-8)">
          <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#dbeafe" stroke="#1e40af" stroke-width="0.6"/>
          <line x1="0" y1="-4" x2="0" y2="4" stroke="#3b82f6" stroke-width="0.5"/>
          <line x1="-4" y1="-1" x2="-1" y2="-1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="-4" y1="1" x2="-1" y2="1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="1" y1="-1" x2="4" y2="-1" stroke="#93c5fd" stroke-width="0.4"/>
          <line x1="1" y1="1" x2="4" y2="1" stroke="#93c5fd" stroke-width="0.4"/>
        </g>
        <!-- Water drop upper-right loop -->
        <path d="M 68 30 C 66 33, 64 36, 66 38 C 67 39, 69 39, 70 38 C 72 36, 70 33, 68 30 Z" fill="#60a5fa" opacity="0.9"/>
        <circle cx="67" cy="34" r="1" fill="#dbeafe" opacity="0.8"/>
        <!-- Gold medal on far right -->
        <g transform="translate(88 68)">
          <circle r="7" fill="url(#medal)" stroke="#b45309" stroke-width="0.6"/>
          <text x="0" y="1.5" text-anchor="middle" font-size="3" font-weight="bold" fill="#78350f">MERIT</text>
          <text x="0" y="5" text-anchor="middle" font-size="3" font-weight="bold" fill="#78350f">2024</text>
          <path d="M -5 -6 L -7 -11 M 5 -6 L 7 -11" stroke="#d97706" stroke-width="1.5" fill="none"/>
        </g>
        <!-- Small leaf at bottom -->
        <ellipse cx="50" cy="92" rx="3" ry="1.5" fill="#22c55e" transform="rotate(0 50 92)"/>
      </svg>
    </div>
    <div class="brand-info">
      <div class="brand-name">Annanth Aasha Foundation</div>
      <div class="brand-name-hi">अनन्त आशा फाउंडेशन</div>
      <div class="brand-tagline">Safe Learning. Real Impact.</div>
    </div>
  </div>
  <div class="topbar">
    <button class="exit-btn" onclick="App.exit()">✕</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

function rt(text,sm){
  var cls=sm?'lle-text-sm':'lle-text';var html=text;
  html=html.replace(/(\d+)\/(\d+)/g,'<span class="frac"><span class="frac-top">$1</span><span class="frac-bot">$2</span></span>');
  var keys=Object.keys(CONN).sort(function(a,b){return b.length-a.length});
  var connCount=0,result='',i=0;
  while(i<html.length){
    var ch=html[i];
    if(ch==='.'||ch==='!'||ch==='?'){connCount=0;result+=ch;i++;continue;}
    if(ch==='<'){var ci=html.indexOf('>',i);if(ci>=0){result+=html.substring(i,ci+1);i=ci+1;continue;}}
    var matched=false;
    if(i===0||!/[a-zA-Z]/.test(html[i-1])){
      for(var k=0;k<keys.length;k++){
        var c=keys[k];var sub=html.substring(i,i+c.length);
        if(sub.toLowerCase()===c.toLowerCase()){
          var ai=i+c.length;
          if(ai<html.length&&/[a-zA-Z]/.test(html[ai]))continue;
          var hi=CONN[c];connCount++;
          if(connCount<=2){
            result+='<span class="connective" data-w="'+sub+'" data-h="'+hi+'">'+sub+' <span class="connective-hi">('+hi+')</span></span>';
          }else{
            result+='<span class="word" data-w="'+sub.toLowerCase()+'" data-h="'+hi+'">'+sub+'</span>';
          }
          i+=c.length;matched=true;break;
        }
      }
    }
    if(matched)continue;
    if(/[a-zA-Z]/.test(ch)){
      var ws=i;while(i<html.length&&/[a-zA-Z]/.test(html[i]))i++;
      var word=html.substring(ws,i);var cw=word.toLowerCase();var hi=WM[cw];
      if(hi)result+='<span class="word" data-w="'+cw+'" data-h="'+hi+'">'+word+'</span>';
      else result+='<span class="word" data-w="'+cw+'" data-h="">'+word+'</span>';
    }else{result+=ch;i++;}
  }
  return '<div class="'+cls+'">'+result+'</div>';
}

var COLORS={blue:'#3b82f6',green:'#22c55e',purple:'#8b5cf6',amber:'#f59e0b',red:'#ef4444',pink:'#ec4899',teal:'#14b8a6'};

function drawFracBar(canvas,num,den,color,progress){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var p=progress!==undefined?progress:1;
  var segW=w/den;
  for(var i=0;i<den;i++){
    var fillPct=i<num?p:0;
    ctx.fillStyle=i<num?(COLORS[color]||color):'#e2e8f0';
    if(i<num){
      ctx.fillRect(i*segW+2,2,(segW-4)*fillPct,h-4);
      if(fillPct<1){ctx.fillStyle='#e2e8f0';ctx.fillRect(i*segW+2+(segW-4)*fillPct,2,(segW-4)*(1-fillPct),h-4);}
    }else{
      ctx.fillRect(i*segW+2,2,segW-4,h-4);
    }
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.strokeRect(i*segW+2,2,segW-4,h-4);
  }
}

function animateFracBar(canvas,num,den,color){
  var start=performance.now(),dur=600;
  function frame(t){
    var e=Math.min((t-start)/dur,1);
    var eased=1-Math.pow(1-e,3);
    drawFracBar(canvas,num,den,color,eased);
    if(e<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function drawPizza(canvas,fillStates,total){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var cx=w/2,cy=h/2,r=Math.min(w,h)/2-10;
  ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#b45309';ctx.lineWidth=3;ctx.stroke();
  var angle=2*Math.PI/total;
  for(var i=0;i<total;i++){
    var start=i*angle-Math.PI/2,end=(i+1)*angle-Math.PI/2;
    ctx.strokeStyle='#b45309';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(start)*r,cy+Math.sin(start)*r);ctx.stroke();
    if(fillStates[i]){ctx.fillStyle='rgba(251,191,116,0.85)';ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fill();}
  }
}

function drawAreaModel(canvas,rows,cols,fillRows,fillCols,progress){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var p=progress!==undefined?progress:1;
  var cellW=w/cols,cellH=h/rows;
  for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){
    var x=c*cellW,y=r*cellH;var shaded=r<fillRows&&c<fillCols;
    if(shaded){
      ctx.fillStyle='#3b82f6';
      ctx.globalAlpha=p;ctx.fillRect(x+1,y+1,cellW-2,cellH-2);ctx.globalAlpha=1;
    }else{ctx.fillStyle='#e2e8f0';ctx.fillRect(x+1,y+1,cellW-2,cellH-2);}
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.strokeRect(x+1,y+1,cellW-2,cellH-2);
  }}
}

function animateAreaModel(canvas,rows,cols,fillRows,fillCols){
  var start=performance.now(),dur=700;
  function frame(t){
    var e=Math.min((t-start)/dur,1);var eased=1-Math.pow(1-e,3);
    drawAreaModel(canvas,rows,cols,fillRows,fillCols,eased);
    if(e<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function drawNumLine(canvas,markers){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=30,lineY=h/2,lineW=w-pad*2,lineX=pad;
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lineX,lineY);ctx.lineTo(lineX+lineW,lineY);ctx.stroke();
  // ticks
  for(var t=0;t<=4;t++){
    var tx=lineX+(lineW*t/4);
    ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tx,lineY-5);ctx.lineTo(tx,lineY+5);ctx.stroke();
  }
  ctx.fillStyle='#64748b';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.strokeStyle='#64748b';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(lineX,lineY-8);ctx.lineTo(lineX,lineY+8);ctx.stroke();
  ctx.fillText('0',lineX,lineY+24);
  ctx.beginPath();ctx.moveTo(lineX+lineW,lineY-8);ctx.lineTo(lineX+lineW,lineY+8);ctx.stroke();
  ctx.fillText('1',lineX+lineW,lineY+24);
  for(var i=0;i<markers.length;i++){
    var m=markers[i];var mx=lineX+m.pos*lineW;

    ctx.fillStyle=m.color;ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(mx,lineY,14,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(mx,lineY,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=m.color;ctx.font='bold 13px sans-serif';ctx.fillText(m.frac,mx,lineY-14);
  }
}

// ═══ INTERACTIVE CANVAS: Pizza (tap to fill) ═══
function setupPizzaCanvas(canvasId,total,onUpdate){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var states=[];for(var i=0;i<total;i++)states.push(false);
  drawPizza(canvas,states,total);
  var r=canvas.width/2,cx=canvas.width/2,cy=canvas.height/2;
  var angle=2*Math.PI/total;
  function getSlice(x,y){
    var dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>r)return-1;
    var theta=Math.atan2(dy,dx)+Math.PI/2;if(theta<0)theta+=2*Math.PI;
    return Math.floor(theta/angle)%total;
  }
  function handle(e){
    e.preventDefault();var rect=canvas.getBoundingClientRect();var scale=canvas.width/rect.width;
    var x=((e.clientX||e.touches[0].clientX)-rect.left)*scale;
    var y=((e.clientY||e.touches[0].clientY)-rect.top)*scale;
    var idx=getSlice(x,y);if(idx<0)return;
    states[idx]=!states[idx];drawPizza(canvas,states,total);playTone(states[idx]?'tap':'untap');
    var filled=states.filter(function(s){return s}).length;
    if(onUpdate)onUpdate(filled,total);
  }
  canvas.addEventListener('click',handle);canvas.addEventListener('touchstart',handle,{passive:false});
}

// ═══ INTERACTIVE CANVAS: Fraction bar (tap to fill) ═══
function setupBarCanvas(canvasId,den,onUpdate){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var states=[];for(var i=0;i<den;i++)states.push(false);
  function draw(){
    var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
    var segW=w/den;
    for(var i=0;i<den;i++){
      ctx.fillStyle=states[i]?'#3b82f6':'#e2e8f0';ctx.fillRect(i*segW+2,2,segW-4,h-4);
      ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.strokeRect(i*segW+2,2,segW-4,h-4);
    }
  }
  draw();
  function handle(e){
    e.preventDefault();var rect=canvas.getBoundingClientRect();var scale=canvas.width/rect.width;
    var x=((e.clientX||e.touches[0].clientX)-rect.left)*scale;
    var idx=Math.floor(x/(canvas.width/den));if(idx<0||idx>=den)return;
    states[idx]=!states[idx];draw();playTone(states[idx]?'tap':'untap');
    var filled=states.filter(function(s){return s}).length;
    if(onUpdate)onUpdate(filled,den);
  }

}

var _audioCtx=null;
function getAudio(){if(!_audioCtx){try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _audioCtx;}
function playTone(type){
  var ctx=getAudio();if(!ctx)return;
  var now=ctx.currentTime;
  var freqs={tap:523,untap:392,correct:[523,659,784],wrong:[311,233],levelup:[523,659,784,1047],complete:[523,659,784,1047,1319]};
  var f=freqs[type]||523;
  if(typeof f==='number'){
    var osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.frequency.value=f;osc.type='sine';
    gain.gain.setValueAtTime(0.15,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+0.3);
  }else{
    for(var i=0;i<f.length;i++){
      var osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.frequency.value=f[i];osc.type='sine';
      var t=now+i*0.1;
      gain.gain.setValueAtTime(0.15,t);gain.gain.exponentialRampToValueAtTime(0.001,t+0.25);
      osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+0.25);
    }
  }
}

var _confetti=[],_confettiRAF=null;
function fireConfetti(count){
  var canvas=document.getElementById('confettiCanvas');

  var ctx=canvas.getContext('2d');
  var colors=['#3b82f6','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6'];
  count=count||50;
  for(var i=0;i<count;i++){
    _confetti.push({
      x:canvas.width/2+(Math.random()-0.5)*100,y:canvas.height/3,
      vx:(Math.random()-0.5)*8,vy:-Math.random()*8-4,
      g:0.3,size:Math.random()*6+4,color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,vrot:(Math.random()-0.5)*10,life:1
    });
  }
  if(!_confettiRAF)_confettiRAF=requestAnimationFrame(updateConfetti);
}
function updateConfetti(){
  var canvas=document.getElementById('confettiCanvas');var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(var i=_confetti.length-1;i>=0;i--){
    var p=_confetti[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vrot;p.life-=0.008;
    if(p.y>canvas.height+20||p.life<=0){_confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
    ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  }
  if(_confetti.length>0){_confettiRAF=requestAnimationFrame(updateConfetti);}
  else{_confettiRAF=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
}

function drawGridShape(canvas,rows,cols,color,label){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=20;var gw=w-pad*2,gh=h-pad*2;
  var cellW=gw/cols,cellH=gh/rows;var gx=pad,gy=pad;
  for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){
    var x=gx+c*cellW,y=gy+r*cellH;
    ctx.fillStyle=(COLORS[color]||color)+'40';ctx.fillRect(x,y,cellW-1,cellH-1);
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW-1,cellH-1);
  }}
  ctx.fillStyle='#1e293b';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText(cols+' cols',gx+gw/2,gy-6);
  ctx.save();ctx.translate(gx-6,gy+gh/2);ctx.rotate(-Math.PI/2);
  ctx.fillText(rows+' rows',0,0);ctx.restore();
  if(label){ctx.font='bold 13px sans-serif';ctx.fillStyle=COLORS[color]||color;

function drawLShape(canvas,color,label){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=30;var gw=w-pad*2,gh=h-pad*2;
  // L-shape: top-left rectangle (4 cols x 2 rows) + bottom-left rectangle (2 cols x 3 rows)
  // Total: 4 wide x 5 tall, with notch cut from bottom-right
  var totalW=4,totalH=5,notchW=2,notchH=3;
  var scale=Math.min(gw/totalW,gh/totalH);
  var dw=totalW*scale,dh=totalH*scale;var dx=(w-dw)/2,dy=(h-dh)/2;
  var nw=notchW*scale,nh=notchH*scale;
  // Fill the L-shape using two rectangles
  ctx.fillStyle=(COLORS[color]||color)+'40';
  // Top rectangle (full width, top 2 rows)
  var topH=(totalH-notchH)*scale;
  ctx.fillRect(dx,dy,dw,topH);
  // Bottom-left rectangle (notchW wide, bottom notchH rows)
  ctx.fillRect(dx,dy+topH,nw,nh);
  // Outline
  ctx.strokeStyle=COLORS[color]||color;ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(dx,dy);ctx.lineTo(dx+dw,dy);ctx.lineTo(dx+dw,dy+topH);
  ctx.lineTo(dx+nw,dy+topH);ctx.lineTo(dx+nw,dy+dh);
  ctx.lineTo(dx,dy+dh);ctx.closePath();ctx.stroke();
  // Split line (dashed)
  ctx.setLineDash([5,4]);ctx.strokeStyle=(COLORS[color]||color)+'80';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(dx,dy+topH);ctx.lineTo(dx+nw,dy+topH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(dx+nw,dy+topH);ctx.lineTo(dx+nw,dy+dh);ctx.stroke();
  ctx.setLineDash([]);
  // Labels
  ctx.fillStyle='#1e293b';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('4',dx+dw/2,dy+topH/2+4);
  ctx.fillText('2',dx+nw/2,dy+topH+nh/2+4);
  if(label){ctx.font='bold 13px sans-serif';ctx.fillStyle=COLORS[color]||color;
    ctx.fillText(label,dx+dw/2,dy+dh+18);}
}

function drawShapeOnCanvas(canvas,shapeIdx){

    ctx.fillText('6 cm',0,0);ctx.restore();
  }else{
    // Regular polygon
    ctx.beginPath();
    for(var i=0;i<sides;i++){
      var a=i*2*Math.PI/sides-Math.PI/2;
      var px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);

    var sideLenLabel=shapeIdx===0?'8 cm':(shapeIdx===2?'7 cm':'5 cm');

    var a0=-Math.PI/2+Math.PI/sides;
    ctx.fillText(sideLenLabel,cx+Math.cos(a0)*(r-20),cy+Math.sin(a0)*(r-20)+4);
  }
  // Name + perimeter
  var perim=shapeIdx===1?(2*(10+6)):(sides*[8,0,7,5][shapeIdx]);

function drawAreaGridCanvas(canvas,rows,cols){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=15;var gw=w-pad*2,gh=h-pad*2;
  var cellW=gw/cols,cellH=gh/rows;
  for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){
    var x=pad+c*cellW,y=pad+r*cellH;
    ctx.fillStyle='#3b82f640';ctx.fillRect(x,y,cellW-1.5,cellH-1.5);
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW-1.5,cellH-1.5);
  }}
  ctx.fillStyle='#1e293b';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  ctx.fillText(cols+' × '+rows+' = '+(cols*rows)+' sq units',w/2,h-4);
}

function drawAreaSplitCanvas(canvas){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  var pad=20;var gw=w-pad*2,gh=h-pad*2;
  var totalW=4,totalH=5,notchW=2,notchH=3;
  var scale=Math.min(gw/totalW,gh/totalH);
  var dw=totalW*scale,dh=totalH*scale;var dx=(w-dw)/2,dy=(h-dh-20)/2;
  var nw=notchW*scale,nh=notchH*scale,topH=(totalH-notchH)*scale;
  // Rectangle A (top, full width, 2 rows tall) - blue
  ctx.fillStyle='#3b82f640';ctx.fillRect(dx,dy,dw,topH);
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.strokeRect(dx,dy,dw,topH);
  // Rectangle B (bottom-left, 2 wide, 3 tall) - green
  ctx.fillStyle='#22c55e40';ctx.fillRect(dx,dy+topH,nw,nh);
  ctx.strokeStyle='#22c55e';ctx.lineWidth=2.5;ctx.strokeRect(dx,dy+topH,nw,nh);
  // Labels
  ctx.fillStyle='#1e293b';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('A',dx+dw/2,dy+topH/2+4);
  ctx.fillText('B',dx+nw/2,dy+topH+nh/2+4);
  ctx.fillStyle='#3b82f6';ctx.font='bold 11px sans-serif';
  ctx.fillText('4×2=8',dx+dw/2,dy+topH/2+18);
  ctx.fillStyle='#22c55e';
  ctx.fillText('2×3=6',dx+nw/2,dy+topH+nh/2+18);
  ctx.fillStyle='#16a34a';ctx.font='bold 13px sans-serif';
  ctx.fillText('Total = 8 + 6 = 14 sq units',w/2,h-4);
}

function drawPerimVsAreaCanvas(canvas){
  var ctx=canvas.getContext('2d');var w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);
  // Three rectangles with same perimeter (16) but different areas
  var rects=[{l:5,b:3,a:15},{l:4,b:4,a:16},{l:6,b:2,a:12}];
  var colors=['#3b82f6','#22c55e','#f59e0b'];
  var sectionW=w/3;
  for(var i=0;i<3;i++){
    var r=rects[i];var sx=i*sectionW+8,sw=sectionW-16;
    var maxDim=Math.min(sw,h-55);var sc=maxDim/6; // max side is 6
    var dw=r.l*sc,dh=r.b*sc;var dx=sx+(sw-dw)/2,dy=10;
    ctx.fillStyle=colors[i]+'30';ctx.fillRect(dx,dy,dw,dh);
    ctx.strokeStyle=colors[i];ctx.lineWidth=2;ctx.strokeRect(dx,dy,dw,dh);
    ctx.fillStyle='#1e293b';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
    ctx.fillText(r.l+'×'+r.b,sx+sw/2,dy-2);
    ctx.fillStyle=colors[i];ctx.font='bold 10px sans-serif';
    ctx.fillText('P=16',sx+sw/2,dy+dh+14);
    ctx.fillStyle='#64748b';ctx.font='9px sans-serif';
    ctx.fillText('A='+r.a,sx+sw/2,dy+dh+26);
  }
  ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('Same P=16, but areas differ!',w/2,h-4);
}

  updateStats:function(){
    document.getElementById('statCoins').textContent=this.coins;
    document.getElementById('statXp').textContent=this.xp;
    document.getElementById('statLvl').textContent='Lv '+this.level;
    var sw=document.getElementById('statStreakWrap');
    if(this.streak>=2){sw.style.display='inline-flex';document.getElementById('statStreak').textContent=this.streak;}
    else{sw.style.display='none';}
  },
  checkLevelUp:function(){
    var nl=1;for(var i=LEVELS.length-1;i>=0;i--){if(this.xp>=LEVELS[i].xp){nl=i+1;break}}
    if(nl>this.level){
      this.level=nl;var lv=LEVELS[this.level-1];
      var d=document.getElementById('levelUpDialog');
      document.getElementById('luIcon').textContent=lv.ic;
      document.getElementById('luTitle').textContent='Level '+this.level+': '+lv.name+'!';
      document.getElementById('luSub').textContent='You earned '+this.xp+' XP. Keep going!';
      if(!d.open)d.showModal();
      playTone('levelup');fireConfetti(80);
    }
  },
  checkBadges:function(){
    var checks=[{idx:1,id:"first"},{idx:6,id:"add"},{idx:9,id:"mult"},{idx:10,id:"div"},{idx:10,id:"champ"}];
    for(var i=0;i<checks.length;i++){var c=checks[i];
      if(this.nIdx>=c.idx&&!earnedBadges[c.id]){
        earnedBadges[c.id]=true;
        var b=BADGES.filter(function(x){return x.id===c.id})[0];
        if(b)this.showBadge(b);
      }
    }
  },
  showBadge:function(b){
    var t=document.createElement('div');t.className='badge-toast';
    t.innerHTML='<div class="badge-toast-icon">'+b.ic+'</div><div class="badge-toast-name">'+b.name+'</div><div class="badge-toast-desc">'+b.desc+'</div>';
    document.body.appendChild(t);setTimeout(function(){try{t.remove()}catch(e){}},3000);
  },
  awardXP:function(amount){
    var bonus=0;
    if(this.streak>=3)bonus=Math.floor(amount*0.5);
    else if(this.streak>=2)bonus=Math.floor(amount*0.25);
    var total=amount+bonus;
    this.xp+=total;
    if(bonus>0){this.showCombo(bonus);}
    bumpStat('statXp');
    this.updateStats();var bk=document.getElementById("backBtn");if(bk){bk.disabled=(this.nIdx===0&&this.sIdx===0);}

  renderVideo:function(step,cb){
  var self=this;
  var html='<div class="instruction">'+rt(step.instruction)+'</div>';
  html+='<div class="card" style="padding:0;overflow:hidden">';
  html+='<div id="videoStage" style="position:relative;width:100%;height:'+step.height+'px;background:#0f172a;border-radius:12px;overflow:hidden">';
  html+='<div id="playOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10;cursor:pointer"><div style="width:64px;height:64px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff">\u25B6</div></div>';
  html+='<canvas id="vidCanvas" width="350" height="'+step.height+'" style="max-width:100%;display:block"></canvas>';
  html+='</div>';
  html+='<div style="padding:8px 12px;background:var(--surface);display:flex;align-items:center;gap:8px"><span id="vidTime" style="font-size:.7rem;color:var(--muted)">0:00</span><div style="flex:1;height:4px;background:var(--border);border-radius:4px;overflow:hidden"><div id="vidProg" style="height:100%;width:0%;background:var(--blue);transition:width .2s"></div></div><span style="font-size:.7rem;color:var(--muted)">'+step.duration+'</span></div>';
  html+='</div>';
  if(step.think){
    html+='<div class="discovery-box" style="margin-top:12px"><div class="d-title">Think!</div><div class="d-text">'+rt(step.think)+'</div></div>';
    html+='<div class="hint">Tap any word for Hindi meaning</div>';
  }
  document.getElementById('screen').innerHTML=html;
  document.getElementById('bottomBar').style.display='block';
  cb.textContent='Continue \u2192';cb.className='btn btn-primary';cb.disabled=false;
  var playing=false,frame=0,totalFrames=step.frames||60;
  var canvas=document.getElementById('vidCanvas');
  var ctx=canvas?canvas.getContext('2d'):null;
  var overlay=document.getElementById('playOverlay');
  var progBar=document.getElementById('vidProg');
  var timeEl=document.getElementById('vidTime');
  var animId=null;
  function drawFrame(){
    if(!ctx)return;
    var w=canvas.width,h=canvas.height;
    ctx.clearRect(0,0,w,h);
    var progress=frame/totalFrames;
    try{step.draw(ctx,w,h,progress,frame);}catch(e){}
    if(progBar)progBar.style.width=(progress*100)+'%';
    if(timeEl){var sec=Math.floor(progress*parseInt(step.duration.replace(':','')));timeEl.textContent='0:'+String(sec).padStart(2,'0');}
  }
  function animate(){
    if(!playing)return;
    frame++;
    drawFrame();
    if(frame>=totalFrames){playing=false;if(overlay)overlay.style.display='flex';return;}
    animId=requestAnimationFrame(animate);
  }
  if(overlay){overlay.addEventListener('click',function(){if(frame>=totalFrames)frame=0;playing=true;overlay.style.display='none';animate();});}
  drawFrame();
},

    document.getElementById('shapeInfo').textContent=names[this._shapeIdx]+' · P = '+sides[this._shapeIdx]+' sides · total = '+perims[this._shapeIdx]+' cm';
  },
  prevShape:function(){
    this._shapeIdx=(this._shapeIdx+3)%4;
    drawShapeOnCanvas(document.getElementById('ixShape'),this._shapeIdx);
    var names=['Square','Rectangle','Triangle','Pentagon'];
    var perims=[32,32,21,25];
    var sides=[4,4,3,5];
    document.getElementById('shapeInfo').textContent=names[this._shapeIdx]+' · P = '+sides[this._shapeIdx]+' sides · total = '+perims[this._shapeIdx]+' cm';
  },

  // ── Interactive: Rectangle Lab ──
  renderIXRectLab:function(step,cb){
    this._rl_l=5;this._rl_b=4;
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="game-card"><canvas id="ixRL" width="320" height="200" style="width:100%;max-width:320px"></canvas><div style="display:flex;gap:12px;justify-content:center;margin-top:10px"><div style="text-align:center"><div style="font-size:.75rem;color:var(--muted)">Length</div><button class="css3d-btn" onclick="App.rlL(-1)">−</button> <span id="rlLval" style="font-weight:700;font-size:1.1rem">5</span> <button class="css3d-btn" onclick="App.rlL(1)">+</button></div><div style="text-align:center"><div style="font-size:.75rem;color:var(--muted)">Breadth</div><button class="css3d-btn" onclick="App.rlB(-1)">−</button> <span id="rlBval" style="font-weight:700;font-size:1.1rem">4</span> <button class="css3d-btn" onclick="App.rlB(1)">+</button></div></div></div>'+(step.text?'<div style="margin-top:8px">'+rt(step.text,true)+'</div>':'');
    drawRectLab(document.getElementById('ixRL'),5,4);
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },
  rlL:function(d){this._rl_l=Math.max(1,Math.min(12,this._rl_l+d));document.getElementById('rlLval').textContent=this._rl_l;drawRectLab(document.getElementById('ixRL'),this._rl_l,this._rl_b);},
  rlB:function(d){this._rl_b=Math.max(1,Math.min(8,this._rl_b+d));document.getElementById('rlBval').textContent=this._rl_b;drawRectLab(document.getElementById('ixRL'),this._rl_l,this._rl_b);},

  // ── Interactive: Area Grid ──
  renderIXAreaGrid:function(step,cb){
    this._ag_r=3;this._ag_c=5;
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="game-card"><canvas id="ixAG" width="320" height="220" style="width:100%;max-width:320px"></canvas><div style="display:flex;gap:12px;justify-content:center;margin-top:10px"><div style="text-align:center"><div style="font-size:.75rem;color:var(--muted)">Rows</div><button class="css3d-btn" onclick="App.agR(-1)">−</button> <span id="agRval" style="font-weight:700;font-size:1.1rem">3</span> <button class="css3d-btn" onclick="App.agR(1)">+</button></div><div style="text-align:center"><div style="font-size:.75rem;color:var(--muted)">Columns</div><button class="css3d-btn" onclick="App.agC(-1)">−</button> <span id="agCval" style="font-weight:700;font-size:1.1rem">5</span> <button class="css3d-btn" onclick="App.agC(1)">+</button></div></div></div>'+(step.text?'<div style="margin-top:8px">'+rt(step.text,true)+'</div>':'');
    drawAreaGridCanvas(document.getElementById('ixAG'),3,5);
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },
  agR:function(d){this._ag_r=Math.max(1,Math.min(8,this._ag_r+d));document.getElementById('agRval').textContent=this._ag_r;drawAreaGridCanvas(document.getElementById('ixAG'),this._ag_r,this._ag_c);},
  agC:function(d){this._ag_c=Math.max(1,Math.min(12,this._ag_c+d));document.getElementById('agCval').textContent=this._ag_c;drawAreaGridCanvas(document.getElementById('ixAG'),this._ag_r,this._ag_c);},

  // ── Interactive: Area Split (L-shape) ──
  renderIXAreaSplit:function(step,cb){
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="game-card"><canvas id="ixAS" width="280" height="240" style="width:100%;max-width:280px"></canvas></div>'+(step.text?'<div style="margin-top:8px">'+rt(step.text,true)+'</div>':'');
    drawAreaSplitCanvas(document.getElementById('ixAS'));
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },

  // ── Interactive: Perimeter vs Area ──
  renderIXPerimVsArea:function(step,cb){
    document.getElementById('screen').innerHTML='<div class="instruction">'+rt(step.instruction,true).replace(/^<div class="lle-text-sm">/,'').replace(/<\/div>$/,'')+'</div><div class="game-card"><canvas id="ixPV" width="320" height="180" style="width:100%;max-width:320px"></canvas></div>'+(step.text?'<div style="margin-top:8px">'+rt(step.text,true)+'</div>':'');
    drawPerimVsAreaCanvas(document.getElementById('ixPV'));
    document.getElementById('bottomBar').style.display='block';cb.textContent='Continue';cb.className='btn btn-primary';cb.disabled=false;
  },

  // ── Navigation ──
  next:function(){
    var step=NODES[this.nIdx].steps[this.sIdx];
    if(step.t==='worked'&&this.weStepIdx>0&&this.weStepIdx<=step.we.steps.length){var prevStep=step.we.steps[this.weStepIdx-1];if(prevStep&&prevStep.check&&!this.weStepCheckPassed){if(!this.weStepCheckAnswered&&this.selStepOpt!=null){this.checkWEStepCheck();return;}if(this.weStepCheckAnswered&&!this.weStepCheckPassed){return;}if(!this.weStepCheckAnswered&&this.selStepOpt==null){return;}}}if(step.t==='worked'&&this.weStepIdx<step.we.steps.length){this.weStepCheckPassed=false;this.weStepCheckAnswered=false;this.selStepOpt=null;this.showNextWE(step.we,document.getElementById('continueBtn'));return;}if(step.t==='worked'&&this.weStepIdx>=step.we.steps.length&&step.we.check&&!this.weChecked){if(!this._weCheckRendered){this.showNextWE(step.we,document.getElementById('continueBtn'));return;}if(this._weCheckRendered&&!this.weCheckAnswered){this.checkWECheck();return;}if(this.weCheckAnswered&&!this.weChecked){return;}if(this.weChecked){var weOpts=this._weCheckOpts||step.we.check.opts;var weOpt=weOpts[this.selOpt];if(!weOpt){this.weChecked=false;return;}if(!weOpt.c)return;}}
    if(step.t==='solve'){var sl=step.sl;if(this.solveStepIdx>=sl.steps.length){this.advance();return;}if(!this.solveAnswered){this.checkSolve();return;}var sStep=sl.steps[this.solveStepIdx],wasCorrect=false;if(sStep.type==='mcq'&&this.selOpt!=null){var slqOpts2=this._slqOpts||sStep.opts;wasCorrect=slqOpts2[this.selOpt].c;}else if(sStep.type==='input'){var inp=document.getElementById('slInput');wasCorrect=inp&&(inp.value.trim()===sStep.answer||inp.value.trim()===sStep.answer.replace(/\s/g,''));}if(!wasCorrect)return;this.solveStepIdx++;this.showSolveStep(sl,document.getElementById('continueBtn'));return;}
    if(step.t==='quiz'&&!this.answered){this.checkQuiz();return;}
    if(step.t==='quiz'&&this.answered){var qOpts=this._qOpts||step.q.opts;var opt=qOpts[this.selOpt];if(!opt||!opt.c)return;}
    if(step.t==='vq'&&!this.answered){this.checkVQ();return;}
    if(step.t==='vq'&&this.answered){var vqOpts=this._qOpts||step.q.opts;var opt2=vqOpts[this.selOpt];if(!opt2||!opt2.c)return;}
    if(step.t==='progress'&&!step.next){this.nIdx=0;this.sIdx=0;this.tapCount=0;this.tapped={};this.weStepIdx=0;this.solveStepIdx=0;this.solveAnswered=false;this.answered=false;this.selOpt=null;this._qOpts=null;this._slqOpts=null;this.save();this.render();return;}
    this.advance();
  },
  goBack:function(){if(this.sIdx>0){this.sIdx--;this.tapCount=0;this.tapped={};this.weStepIdx=0;this.solveStepIdx=0;this.solveAnswered=false;this.answered=false;this.selOpt=null;this._qOpts=null;this._slqOpts=null;this.save();this.render();return;}if(this.nIdx>0){this.nIdx--;this.sIdx=NODES[this.nIdx].steps.length-1;this.tapCount=0;this.tapped={};this.weStepIdx=0;this.solveStepIdx=0;this.solveAnswered=false;this.answered=false;this.selOpt=null;this._qOpts=null;this._slqOpts=null;this.save();this.render();return;}},
  advance:function(){this.sIdx++;this.answered=false;this.selOpt=null;this.weStepIdx=0;this.weChecked=false;this.weCheckAnswered=false;this._weCheckRendered=false;this.weStepCheckPassed=false;this.weStepCheckAnswered=false;this.selStepOpt=null;this.solveStepIdx=0;this.solveAnswered=false;this._qOpts=null;this._slqOpts=null;if(this.sIdx>=NODES[this.nIdx].steps.length){this.nIdx++;this.sIdx=0;this.tapCount=0;this.tapped={};if(this.nIdx>=NODES.length){this.nIdx=NODES.length-1;this.sIdx=NODES[this.nIdx].steps.length-1;return;}}this.save();this.render();}
};
App.init();

</script>
